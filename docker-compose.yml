services:
  scp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scp
    env_file:
      - .env
    ports:
      - "3787:3787"
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3787/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
