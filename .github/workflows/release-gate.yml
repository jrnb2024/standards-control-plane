# WP-SCP-022 020H.3 — release gate.
#
# Two operating modes — IMPORTANT architectural framing (closes
# 020H.3 R1 CRIT-SAFE-001):
#
# 1. **Dry-run pre-flight (workflow_dispatch).** The OPERATOR runs
#    this workflow with `dry_run_tag=v<X>.<Y>.<Z>` BEFORE pushing
#    the tag. If the run exits clean, the tag is safe to push. This
#    is the **pre-emptive enforcement** path. Operators MUST run
#    dry-run before every tag-push per policies/VERSIONING.md
#    'Tag-cut procedure' section.
#
# 2. **Post-tag observer (push:tags:['v*']).** GitHub Actions cannot
#    block a `push:tags` event — by the time the workflow fires, the
#    tag already exists on the remote. This trigger therefore acts
#    as a LAST-LINE-OF-DEFENSE observer: it annotates the bad tag
#    with SCP-EREL-001 ::error:: AND opens a `release-gate-violation`
#    GitHub issue auto-assigned to @jrnb2024 (closes TF-020H3rg-003
#    in slice 020H.3.1 — the post-tag observer's last-line-of-defense
#    alarm now actually surfaces beyond the workflow log). The bad
#    tag itself is immutable per D-030
#    (tag-protection ruleset blocks deletion); recovery is via cutting
#    a corrected v<X>.<Y+1>.0 — see VERSIONING.md 'Bad-tag recovery
#    procedure'.
#
# Both modes evaluate the same TWO invariants:
#
# (a) policies/deprecations.yaml has no entry whose target_release
#     matches the candidate AND announced_release is not at least
#     one MINOR behind. Closes WP-SCP-022 020H.1 TF-020H1-001 (the
#     deprecation-ramp enforcement promised by policies/VERSIONING.md
#     (ii)).
#
# (b) .scp/rule-config.yaml (in the SCP repo itself, if it exists)
#     has no entry with `disable: true` AND `expires_at < <UTC date>`.
#     Closes WP-SCP-022 020C.1 TF-005.
#
# Annotation contract: `SCP-EREL-001` (release-gate refusal). Per
# policies/VERSIONING.md adding a new error-code title to the
# infrastructure code set is a workflow change, not a rule
# proposal — this code is registered here at slice 020H.3.
#
# References:
#   - policies/VERSIONING.md (semver contract + deprecation ramp)
#   - policies/deprecations.yaml (the live register)
#   - schemas/deprecations.schema.json (validates the register)
#   - docs/DECISIONS.md D-036 (estate doctrine ratification of VERSIONING.md)

name: release-gate

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: "Tag to evaluate as if it were being cut (e.g. v1.1.0). Used to verify the gate before pushing the tag."
        type: string
        required: true
        default: "v1.0.0"

permissions:
  # Default permissions (apply to the release-gate evaluation job).
  # Closes 020H.3.1 R1 SAFE-MAJ-001: workflow-default is contents:read
  # only; issues:write is granted at the job level for the
  # release-gate-violation-issue job alone, narrowing the privilege
  # surface so the gate-evaluation steps (pip install, schema
  # validation, Python ramp/expired-config checks) cannot
  # accidentally open issues.
  contents: read

# Serialise concurrent invocations so two parallel tag-cut attempts
# (which is structurally rare on a personal account but possible via
# workflow_dispatch + a real tag push) don't race the deprecation
# evaluation.
concurrency:
  # Use the candidate tag as the group key so dry-runs against
  # different tags don't queue behind each other, AND a real
  # push:tags is still serialised against any in-flight dry-run for
  # the same tag (closes 020H.3 R1 nit-SAFE-007 + COR-MIN-003 —
  # github.event.inputs.dry_run_tag is empty on push events,
  # github.ref is `refs/tags/v...` on push events; the expression
  # picks the first truthy value).
  group: release-gate-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    # Outputs consumed by the release-gate-violation-issue job below.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      mode: ${{ steps.tag.outputs.mode }}
    env:
      # Pass workflow_dispatch input via env to avoid direct ${{ }}
      # expansion inside `run:` (020B security pattern).
      INPUT_DRY_RUN_TAG: ${{ inputs.dry_run_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pyyaml + jsonschema (hash-pinned via requirements/policy-check.txt)
        shell: bash
        run: |
          set -euo pipefail
          # Hash-pinned install via requirements/policy-check.txt (generated
          # by pip-compile --generate-hashes from requirements/policy-check.in).
          # Top-level pins match policy-check.yml's caller-data and waiver
          # validation steps so the SCP-source's two YAML/JSON-validating
          # workflows track a single supply-chain lockfile. Closes 020H.3 R1
          # COR-MAJ-001 (single-pin tracking) and TF-020H3rg-002 (--require-hashes
          # tightening) — slice 020M.
          python3 -m pip install --quiet --user --require-hashes -r requirements/policy-check.txt
          # Version-pin assertion: confirm the pinned versions are now active
          # (closes 020M R1 SAFE-MAJ-002 — defends against runner-preinstall
          # version mismatch on hosted ubuntu-24.04 runners which preinstall
          # pyyaml 6.0.1 from apt).
          python3 -c 'import yaml, jsonschema; assert yaml.__version__ == "6.0.2", f"pyyaml: {yaml.__version__}"; assert jsonschema.__version__ == "4.23.0", f"jsonschema: {jsonschema.__version__}"'

      - name: Resolve candidate tag
        id: tag
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_DRY_RUN_TAG}"
            mode="dry-run"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            mode="enforce"
          else
            echo "::error::release-gate triggered without a v* tag ref or dry_run_tag input; refusing to evaluate"
            exit 1
          fi
          # Validate semver shape — the schema already enforces this on
          # deprecations entries; we apply the same regex to the
          # candidate tag.
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.github/workflows/release-gate.yml,title=SCP-EREL-001::candidate tag '${tag}' does not match v<MAJOR>.<MINOR>.<PATCH>; refuse"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          printf '\n=== release-gate: evaluating %s in %s mode ===\n' "${tag}" "${mode}"

      - name: Validate policies/deprecations.yaml against schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          import yaml
          from jsonschema import Draft202012Validator, FormatChecker

          with open("policies/deprecations.yaml") as f:
              data = yaml.safe_load(f) or {"deprecations": []}
          with open("schemas/deprecations.schema.json") as f:
              schema = json.load(f)

          # FormatChecker activates the format: date constraint on
          # announced_at (closes 020H.3 R1 COR-MIN-001). Without it the
          # constraint is silently skipped — a malformed date string
          # would pass schema validation.
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(data), key=lambda e: list(e.absolute_path))
          if errors:
              print("::error file=policies/deprecations.yaml,title=SCP-EREL-001::deprecations register fails schema validation:")
              for e in errors:
                  path = ".".join(str(p) for p in e.absolute_path) or "<root>"
                  print(f"  - {path}: {e.message}")
              sys.exit(1)
          print(f"deprecations register validated; {len(data.get('deprecations', []))} active entries")
          PY

      - name: Check deprecation-ramp invariant
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import yaml

          candidate = os.environ["CANDIDATE_TAG"]  # e.g. v1.1.0

          def parse(tag):
              parts = tag[1:].split(".")
              return tuple(int(p) for p in parts)

          cand_major, cand_minor, cand_patch = parse(candidate)

          with open("policies/deprecations.yaml") as f:
              data = yaml.safe_load(f) or {"deprecations": []}

          violations = []
          warnings = []
          for entry in data.get("deprecations", []):
              target = entry["target_release"]
              announced = entry["announced_release"]
              ann_major, ann_minor, ann_patch = parse(announced)
              tgt_major, tgt_minor, tgt_patch = parse(target)

              # Closes 020H.3 R1 COMP-MAJ-001: VERSIONING.md states
              # 'the MAJOR bump is the breaking-change vehicle' — refuse
              # any deprecation whose target_release is not vX.0.0.
              if (tgt_minor, tgt_patch) != (0, 0):
                  violations.append({
                      "surface_kind": entry["surface_kind"],
                      "surface_id": entry["surface_id"],
                      "announced_release": announced,
                      "target_release": target,
                      "reason": f"target_release {target} is not a MAJOR release (vX.0.0); per policies/VERSIONING.md the MAJOR bump is the breaking-change vehicle for surface removal",
                  })
                  continue

              # Closes 020H.3 R1 MAJ-SAFE-004: tampering-pattern warnings
              # for suspicious deprecation shapes that pass the basic
              # ramp check. Emit ::warning:: (not ::error::) so the
              # operator sees the signal but the gate doesn't refuse on
              # legitimate edge cases.
              # Guard with `target != candidate` so we don't double-fire
              # alongside the structural-inconsistency error below for
              # target-matched entries (closes 020H.3 R2 COR-nit-003).
              if ann_major < cand_major - 1 and target != candidate:
                  warnings.append(
                      f"{entry['surface_kind']}/{entry['surface_id']}: "
                      f"announced_release {announced} is more than one major behind candidate {candidate} — verify this is not a backdated entry"
                  )

              if target != candidate:
                  continue  # not a deprecation due in THIS release

              # Same-major: announced must be at least one MINOR behind target.
              # Major bump: announced must be at least one MINOR behind on the
              # PRIOR major.
              if ann_major == cand_major:
                  if (cand_minor - ann_minor) < 1:
                      violations.append({
                          "surface_kind": entry["surface_kind"],
                          "surface_id": entry["surface_id"],
                          "announced_release": announced,
                          "target_release": target,
                          "reason": f"deprecation announced in {announced} cannot be removed in {target} — one MINOR release must elapse (per policies/VERSIONING.md (ii) one-release deprecation ramp)",
                      })
              elif ann_major == cand_major - 1:
                  # Major-bump removal — accepted (major bump IS the
                  # removal vehicle).
                  pass
              else:
                  violations.append({
                      "surface_kind": entry["surface_kind"],
                      "surface_id": entry["surface_id"],
                      "announced_release": announced,
                      "target_release": target,
                      "reason": f"announced_release {announced} is too far behind target_release {target} (more than one major); deprecation entry is structurally inconsistent",
                  })

          for w in warnings:
              print(f"::warning file=policies/deprecations.yaml,title=SCP-EREL-001-warn::{w}")

          if violations:
              for v in violations:
                  print(
                      f"::error file=policies/deprecations.yaml,title=SCP-EREL-001::"
                      f"{v['surface_kind']}/{v['surface_id']}: {v['reason']}"
                  )
              print(f"\nrefused: {len(violations)} deprecation-ramp violation(s) for tag {candidate}")
              sys.exit(1)

          print(f"deprecation-ramp invariant: clean for tag {candidate}")
          PY

      - name: Check expired rule-config entries
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f .scp/rule-config.yaml ]; then
            echo ".scp/rule-config.yaml absent on SCP repo; expired-config check skipped"
            exit 0
          fi
          python3 - <<'PY'
          import datetime
          import sys
          import yaml

          with open(".scp/rule-config.yaml") as f:
              data = yaml.safe_load(f) or {}

          # The schema for rule-config is tracked at schemas/rule-config.schema.json;
          # here we only need the disable + expires_at fields for the
          # release-gate check. Schema validation for rule-config happens in
          # policy-check.yml at PR time (SCP-E007).

          # UTC-anchored comparison so the gate's "today" is timezone-
          # deterministic regardless of runner locale (closes 020H.3 R1
          # MIN-SAFE-005 + COR-nit-001). policy-check.yml's expired-rule-config
          # warning step uses the same UTC-anchored pattern.
          today = datetime.datetime.now(datetime.timezone.utc).date()
          violations = []
          for rule_id, entry in (data.get("rules") or {}).items():
              if not entry.get("disable", False):
                  continue
              expires_str = entry.get("expires_at")
              if not expires_str:
                  continue
              try:
                  if "T" in expires_str:
                      expires = datetime.datetime.fromisoformat(expires_str.replace("Z", "+00:00")).date()
                  else:
                      expires = datetime.date.fromisoformat(expires_str)
              except ValueError as exc:
                  violations.append((rule_id, expires_str, f"invalid expires_at: {exc}"))
                  continue
              if expires < today:
                  violations.append((rule_id, expires_str, f"expired {(today - expires).days} day(s) ago (UTC)"))

          if violations:
              for rule_id, expires_str, reason in violations:
                  print(
                      f"::error file=.scp/rule-config.yaml,title=SCP-EREL-001::"
                      f"{rule_id}: rule-config disable expired ({reason}); refuse to cut release tag while disable persists past its expiry"
                  )
              print(f"\nrefused: {len(violations)} expired rule-config entr(ies)")
              sys.exit(1)

          print("rule-config expired-entries check: clean")
          PY

      - name: Release-gate verdict
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ steps.tag.outputs.mode }}
        run: |
          set -euo pipefail
          printf '\n=== release-gate ALLOW: tag %s passed all gates (mode=%s) ===\n' "${CANDIDATE_TAG}" "${MODE}"

  release-gate-violation-issue:
    # Closes TF-020H3rg-003 + 020H.3.1 R1 SAFE-MAJ-001 (privilege scope).
    #
    # Separate job so `issues: write` is granted ONLY here — the
    # release-gate job's pip-install / schema-validate / Python ramp
    # check / expired-config check steps cannot accidentally open
    # GitHub issues. Bounded threat surface by privilege-of-least-
    # privilege. Symmetric with the canary-replay.yml pattern but
    # split rather than colocated.
    #
    # Trigger: only when the release-gate evaluation job failed AND
    # the event was a real `push:tags` (workflow_dispatch dry-runs
    # surface the verdict in the operator's terminal — no issue
    # needed). The `if:` MUST evaluate before the runner starts so
    # we use `needs.release-gate.result == 'failure'`. Note: this
    # opens an issue on ANY release-gate-job failure — including
    # infrastructure failures (pip install, network, etc.) not just
    # SCP-EREL-001 violations. The issue body names the workflow run
    # URL where the operator inspects which specific step failed.
    needs: release-gate
    if: needs.release-gate.result == 'failure' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_TAG: ${{ needs.release-gate.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Forward-compat env: when a second maintainer onboards (per
      # D-031 escalation path, 2026-07-21), set this at the workflow
      # level to expand the assignee list. Symmetric with
      # canary-replay.yml's SCP_REGRESSION_ASSIGNEES.
      SCP_RELEASE_GATE_ASSIGNEES: ""
    steps:
      - name: Ensure required labels exist (idempotent)
        # Closes 020H.3.1 R1 SAFE-MIN-002: gh issue create --label fails
        # if the label doesn't exist. Pre-create with --force (gh CLI's
        # idempotent flag — creates if missing, no-op if exists).
        shell: bash
        run: |
          set -euo pipefail
          for label in release-gate-violation needs-triage auto-opened; do
            gh label create "${label}" \
              --repo "${GITHUB_REPOSITORY}" \
              --force >/dev/null 2>&1 || true
          done

      - name: Open release-gate-violation issue
        shell: bash
        run: |
          set -euo pipefail

          assignees="${SCP_RELEASE_GATE_ASSIGNEES:-jrnb2024}"

          # Empty CANDIDATE_TAG only happens if the release-gate job's
          # Resolve-tag step failed before assigning the output (e.g.
          # malformed tag ref). Use a sanitised ${GITHUB_REF##refs/tags/}
          # as a best-effort fallback so the alert isn't lost. Strip
          # any character outside [A-Za-z0-9._-] (closes 020H.3.1 R1
          # SAFE-MIN-001: GITHUB_REF cannot contain shell metacharacters
          # since it's set by GitHub Actions, but defense-in-depth is
          # cheap).
          if [ -n "${CANDIDATE_TAG}" ]; then
            tag="${CANDIDATE_TAG}"
          else
            raw="${GITHUB_REF##refs/tags/}"
            tag="$(printf '%s' "${raw}" | LC_ALL=C tr -cd 'A-Za-z0-9._-')"
            if [ -z "${tag}" ]; then
              tag="<unknown>"
            fi
          fi

          # De-dup: scope by tag substring (NOT week-of-year as in
          # canary-replay.yml — a tag is a single event). Use
          # the tag itself rather than the full bracketed title for
          # the search since GitHub Search API behavior on bracketed
          # tokens is documented as "may strip" (closes 020H.3.1 R1
          # COR-nit-001).
          title="[release-gate-violation] tag ${tag} failed validation"
          # Single-jq pipeline (no `| head -1` external pipe) so a
          # multi-match doesn't trigger SIGPIPE under set -euo pipefail
          # (closes 020H.3.1 R2 COR-nit-001). The `first(expr)` idiom
          # evaluates only until the first match and emits empty on
          # zero matches.
          existing="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label release-gate-violation \
            --search "tag ${tag} failed validation" \
            --json number,title \
            --jq "first(.[] | select(.title == \"${title}\") | .number) // empty")"

          # Export the resolved tag BEFORE the heredoc so Python sees
          # the sanitised value (closes 020H.3.1 self-corrected
          # ordering bug — without this, body= ran first with
          # CANDIDATE_TAG_RESOLVED unset and fell back to the raw
          # CANDIDATE_TAG, defeating the sanitisation).
          export CANDIDATE_TAG_RESOLVED="${tag}"

          # Compose body via Python (closes 020H.3.1 R1 SAFE-nit-001
          # by using Python templating in BOTH branches — the de-dup
          # comment branch and the new-issue body branch). No shell
          # metacharacter interpolation surface.
          body="$(python3 - <<'PY'
          import os
          tag = os.environ.get("CANDIDATE_TAG_RESOLVED", os.environ.get("CANDIDATE_TAG", "<unknown>"))
          run_url = os.environ.get("RUN_URL", "<unknown>")
          template = """# Auto-detected by WP-SCP-022 020H.3 release-gate (post-tag observer).

          ## Bad tag

          - Candidate tag: `__TAG__`
          - Workflow run: __RUN_URL__
          - Detection time: this run.

          ## What this means

          The release-gate workflow refused this tag in **post-tag
          observer mode** — the tag has already been pushed to the
          remote and is immutable per D-030 (`scp-tag-protection-v`
          ruleset blocks deletion + force-push, including for admins).

          See the workflow run for the specific `SCP-EREL-001` annotation
          identifying the violating deprecation entry or expired
          rule-config row. Note: this issue may also fire on infra
          failures (pip install, network) — verify the failed step in
          the run before assuming a real violation.

          ## Recovery

          Per `policies/VERSIONING.md` "Bad-tag recovery procedure":

          1. **Do NOT attempt to delete or force-push the bad tag.**
          2. **Cut a corrected `v<X>.<Y+1>.0`** that satisfies the
             ramp. The bad tag remains in the tag list but is superseded.
          3. **Add a release note** on the bad tag's GitHub release page
             documenting the violation + pointing adopters to the
             corrected tag.
          4. **Adopter signal latency:** Renovate-using adopters see the
             corrected-tag bump PR within hours; manually SHA-pinning
             adopters see SCP-FRESH-001 only after 3+ subsequent MINOR
             releases. Manual quarterly review of the SCP releases page
             is the supplementary signal for the manual cohort.

          For emergency tag deletion (security-critical only), see the
          ruleset-disable path in VERSIONING.md "Bad-tag recovery
          procedure" — requires `administration:write` PAT + an amending
          decision row in `docs/DECISIONS.md`.

          ## Triage checklist

          - [ ] Reviewed the SCP-EREL-001 annotations on the workflow run.
          - [ ] Identified the violating deprecation entry or expired
                rule-config row (or confirmed an infra-only failure).
          - [ ] Decided: corrected v<X>.<Y+1>.0 OR emergency ruleset disable.
          - [ ] Release note added to the bad tag's GitHub release page.
          - [ ] Issue closed with link to the corrective PR / amending
                decision row.

          ## References

          - `policies/VERSIONING.md` "Tag-cut procedure" (mandatory
            dry-run pre-flight) + "Bad-tag recovery procedure".
          - `.github/workflows/release-gate.yml` (this workflow).
          - WP-SCP-022 020H.3 dispatch-note + 020H.3.1 follow-up.
          """
          print(template.replace("__TAG__", tag).replace("__RUN_URL__", run_url))
          PY
          )"

          if [ -n "${existing}" ]; then
            echo "release-gate-violation issue #${existing} already exists for ${tag}; appending a comment."
            comment_body="$(python3 - <<'PY'
          import os
          run_url = os.environ.get("RUN_URL", "<unknown>")
          print(f"Re-detected in workflow run {run_url}.")
          PY
          )"
            gh issue comment "${existing}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "${comment_body}"
            exit 0
          fi

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --label release-gate-violation \
            --label needs-triage \
            --label auto-opened \
            --assignee "${assignees}" \
            --body "${body}"

