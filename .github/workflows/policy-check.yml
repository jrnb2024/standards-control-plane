name: policy-check

"on":
  workflow_call:
    inputs:
      rule-set:
        description: Rule bundle selector for the reusable policy check.
        required: false
        type: string
        default: starter
      threshold:
        description: Threshold that converts policy findings into a failing result.
        required: false
        type: string
        default: deny
      annotate:
        description: Emit workflow-command annotations for deny findings.
        required: false
        type: boolean
        default: true
      scp_bypass:
        description: Enable the break-glass pairing and waiver gates.
        required: false
        type: boolean
        default: false
      waivers-path:
        description: Caller-side waiver document path.
        required: false
        type: string
        default: output/findings/waivers.json
      rule-config-path:
        description: Caller-side rule configuration path.
        required: false
        type: string
        default: .scp/rule-config.yaml
      fixture-path:
        description: Restrict changed-file discovery to a fixture subtree when the selftest harness invokes the workflow.
        required: false
        type: string
        default: .
      scorecard-emit:
        description: |
          Opt-in: emit `output/scorecards/scorecard-emit.json` alongside the
          policy-check run for cross-repo scorecard aggregation per WP-SCP-023.
          Default false (existing adopters see no behaviour change). Adopters
          opt in by setting `with: scorecard-emit: true`. The emit carries
          aggregated counts only — NEVER waiver content (per WP-SCP-023
          plan-doc invariant 2). See `schemas/scorecard-emit.schema.json` for
          the data shape and ADOPT-001 §13 (lands in slice 023D) for adopter
          onboarding. Closes WP-SCP-023 plan-doc §5 emitter contract; ratifies
          D-041.
        required: false
        type: boolean
        default: false
      simulate-app-token-failure:
        description: |
          Selftest-only flag (TF-PIM-001 Wave E / TF-PIM-001-ARCH-002 mock
          coverage). When true, a stub-mode step short-circuits the App
          installation token-exchange path: it emits the SCP-E001 annotation
          and exits 1 BEFORE the `actions/create-github-app-token` step
          runs. The SCP_TEST_SIMULATE_APP_TOKEN_FAILURE env-var is the
          conceptual name; the workflow input is the GitHub-Actions-native
          carrier. ONLY set true from the workflow-selftest harness;
          production callers leave this false. Blast radius if mis-set
          (accidentally or maliciously): the policy-check job fails on
          the caller's own PR; no other adopter is affected. Accidental
          mis-set is the more likely scenario.
        required: false
        type: boolean
        default: false
      scp-sha:
        description: |
          SCP federation-primitive SHA this reusable workflow was loaded
          from. REQUIRED — adopter wrapper MUST pass the same 40-char SHA
          used in the `uses: jrnb2024/standards-control-plane/.github/workflows/policy-check.yml@<SHA>`
          pin. Used by the `.scp-runtime` + `_scp-workflow` checkout steps
          to fetch SCP runtime files at the version the caller pinned to.
          Closes L31 axis I (cross-repo reusable-workflow self-SHA awareness
          gap surfaced by Wave G fix-forward 2026-05-23) — GHA exposes NO
          clean callee-context variable for "the SHA I was loaded from" in
          cross-repo workflow_call context; `github.workflow_sha` resolves
          to the CALLER's wrapper SHA (PIM PR merge ref), not this
          reusable-workflow's loaded-from SHA.
          Validation: pre-flight in the policy-check job's first step
          asserts `inputs.scp-sha` is non-empty + matches `^[a-f0-9]{40}$`
          regex; mismatch emits SCP-E001 annotation + exits 1 BEFORE any
          App-token-exchange happens (closes L31 axis I HIGH-002 stale-SHA
          validation gap from v0.5 R1 Lens B finding).
        required: true
        type: string
      simulate-cross-repo:
        description: |
          Selftest-only mock-mode flag (v0.2 R1 CRIT closure for axis I
          test coverage). When true, the pre-flight scp-sha validation
          step treats this invocation AS IF it were cross-repo for
          validation purposes (forces the required-input check even in
          SCP-self context). Mirrors the existing `simulate-app-token-failure`
          flag pattern (TF-PIM-001-ARCH-002 mock-fixture pattern). ONLY set
          true from the workflow-selftest harness; production adopter
          wrappers leave default-false. Blast radius if mis-set: pre-flight
          validation behaves slightly differently for the caller's own PR;
          no cross-adopter impact.
        required: false
        type: boolean
        default: false
      selftest-mode:
        description: |
          Selftest discriminator (FT-PR139-SELFTEST-MODE-INPUT-DISCRIMINATOR
          closure 2026-05-24). When true, the cross-repo `actions/checkout`
          + App-token-exchange steps are SKIPPED — the workflow proceeds
          via the SCP-self code path (relies on default `GITHUB_TOKEN`'s
          same-repo access). When false (default; production adopter
          shape), both steps RUN — App-token-exchange mints an installation
          token; `.scp-runtime` checkout uses that token to fetch SCP
          cross-repo.

          REPLACES the historical `github.repository != 'jrnb2024/standards-
          control-plane-'` hardcoded discriminator (added by `be1da77` in
          PR #139 fix-forward cycle 2026-05-21). Explicit input is repo-
          rename-resilient + clearer-intent than reading meaning from a
          repo-name comparison.

          ONLY set true from the workflow-selftest harness (SCP self-
          dogfood context) AND from SCP's own `policy-check-wrapper.yml`
          self-dogfood caller. Production adopter wrappers (PIM, CT,
          cohort cascade 024D-024G, etc.) MUST leave default-false to
          trigger the App-credential cross-repo auth path. Blast radius
          if mis-set true by an adopter: the cross-repo checkout is
          skipped, `_scp-workflow` checkout falls back to `github.token`
          which has no SCP read access → checkout fails → policy-check
          fails fail-closed (SCP-E001-class infra fetch failure). Loud,
          not silent.
        required: false
        type: boolean
        default: false
      auth-canonical-source:
        description: |
          WP-SCP-028 Phase 2 (companion materialisation) selftest seam.
          PRODUCTION adopters leave this DEFAULT ("live"): the auth-canonical
          materialisation step fetches CT's signed canonicals
          (auth-contract-v1.yaml + canonical-sdk-versions.yaml, each with its
          .sig.bundle) from the PUBLIC estate-canonicals surface (per D-061)
          and cosign-verifies BOTH against CT's contract-manifest-publish.yml
          keyless identity — `*_verified` is set ONLY from that cosign exit
          code (the FUP-VERIFIED-FLAG-TRUST-BOUNDARY-001 trust boundary).
          The workflow-selftest harness instead passes a directory path here
          (a fixture-local canonical dir OUTSIDE the fixture-path subtree, so
          the conftest per-file pass never enumerates it). When this is a
          path (≠ "live") the materialisation reads the canonical BYTES from
          that dir and derives `*_verified` from `simulate-auth-verified`
          (NOT from real cosign / network) so fixture oracles are
          deterministic + drift-proof. The real cosign+live-surface path is
          covered separately by the `auth-canonical-cosign-smoke` selftest
          job + every production adopter run. This seam is honoured ONLY when
          `selftest-mode` is true; a PRODUCTION run (selftest-mode false)
          IGNORES this input entirely and always fetches + cosign-verifies the
          live public surface — so an adopter CANNOT substitute the canonical
          source or bypass cosign via `with:` inputs (this matters at D-059 if
          a rule is deny-promoted to blocking). Adopter wrappers leave it "live".
        required: false
        type: string
        default: live
      simulate-auth-verified:
        description: |
          WP-SCP-028 Phase 2 selftest-only flag (mirrors the
          simulate-app-token-failure / simulate-cross-repo mock-fixture
          pattern). Honoured ONLY when `selftest-mode` is true AND
          `auth-canonical-source` is a path (≠ "live"); IGNORED entirely in a
          production run (selftest-mode false), where `*_verified` always comes
          from the real `cosign verify-blob` exit. Set "true" to make
          the fixture's `auth_contract_verified` + `canonical_sdk_versions_
          verified` resolve TRUE (stands in for a successful cosign verify);
          set "false"/"" to make them resolve FALSE (stands in for a failed
          verify → the rules' fail-closed signature finding fires,
          warn-rendered). This is a WORKFLOW INPUT supplied by the harness
          via `with:` — it is NEVER read from the adopter/fixture repo tree,
          which is exactly what the trust-boundary fixture proves: an adopter
          file ASSERTING `verified: true` cannot flip the flag.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  statuses: write
  # WP-SCP-023 023B: workflow-level permissions DO NOT include
  # attestations: write or id-token: write — those are job-scoped on
  # the `attest-scorecard` job below (closes 023B R1 MAJ-SAFE-001).
  # Granting id-token: write workflow-wide would let any step in any
  # policy-check run request a GitHub OIDC token asserting the SCP
  # reusable workflow identity, exposing adopter cloud-IAM trust
  # configurations to compromised steps in opt-out runs. Job-scoping
  # bounds this to runs that actually opt into scorecard-emit.

jobs:
  policy-check:
    # GitHub records reusable-workflow checks as "{calling-job-name} / scp/policy-check".
    # 020D1/020D2 must verify the combined context before configuring branch protection.
    name: scp/policy-check
    runs-on: ubuntu-24.04
    env:
      SCP_ANNOTATE: ${{ inputs.annotate }}
      SCP_BASE_REF: ${{ github.event.pull_request.base.ref }}
      SCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SCP_BYPASS: ${{ inputs.scp_bypass }}
      SCP_BYPASS_APPROVED: "false"
      SCP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SCP_FIXTURE_PATH: ${{ inputs.fixture-path }}
      SCP_PR_SHA: ${{ github.sha }}
      SCP_RULE_CONFIG_PATH: ${{ inputs.rule-config-path }}
      SCP_RULE_SET: ${{ inputs.rule-set }}
      SCP_SUMMARY_PATH: policy-check-summary.json
      SCP_TEST_SIMULATE_CROSS_REPO: ${{ inputs.simulate-cross-repo }}
      SCP_TEST_SIMULATE_APP_TOKEN_FAILURE: ${{ inputs.simulate-app-token-failure }}
      SCP_SELFTEST_MODE: ${{ inputs.selftest-mode }}
      SCP_AUTH_CANONICAL_SOURCE: ${{ inputs.auth-canonical-source }}
      SCP_SIMULATE_AUTH_VERIFIED: ${{ inputs.simulate-auth-verified }}
      SCP_THRESHOLD: ${{ inputs.threshold }}
      SCP_RUNTIME_ROOT: .scp-runtime
      SCP_WAIVERS_PATH: ${{ inputs.waivers-path }}
      SCP_WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs.scp-sha (L31 axis I + R1 Lens B HIGH-002)
        shell: bash
        env:
          SCP_SHA: ${{ inputs.scp-sha }}
        run: |
          set -euo pipefail
          # v0.7 R2 Lens A HIGH-004 closure: redact SCP_SHA in error
          # messages — never interpolate the unvalidated input value
          # (defense-in-depth against any future caller that might pass
          # secret-laden content; CI logs are typically operator-visible
          # but should follow least-privilege on error-message contents).
          SCP_SHA_LEN="${#SCP_SHA}"
          # R1 Lens B SAFE-R1-001 closure (2026-05-23): the SCP-self
          # short-circuit Codex inserted here was REMOVED. EDIT 4.5
          # already adds `scp-sha: ${{ github.sha }}` to all 3 existing
          # SCP-self fixture jobs (fixture-pass / fixture-fail /
          # fixture-simulate-token-exchange-failure), so empty-scp-sha
          # in SCP-self context is no longer reachable. Keeping the
          # short-circuit would have partially re-introduced the
          # silent-downgrade pattern v0.7 R2 HIGH-005 explicitly closed.
          # Validation is symmetric across all callers: empty scp-sha
          # always fires SCP-E001.
          if [ -z "${SCP_SHA}" ]; then
            echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::inputs.scp-sha is required for v2 cross-repo workflow_call (closes L31 axis I). Adopter wrapper MUST pass scp-sha matching the @<SHA> pin. Received: empty string."
            exit 1
          fi
          if [[ ! "${SCP_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::inputs.scp-sha must be 40-char lowercase hex (received ${SCP_SHA_LEN} chars; value redacted on validation failure). Closes L31 axis I + v0.5 R1 Lens B HIGH-002 stale-SHA validation + v0.6 R2 Lens A HIGH-004 redact-on-error hygiene."
            exit 1
          fi
          # Note: we don't verify SHA EXISTS in SCP repo here — that would
          # require an authenticated API call before the App-token-exchange
          # step runs. The downstream `.scp-runtime` checkout step will
          # surface a clear `actions/checkout` error if the SHA is unreachable
          # (better signal than a synthetic pre-flight network check).
          # Only print the validated SHA after both checks pass:
          echo "✓ inputs.scp-sha validated: ${SCP_SHA}"

      - name: Simulate App token-exchange failure (TF-PIM-001-ARCH-002 selftest fixture)
        if: ${{ inputs.simulate-app-token-failure }}
        shell: bash
        run: |
          echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001 (selftest)::Simulated App installation token-exchange failure (TF-PIM-001 Wave E mock fixture; inputs.simulate-app-token-failure=true). Production callers leave this input default-false."
          exit 1

      - name: Obtain SCP federation App installation token
        id: scp-app-token
        # Skip for SCP-self / selftest-harness invocation. Discriminator
        # history (closes FT-PR139-SELFTEST-MODE-INPUT-DISCRIMINATOR
        # 2026-05-24):
        #   - Wave D original: `github.action_ref != ''` — wrong. GHA
        #     sets action_ref for local reusable workflow calls too.
        #   - PR #139 first attempt (1f104af): `github.repository !=
        #     github.action_repository` — wrong. `action_repository`
        #     applies to composite/JS actions, NOT reusable workflows;
        #     it's empty in this context, so the inequality always held.
        #   - PR #139 second attempt (be1da77): hardcoded
        #     `github.repository != 'jrnb2024/standards-control-plane'`.
        #     Worked but was brittle to repo rename + opaque-intent.
        #   - **Current (2026-05-24)**: explicit `!inputs.selftest-mode`
        #     workflow_call discriminator. Repo-rename-resilient + clear
        #     intent. Callers (workflow-selftest harness + SCP self-
        #     dogfood wrapper) pass `selftest-mode: true`; adopter
        #     wrappers (PIM, CT, cohort cascade) leave default-false to
        #     trigger this cross-repo App-token-exchange path.
        if: ${{ !inputs.selftest-mode }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SCP_FEDERATION_APP_ID }}
          private-key: ${{ secrets.SCP_FEDERATION_APP_PRIVATE_KEY }}
          owner: jrnb2024
          repositories: standards-control-plane

      - name: Checkout SCP runtime repository
        # When invoked cross-repo (the standard adopter path), this step
        # checks out the pinned SCP runtime into .scp-runtime so the
        # install + lib-source steps can read scripts/.tool-versions,
        # scripts/scp-policy-check.lock, lib/policy_check_invocation.sh,
        # and policies/. When invoked LOCALLY (`uses: ./...` from the
        # same repo, e.g. workflow-selftest), this step is skipped and
        # the populate step below symlinks the caller working directory
        # in place of the (now-absent) .scp-runtime.
        # WAVE-G AXIS-I FIX (v0.6 — 2026-05-23): uses inputs.scp-sha
        # instead of github.workflow_sha. github.workflow_sha resolves to
        # the CALLER's wrapper SHA in cross-repo workflow_call context
        # (PIM PR merge ref), NOT the SCP-side SHA the reusable workflow
        # was loaded from. inputs.scp-sha is REQUIRED + pre-validated by
        # the first job step (see "Validate inputs.scp-sha" above).
        # Discriminator: `!inputs.selftest-mode` (see "Obtain SCP federation
        # App installation token" step above for history; FT-PR139-
        # SELFTEST-MODE-INPUT-DISCRIMINATOR closure 2026-05-24).
        if: ${{ !inputs.selftest-mode }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jrnb2024/standards-control-plane
          ref: ${{ inputs.scp-sha }}
          token: ${{ steps.scp-app-token.outputs.token }}
          path: .scp-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Populate .scp-runtime (self-call fallback)
        # Closes the WP-SCP-022 020C.1 selftest gap. The cross-repo
        # checkout step above always partially runs (creates .scp-runtime
        # with an empty git init even when github.action_repository is
        # the calling repo or the ref is local-form). We therefore
        # detect "did the runtime content actually land?" by checking
        # for scripts/.tool-versions — the canonical sentinel — rather
        # than directory existence. If the sentinel is missing, replace
        # .scp-runtime with a symlink to the caller working directory
        # so the install + lib + policies steps resolve identically to
        # the cross-repo adopter path.
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .scp-runtime/scripts/.tool-versions ]; then
            echo "::debug::.scp-runtime populated by cross-repo checkout"
            exit 0
          fi
          rm -rf .scp-runtime
          ln -s "$(pwd)" .scp-runtime
          ls -la .scp-runtime/scripts/.tool-versions .scp-runtime/scripts/scp-policy-check.lock .scp-runtime/lib/policy_check_invocation.sh .scp-runtime/policies >/dev/null
          echo "::debug::.scp-runtime symlinked to caller working directory (self-call path)"

      - name: Freshness warning (wrapper pin vs SCP main HEAD)
        # WP-SCP-022 020H.1 sub-criterion (closes ADOPT-001 §12.7.11
        # forward-looking flag): annotate ::warning:: when the wrapper's
        # SHA pin is more than `freshness_warning_threshold_minor`
        # minor versions behind SCP main HEAD's published version.
        # Best-effort — never fails the workflow. Adopters who pinned
        # at a pre-020H.1 SHA (no version-manifest.json shipped) get a
        # silent skip; adopters who pinned at 020H.1+ get the warning
        # if they fall behind.
        shell: bash
        run: |
          set -uo pipefail  # NOT errexit — best-effort, must not fail the gate.

          pinned="${SCP_RUNTIME_ROOT}/version-manifest.json"
          if [ ! -f "${pinned}" ]; then
            echo "::debug::freshness-warning: wrapper pin predates 020H.1 (no version-manifest.json under .scp-runtime); skipping check"
            exit 0
          fi

          # Read BOTH minor and threshold from the PINNED (lockfile-trust)
          # manifest. Reading the threshold from the remote main HEAD
          # would let an attacker who compromises main HEAD silence the
          # warning by setting threshold to a large number. The pinned
          # manifest is SHA-pinned via the wrapper; tampering with it
          # requires a CODEOWNERS-gated PR (per scripts/** + vendor/**
          # CODEOWNERS coverage at the SCP source). Closes 020H.1 R1
          # SAFE-MIN-006.
          pinned_parsed="$(python3 -c '
          import json, sys
          try:
              with open(sys.argv[1]) as f:
                  p = json.load(f)
              print(p.get("minor", ""))
              print(p.get("freshness_warning_threshold_minor", 2))
          except Exception:
              print("")
              print("2")
          ' "${pinned}")"
          pinned_minor="$(printf '%s' "${pinned_parsed}" | sed -n '1p')"
          threshold="$(printf '%s' "${pinned_parsed}" | sed -n '2p')"

          if [ -z "${pinned_minor}" ]; then
            echo "::debug::freshness-warning: pinned manifest has no minor field; skipping"
            exit 0
          fi

          # Fetch SCP main HEAD's manifest. Public raw URL; --max-time
          # caps the network step so a flaky connection cannot stretch
          # CI wall-clock. --fail prevents an HTML 404 page from being
          # parsed as JSON.
          main_manifest_url="https://raw.githubusercontent.com/jrnb2024/standards-control-plane/main/version-manifest.json"
          main_manifest="$(curl --fail --silent --show-error --location --max-time 10 "${main_manifest_url}")" || {
            echo "::debug::freshness-warning: could not fetch ${main_manifest_url} (network error or 404); skipping"
            exit 0
          }

          main_minor="$(printf '%s' "${main_manifest}" | python3 -c '
          import json, sys
          try:
              p = json.load(sys.stdin)
              print(p.get("minor", ""))
          except Exception:
              pass
          ')"

          if [ -z "${main_minor}" ]; then
            echo "::debug::freshness-warning: main manifest has no minor field; skipping"
            exit 0
          fi

          # Parse "X.Y" minor strings as floats for comparison; falls
          # back to string-equal if parse fails.
          delta="$(python3 -c '
          import sys
          try:
              pinned = sys.argv[1].split(".")
              main = sys.argv[2].split(".")
              # Compare: same major → diff in minor; diff major → cap at threshold+1 to surface
              if pinned[0] != main[0]:
                  print(int(sys.argv[3]) + 1)
              else:
                  print(int(main[1]) - int(pinned[1]))
          except Exception:
              print(0)
          ' "${pinned_minor}" "${main_minor}" "${threshold}")"

          if [ "${delta}" -gt "${threshold}" ]; then
            echo "::warning file=.github/workflows/policy-check.yml,title=SCP-FRESH-001::SCP federation primitive pin (${pinned_minor}.x) is more than ${threshold} minor versions behind main HEAD (${main_minor}.x). See ADOPT-001 §12.7.11 for the freshness-warning contract; bump your wrapper SHA via Renovate or manually."
          else
            echo "::debug::freshness-warning: pin ${pinned_minor}.x is within ${threshold} minor versions of main HEAD ${main_minor}.x"
          fi

      - name: Install pinned OPA and Conftest runtimes
        shell: bash
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local file="$2"
            local message="$3"
            echo "::error file=${file},title=${code}::${message}"
          }

          emit_infra_failure() {
            emit_error "SCP-E001" ".github/workflows/policy-check.yml" "$1"
            exit 1
          }

          read_tool_version() {
            local tool="$1"
            awk -v tool="${tool}" '
              $1 == tool {
                print $2
                found = 1
                exit
              }
              END {
                if (!found) {
                  exit 1
                }
              }
            ' "${SCP_RUNTIME_ROOT}/scripts/.tool-versions"
          }

          read_lockfile_field() {
            local tool="$1"
            local platform_key="$2"
            local field="$3"

            python3 - "$tool" "$platform_key" "$field" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          lockfile = Path(os.environ["SCP_RUNTIME_ROOT"]) / "scripts" / "scp-policy-check.lock"
          tool = sys.argv[1]
          platform_key = sys.argv[2]
          field = sys.argv[3]

          try:
              payload = json.loads(lockfile.read_text())
              print(payload[tool][platform_key][field])
          except KeyError as exc:
              raise SystemExit(f"missing lockfile field: {exc}")
          except TypeError as exc:
              raise SystemExit(f"malformed lockfile structure (expected nested dict for {tool}.{platform_key}.{field}): {exc}")
          PY
          }

          OPA_VERSION="$(read_tool_version opa)" || emit_infra_failure "missing OPA version pin in scripts/.tool-versions"
          CONFTST_VERSION="$(read_tool_version conftest)" || emit_infra_failure "missing Conftest version pin in scripts/.tool-versions"
          REGAL_VERSION="$(read_tool_version regal)" || emit_infra_failure "missing Regal version pin in scripts/.tool-versions"
          OPA_REPO="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"
          CONFTST_REPO="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTST_VERSION}"
          REGAL_REPO="https://github.com/open-policy-agent/regal/releases/download/v${REGAL_VERSION}"
          BIN_DIR="${RUNNER_TEMP}/scp-policy/bin"
          mkdir -p "${BIN_DIR}"

          case "$(uname -m)" in
            x86_64|amd64)
              PLATFORM_KEY="linux-x64"
              OPA_ASSET="opa_linux_amd64"
              CONFTST_ARCHIVE="conftest_${CONFTST_VERSION}_Linux_x86_64.tar.gz"
              REGAL_ASSET="regal_Linux_x86_64"
              ;;
            aarch64|arm64)
              PLATFORM_KEY="linux-arm64"
              OPA_ASSET="opa_linux_arm64"
              CONFTST_ARCHIVE="conftest_${CONFTST_VERSION}_Linux_arm64.tar.gz"
              REGAL_ASSET="regal_Linux_arm64"
              ;;
            *)
              emit_infra_failure "unsupported runner architecture: $(uname -m)"
              ;;
          esac

          OPA_SHA256="$(read_lockfile_field opa "${PLATFORM_KEY}" sha256)" || emit_infra_failure "missing OPA SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
          CONFTST_BINARY_SHA256="$(read_lockfile_field conftest "${PLATFORM_KEY}" sha256)" || emit_infra_failure "missing Conftest binary SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
          CONFTST_ARCHIVE_SHA256="$(read_lockfile_field conftest "${PLATFORM_KEY}" archive_sha256)" || emit_infra_failure "missing Conftest archive SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
          REGAL_SHA256="$(read_lockfile_field regal "${PLATFORM_KEY}" sha256)" || emit_infra_failure "missing Regal SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"

          verify_sha256() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(sha256sum "${path}" | awk '{print $1}')"
            [ "${actual}" = "${expected}" ]
          }

          resolve_opa() {
            local downloaded="${RUNNER_TEMP}/${OPA_ASSET}"
            local vendored="${SCP_RUNTIME_ROOT}/vendor/opa/${OPA_ASSET}"
            if curl --fail --silent --show-error --location "${OPA_REPO}/${OPA_ASSET}" --output "${downloaded}" && verify_sha256 "${downloaded}" "${OPA_SHA256}"; then
              printf '%s\n' "${downloaded}"
              return 0
            fi
            if [ -f "${vendored}" ] && verify_sha256 "${vendored}" "${OPA_SHA256}"; then
              printf '%s\n' "${vendored}"
              return 0
            fi
            return 1
          }

          resolve_conftest() {
            local downloaded="${RUNNER_TEMP}/${CONFTST_ARCHIVE}"
            local vendored_archive="${SCP_RUNTIME_ROOT}/vendor/conftest/${CONFTST_ARCHIVE}"
            if curl --fail --silent --show-error --location "${CONFTST_REPO}/${CONFTST_ARCHIVE}" --output "${downloaded}" && verify_sha256 "${downloaded}" "${CONFTST_ARCHIVE_SHA256}"; then
              printf '%s\n' "${downloaded}"
              return 0
            fi
            if [ -f "${vendored_archive}" ] && verify_sha256 "${vendored_archive}" "${CONFTST_ARCHIVE_SHA256}"; then
              printf '%s\n' "${vendored_archive}"
              return 0
            fi
            return 1
          }

          # Defensive: if a future Regal release moves to tarball shipping
          # the lockfile + this resolver need to grow archive_sha256 + a
          # .gz-extraction branch (matching resolve_conftest). Until then,
          # emit a clear infra-failure if the downloaded asset is gzip-
          # shaped rather than letting the smoke test fail with an opaque
          # 'binary format' error. Closes 020H.2 R1 SAFE-003.
          #
          # Uses Python instead of xxd to avoid the silent-degradation
          # surface where xxd absence on a self-hosted runner would let
          # `magic=""` pass the `[ "${magic}" = "1f8b" ]` check (closes
          # 020H.2 R2 SAFE-003 + COR-R2-nit-002). Python 3 is already a
          # required runner dependency for the rule-config wrapping +
          # JSON helpers above, so no new dependency.
          assert_bare_binary_shape() {
            local path="$1"
            local magic
            magic="$(python3 -c 'import sys; print(open(sys.argv[1], "rb").read(2).hex())' "${path}")" || emit_infra_failure "unable to read first 2 bytes of Regal asset ${path}"
            if [ "${magic}" = "1f8b" ]; then
              emit_infra_failure "Regal asset ${path} appears to be a gzip archive; lockfile and resolve_regal() need archive_sha256 + tarball-extraction branch (matching resolve_conftest). Coordinate with @jrnb2024 before bumping REGAL_VERSION."
            fi
          }

          resolve_regal() {
            local downloaded="${RUNNER_TEMP}/${REGAL_ASSET}"
            local vendored="${SCP_RUNTIME_ROOT}/vendor/regal/${REGAL_ASSET}"
            if curl --fail --silent --show-error --location "${REGAL_REPO}/${REGAL_ASSET}" --output "${downloaded}" && verify_sha256 "${downloaded}" "${REGAL_SHA256}"; then
              assert_bare_binary_shape "${downloaded}"
              printf '%s\n' "${downloaded}"
              return 0
            fi
            if [ -f "${vendored}" ] && verify_sha256 "${vendored}" "${REGAL_SHA256}"; then
              assert_bare_binary_shape "${vendored}"
              printf '%s\n' "${vendored}"
              return 0
            fi
            return 1
          }

          OPA_SOURCE="$(resolve_opa)" || emit_infra_failure "unable to resolve OPA v${OPA_VERSION} from release download or vendor/opa fallback"
          cp "${OPA_SOURCE}" "${BIN_DIR}/opa"
          chmod +x "${BIN_DIR}/opa"

          # SHA256 verification (above) is the primary hard-fail control;
          # Sigstore attestation is best-effort soft-warn. OPA v1.x has
          # not yet published Sigstore attestations to GitHub's
          # attestation database (HTTP 404 on lookup), so hard-failing
          # here would block all CI on every adopter forever — even
          # though the binary is genuinely SHA256-verified. Re-tighten
          # to hard-fail when upstream publishes attestations OR when
          # we bump to a version that already does. Closes WP-SCP-022
          # R2 follow-up of MAJ-004 mitigation.
          if gh attestation verify "${BIN_DIR}/opa" --repo open-policy-agent/opa 2>&1; then
            echo "OPA Sigstore attestation verified for v${OPA_VERSION}"
          else
            echo "::warning file=.github/workflows/policy-check.yml,title=SCP-E001-soft::OPA Sigstore attestation not available for v${OPA_VERSION}; SHA256 verification (primary) is the security floor until upstream publishes attestations"
          fi

          CONFTST_SOURCE="$(resolve_conftest)" || emit_infra_failure "unable to resolve Conftest v${CONFTST_VERSION} from release download or vendor/conftest fallback"
          if [ "${CONFTST_SOURCE##*.}" = "gz" ]; then
            tar -xzf "${CONFTST_SOURCE}" -C "${BIN_DIR}" conftest
          else
            cp "${CONFTST_SOURCE}" "${BIN_DIR}/conftest"
          fi
          chmod +x "${BIN_DIR}/conftest"

          verify_sha256 "${BIN_DIR}/conftest" "${CONFTST_BINARY_SHA256}" || emit_infra_failure "Conftest binary verification failed for v${CONFTST_VERSION} after extraction"
          # Conftest does not publish Sigstore attestations; SHA256-verified tarballs are the security floor for conftest.
          # OPA v1.15.2 likewise does not publish Sigstore attestations (HTTP 404 from
          # api.github.com/repos/open-policy-agent/opa/attestations/sha256:<digest>); the OPA gh attestation
          # verify call above is therefore soft-warn, with SHA256 + lockfile-pin as the primary security floor.

          REGAL_SOURCE="$(resolve_regal)" || emit_infra_failure "unable to resolve Regal v${REGAL_VERSION} from release download or vendor/regal fallback (SHA256 verification required)"
          cp "${REGAL_SOURCE}" "${BIN_DIR}/regal"
          chmod +x "${BIN_DIR}/regal"
          # SHA256 verification was performed inside resolve_regal against
          # the lockfile pin (no second verify on BIN_DIR/regal — same
          # design as resolve_opa). The runtime smoke test below is
          # defense-in-depth against an SHA-passing-but-corrupt binary
          # (cross-architecture, glibc mismatch, FS-level bit flip after
          # download). Stderr flows to the runner log on failure for
          # diagnostic fidelity (closes 020H.2 R1 COR-nit-002).
          # emit_infra_failure on either failure mode keeps the gate
          # fail-closed (TF-020H3-001 closure, WP-SCP-022 020H.2).
          "${BIN_DIR}/regal" version >/dev/null || emit_infra_failure "Regal runtime failed its post-download smoke test"

          printf '%s\n' "${BIN_DIR}" >> "${GITHUB_PATH}"
          printf 'SCP_POLICY_CHECK_POLICY_ROOT=%s/policies\n' "${SCP_RUNTIME_ROOT}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_OPA_BIN=%s/opa\n' "${BIN_DIR}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_OPA_SHA256=%s\n' "${OPA_SHA256}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_CONFTEST_BIN=%s/conftest\n' "${BIN_DIR}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_CONFTEST_SHA256=%s\n' "${CONFTST_BINARY_SHA256}" >> "${GITHUB_ENV}"

      - name: Collect changed files
        id: collect-changed-files
        shell: bash
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local file="$2"
            local message="$3"
            echo "::error file=${file},title=${code}::${message}"
          }

          emit_infra_failure() {
            emit_error "SCP-E001" ".github/workflows/policy-check.yml" "$1"
            exit 1
          }

          if [ -z "${SCP_BASE_SHA}" ] || [ -z "${SCP_HEAD_SHA}" ]; then
            emit_infra_failure "pull_request base/head SHAs are required for changed-files mode"
          fi

          if ! python3 - <<'PY'
          import os
          import sys

          value = os.environ.get("SCP_FIXTURE_PATH", "")
          sys.exit(0 if value and all(ch not in value for ch in ("\n", "\r", "\x00")) else 1)
          PY
          then
            emit_infra_failure "fixture-path must be non-empty and free of control characters"
          fi

          if [ "${SCP_FIXTURE_PATH}" != "." ] && [ ! -e "${SCP_FIXTURE_PATH}" ]; then
            emit_infra_failure "fixture-path '${SCP_FIXTURE_PATH}' does not exist in the checked-out repository"
          fi

          # Output: changed-files.txt.
          #
          # Selftest invocations (`SCP_FIXTURE_PATH != "."`) ALWAYS
          # enumerate the fixture tree — they exist to evaluate the
          # workflow against a known fixture state, not against a PR
          # diff. The previous logic only enumerated when the diff was
          # empty, which meant a PR that modified
          # `tests/workflow/<harness>/expected-annotations.json` (the
          # oracle ratchet) would scope conftest's input to the oracle
          # and skip the fixture's services.yml — the actual subject
          # under test.
          #
          # Adopter invocations (`SCP_FIXTURE_PATH == "."`, the default)
          # continue to scope to the PR diff, which is the federation
          # primitive's contract.
          if [ "${SCP_FIXTURE_PATH}" != "." ]; then
            if [ -f "${SCP_FIXTURE_PATH}" ]; then
              printf '%s\n' "${SCP_FIXTURE_PATH}" > changed-files.txt
            else
              find "${SCP_FIXTURE_PATH}" -type f | LC_ALL=C sort > changed-files.txt || emit_infra_failure "unable to enumerate fixture files under ${SCP_FIXTURE_PATH}"
            fi
          else
            git diff --name-only "${SCP_BASE_SHA}..${SCP_HEAD_SHA}" -- "${SCP_FIXTURE_PATH}" > changed-files.txt || emit_infra_failure "git diff failed for ${SCP_BASE_SHA}..${SCP_HEAD_SHA} within ${SCP_FIXTURE_PATH}"
          fi

          printf 'changed_files=changed-files.txt\n' >> "${GITHUB_OUTPUT}"

      - name: Prepare manifest evaluation targets
        shell: bash
        run: |
          set -euo pipefail
          # Delegates to the shared lib (sourced from .scp-runtime, populated
          # by the checkout/symlink step above). The target-prep logic lives
          # in scp_policy_check_prepare_manifest_targets so it is directly
          # unit-testable (tests/workflow/test_prepare_manifest_targets.py).
          # v2.0.0: the surrogate set is rule-DECLARED — the function reads
          # policies/rule-inputs.yaml (resolved relative to the lib inside
          # .scp-runtime, i.e. the PINNED contract travels with the pinned
          # workflow) and content-feeds the union of every content rule's
          # declared files (R-003 manifests, R-008 .env files, R-012
          # migration .py), hard-failing SCP-E002 on a missing/malformed
          # contract rather than silently narrowing the feed. The function
          # SKIPS files deleted in the PR diff rather than hard-failing
          # (the adopter-mode `git diff` enumeration includes deletions —
          # a removed file has no surface to evaluate).
          source "${SCP_RUNTIME_ROOT}/lib/policy_check_invocation.sh"
          scp_policy_check_prepare_manifest_targets

      - name: Lint policies with Regal
        shell: bash
        run: |
          set -euo pipefail
          if find "${SCP_RUNTIME_ROOT}/policies" -type f -name '*.rego' -print -quit | grep -q .; then
            # Rule disable list — see policies/README.md for rationale.
            # opa-fmt is enforced by the separate "Check policy
            # formatting with OPA" step using `opa fmt --fail`, which
            # is the authoritative formatting gate.
            regal lint \
              --disable directory-package-mismatch \
              --disable no-defined-entrypoint \
              --disable with-outside-test-context \
              --disable unconditional-assignment \
              --disable line-length \
              --disable superfluous-object-get \
              --disable non-loop-expression \
              --disable external-reference \
              --disable unresolved-reference \
              --disable defer-assignment \
              --disable opa-fmt \
              --disable messy-rule \
              "${SCP_RUNTIME_ROOT}/policies"
          fi

      - name: Check policy formatting with OPA
        shell: bash
        run: |
          set -euo pipefail
          if find "${SCP_RUNTIME_ROOT}/policies" -type f -name '*.rego' -print -quit | grep -q .; then
            while IFS= read -r -d '' rego_file; do
              opa fmt --fail "${rego_file}"
            done < <(find "${SCP_RUNTIME_ROOT}/policies" -type f -name '*.rego' -print0)
          fi

      - name: Enforce per-rule OPA coverage
        shell: bash
        run: |
          set -euo pipefail
          policy_root="${SCP_RUNTIME_ROOT}/policies"
          test_root="${policy_root}/tests"
          common_file="${policy_root}/scp_common.rego"

          if ! find "${policy_root}" -maxdepth 1 -type f -name 'SCP-R-*.rego' -print -quit | grep -q .; then
            exit 0
          fi

          if [ ! -f "${common_file}" ]; then
            echo "::error file=${policy_root},title=SCP-E001::missing scp_common.rego — required by every SCP-R-NNN rule"
            exit 1
          fi

          for rule_file in "${policy_root}"/SCP-R-*.rego; do
            [ -e "${rule_file}" ] || continue

            rule_base="$(basename "${rule_file}" .rego)"
            test_file="${test_root}/$(printf '%s' "${rule_base}" | tr '[:upper:]-' '[:lower:]_')_test.rego"

            if [ ! -f "${test_file}" ]; then
              echo "::error file=${test_root},title=SCP-E001::missing OPA test file for ${rule_base}"
              exit 1
            fi

            # WP-SCP-022 slice 020C.1: load scp_common.rego alongside each
            # SCP-R-NNN rule so the waiver-aware + rule-config-aware
            # helpers resolve. Coverage threshold applies across all
            # loaded files; the per-rule test sets each exercise the
            # common helpers via their own waiver/rule-config tests.
            opa test \
              "${rule_file}" \
              "${common_file}" \
              "${test_file}" \
              --coverage \
              --threshold 90 \
              --fail-on-empty \
              -v
          done

      - name: Ensure caller-data dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Hash-pinned install via ${SCP_RUNTIME_ROOT}/requirements/policy-check.txt
          # (generated by pip-compile --generate-hashes — closes TF-020H3rg-002,
          # slice 020M).
          #
          # Closes 020M R1 SAFE-MAJ-002 (runner-preinstall bypass): ubuntu-24.04
          # GitHub-hosted runners preinstall pyyaml 6.0.1 from apt
          # (`python3-yaml`), so a presence-only conditional guard
          # (`if ! python3 -c 'import yaml'`) would skip the hash-pinned install
          # and run the workflow against the unhardened apt-shipped version.
          # The hash-pin protection MUST run on every workflow execution
          # regardless of runner-preinstalled state — the install is therefore
          # unconditional. `pip --require-hashes` is idempotent if the exact
          # pinned version is already in user-site; otherwise pip downloads
          # + hash-verifies + installs to user-site, which takes precedence
          # over system-site per PEP 370.
          python3 -m pip install --user --require-hashes -r "${SCP_RUNTIME_ROOT}/requirements/policy-check.txt" >/dev/null 2>&1 || {
            echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::unable to install pyyaml/jsonschema (hash-pinned via requirements/policy-check.txt) for rule-config wrapping/validation"
            exit 1
          }
          # Version-pin assertion: confirm the pinned versions are now active
          # (defends against a future PR that re-introduces a presence-only
          # conditional skip without updating the lockfile pins).
          if ! python3 -c 'import yaml, jsonschema; assert yaml.__version__ == "6.0.2"; assert jsonschema.__version__ == "4.23.0"' >/dev/null 2>&1; then
            actual="$(python3 -c 'import yaml, jsonschema; print(f"yaml={yaml.__version__} jsonschema={jsonschema.__version__}")' 2>/dev/null || echo 'unknown')"
            echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::pinned-version assertion failed after hash-pinned install (got: ${actual}; expected: yaml=6.0.2 jsonschema=4.23.0)"
            exit 1
          fi

      - name: Validate rule-config against schema
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${SCP_RULE_CONFIG_PATH}" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import jsonschema
          import yaml

          rule_config_path = Path(os.environ["SCP_RULE_CONFIG_PATH"])
          schema_path = Path(os.environ["SCP_RUNTIME_ROOT"]) / "schemas/rule-config.schema.json"

          if not schema_path.is_file():
              print(f"::error file={schema_path},title=SCP-E001::rule-config.schema.json missing from SCP runtime checkout")
              sys.exit(1)

          try:
              content = yaml.safe_load(rule_config_path.read_text()) or {}
              schema = json.loads(schema_path.read_text())
              validator = jsonschema.Draft202012Validator(
                  schema,
                  format_checker=jsonschema.FormatChecker(),
              )
              validator.validate(content)
          except Exception as exc:  # pragma: no cover - workflow runtime guard
              print(f"::error file={rule_config_path},title=SCP-E007::rule-config schema validation failed: {exc}")
              sys.exit(1)
          PY

      - name: Run shared policy-check invocation
        shell: bash
        run: |
          set -euo pipefail
          source "${SCP_RUNTIME_ROOT}/lib/policy_check_invocation.sh"
          scp_policy_check_run

      - name: Materialise repo-level inputs and evaluate repo-level rules (Option A — SCP-R-030)
        # WP-SCP-030 companion activation (D-058 second domain / proving
        # ground). The production gate evaluates per-file via conftest
        # (`scp_policy_check_run` above): conftest merges EACH file's own
        # content into `input` and injects caller config at `data.*`. A
        # repo-level rule whose input is the WHOLE repo (root CLAUDE.md +
        # `.scp/rule-config.yaml`) therefore cannot fire under that envelope —
        # which is exactly why SCP-R-030 (and SCP-R-006 before it) vacuous-pass
        # on `main`.
        #
        # This ADDITIVE step (Option A; `--combine` rejected — it would change
        # `input` shape for EVERY per-file rule) builds ONE repo-level input
        # envelope {rule_config, claude_md_present, claude_md} and runs
        # `opa eval` for the repo-level rule set against it, then MERGES the
        # resulting deny findings into the same `output/findings/policy-findings.json`
        # the render-deny (warn-baseline) + scorecard steps consume. The
        # conftest per-file pass (SCP-R-001..008) is UNTOUCHED — zero regression
        # surface. The reusable repo-level eval path is the substrate a future
        # SCP-R-006 / WP-SCP-028 activation extends (decision: build generally).
        #
        # SCOPE GUARD (decision 2): only rule_ids in REPO_LEVEL_RULES are
        # merged. SCP-R-006 stays DORMANT — its extra inputs
        # (changed_files/services_yml/estate_repos_yaml) are NOT materialised,
        # so it vacuous-passes even though `input.rule_config` is now present,
        # AND any deny it produced would be filtered out here regardless.
        #
        # Suppression is enforced INSIDE `data.main.deny` (the rule's deny
        # checks `not scp_active_waiver_for` + `not scp_rule_config_disabled`,
        # which read `data.waivers` / `data.rule_config`), so a disabled or
        # waived repo-level rule yields no deny here — the vacuous-pass path is
        # preserved. The data namespace is rebuilt to mirror the conftest pass's
        # `--data` wraps (lib:254-313); `input.rule_config` is the SAME parsed
        # `.scp/rule-config.yaml`, so opt-in (input) and disable (data) agree.
        #
        # FAIL-OPEN: SCP-R-030 ships warn-baseline (excluded from the merge-gate
        # threshold), so this observational step must never block an adopter
        # merge on an SCP-side opa hiccup. An eval error emits a loud ::error::
        # annotation and merges nothing; the selftest oracle (which asserts the
        # marker-absent finding IS produced) is what catches a broken eval path.
        # ⚠️ D-060 GATE (R1 safety_bypass SB-MIN-001): this fail-open is safe
        # ONLY while SCP-R-030 is in WARN_BASELINE_RULES. A future deny-promotion
        # (D-060) that removes SCP-R-030 from the warn-baseline set MUST, in the
        # SAME PR, convert this block to FAIL-CLOSED (re-raise non-zero), else an
        # opa hiccup becomes a silent merge-gate bypass for a now-blocking rule.
        #
        # OBSERVABILITY ASYMMETRY (R1 CORR-NIT-003 / CG-MIN-001): a repo-level
        # rule disabled via .scp/rule-config.yaml is suppressed INSIDE
        # data.main.deny (no deny emitted), so — unlike the conftest per-file
        # pass — this step writes NO `disabled-rules.json` record for it. The
        # suppression is correct (no false finding); only the scorecard's
        # disabled-rules audit trail under-reports repo-level disables. Writing
        # an analogous record (from data.main.warn) is a tracked-forward
        # enhancement, deferred so the warn-merge surface stays minimal for v1.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          # The repo-level rule set materialised by THIS PR. SCP-R-006 and the
          # auth domain (WP-SCP-028) are deliberately NOT in this set yet.
          REPO_LEVEL_RULES = {"SCP-R-030"}

          # The adopter root == the fixture root ("." for production adopters;
          # the fixture subtree under the selftest harness — see SCP_FIXTURE_PATH
          # semantics in the "Collect changed files" step).
          fixture_root = os.environ.get("SCP_FIXTURE_PATH") or "."
          rule_config_env = os.environ.get("SCP_RULE_CONFIG_PATH") or ".scp/rule-config.yaml"
          waivers_env = os.environ.get("SCP_WAIVERS_PATH") or ""
          opa_bin = os.environ["SCP_POLICY_CHECK_OPA_BIN"]
          policy_root = os.environ["SCP_POLICY_CHECK_POLICY_ROOT"]
          runner_temp = Path(os.environ.get("RUNNER_TEMP", "."))
          findings_path = Path("output/findings/policy-findings.json")

          def emit_error(message):
              print(f"::error file=.github/workflows/policy-check.yml,title=SCP-E001::{message}")

          # --- input.claude_md{,_present}: adopter root CLAUDE.md -----------------
          claude_md_file = Path(fixture_root) / "CLAUDE.md"
          claude_md_present = claude_md_file.is_file()
          claude_md = ""
          if claude_md_present:
              try:
                  claude_md = claude_md_file.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  # Present-but-unreadable: content "" keeps the rule total
                  # (scp_r_030_claude_md_content), presence stays true so the
                  # claude_md_absent branch does not misfire on a binary blob.
                  claude_md = ""

          # --- input.rule_config: parse .scp/rule-config.yaml (mirror lib:280-313)
          # but place at input.rule_config (NOT data.rule_config). Defensive {}:
          # the "Validate rule-config against schema" step already ran and would
          # have failed the job on a malformed file, so {} is only reached for an
          # absent file.
          rule_config = {}
          rule_config_path = Path(rule_config_env)
          if rule_config_path.is_file():
              try:
                  parsed = yaml.safe_load(rule_config_path.read_text(encoding="utf-8")) or {}
              except Exception:  # pragma: no cover - workflow runtime guard
                  parsed = {}
              if isinstance(parsed, dict):
                  rule_config = parsed

          # --- data.waivers: caller-side waiver doc (JSON), for scp_active_waiver_for
          waivers = []
          if waivers_env:
              waivers_path = Path(waivers_env)
              if waivers_path.is_file():
                  try:
                      loaded = json.loads(waivers_path.read_text(encoding="utf-8"))
                  except Exception:
                      loaded = []
                  if isinstance(loaded, list):
                      waivers = loaded

          envelope = {
              "rule_config": rule_config,
              "claude_md_present": claude_md_present,
              "claude_md": claude_md,
          }
          # data.rule_config (disable path) + data.waivers (waiver path) — same
          # parsed rule-config so opt-in (input) and disable (data) never diverge.
          data_doc = {"rule_config": rule_config, "waivers": waivers}

          input_file = runner_temp / "scp-repo-level-input.json"
          data_file = runner_temp / "scp-repo-level-data.json"
          input_file.write_text(json.dumps(envelope))
          data_file.write_text(json.dumps(data_doc))

          # opa eval the shared `deny` set against the repo-level envelope.
          # Load ONLY scp_common.rego (the suppression helpers) + each
          # repo-level rule's own .rego — NOT the whole policies/ dir. Loading
          # the dir also pulls policies/tests/*_test.rego (package main_test),
          # which makes `opa eval` exit 2 (diagnostic on STDOUT, stderr empty).
          # This mirrors the PROVEN conflict-gate adapter invocation
          # (tests/conflict_gate/test_conflict_gate.py::_run_opa = rule file(s)
          # + scp_common). Restricting the loaded rule set to REPO_LEVEL_RULES
          # also keeps SCP-R-006 unloaded (belt-and-suspenders with the filter).
          cmd = [opa_bin, "eval", "--format", "json"]
          cmd += ["--data", str(Path(policy_root) / "scp_common.rego")]
          for rid in sorted(REPO_LEVEL_RULES):
              cmd += ["--data", str(Path(policy_root) / f"{rid}.rego")]
          cmd += ["--data", str(data_file), "--input", str(input_file), "data.main.deny"]
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              # OPA writes compile/eval errors to STDOUT in --format json
              # (stderr is often empty); surface both so CI logs are diagnosable.
              sys.stderr.write((result.stderr or "") + (result.stdout or ""))
              emit_error(
                  f"repo-level opa eval failed (exit {result.returncode}); SCP-R-030 "
                  "is warn-baseline so this does NOT block the gate — merged no "
                  f"repo-level findings this run. stdout: {(result.stdout or '')[:600]}"
              )
              raise SystemExit(0)

          try:
              parsed_out = json.loads(result.stdout or "{}")
          except json.JSONDecodeError:
              emit_error("repo-level opa eval produced unparseable JSON; merged no repo-level findings this run")
              raise SystemExit(0)

          deny_outputs = []
          for res in parsed_out.get("result", []):
              for expr in res.get("expressions", []):
                  value = expr.get("value")
                  if isinstance(value, list):
                      deny_outputs.extend(value)

          merged = []
          for out in deny_outputs:
              if not isinstance(out, dict):
                  continue
              rule_id = out.get("rule_id", "")
              if rule_id not in REPO_LEVEL_RULES:
                  continue
              file_value = out.get("file") or out.get("path") or "CLAUDE.md"
              merged.append({
                  "verdict": "deny",
                  "rule_id": str(rule_id),
                  "file": str(file_value),
                  "path": str(file_value),
                  "message": str(out.get("message", out.get("msg", ""))),
                  "remediation_url": str(out.get("remediation_url", "")),
              })

          # Deterministic order (the OPA set serialises to a JSON array whose
          # order is not contractually stable) so the selftest oracle matches.
          merged.sort(key=lambda f: (f["rule_id"], f["message"]))

          existing = []
          if findings_path.exists():
              try:
                  loaded = json.loads(findings_path.read_text())
              except json.JSONDecodeError:
                  loaded = []
              if isinstance(loaded, list):
                  existing = loaded
          existing.extend(merged)
          findings_path.parent.mkdir(parents=True, exist_ok=True)
          findings_path.write_text(json.dumps(existing, indent=2) + "\n")

          if merged:
              print(f"::debug::repo-level eval merged {len(merged)} finding(s): {[f['rule_id'] for f in merged]}")
          PY

      - name: Install cosign for auth-canonical verification (WP-SCP-028 Phase 2)
        # Only the PRODUCTION path (a real adopter run; selftest-mode false)
        # cosign-verifies CT's signed canonicals from the public surface.
        # Selftest invocations use the deterministic simulate seam
        # (auth-canonical-source = a fixture dir + simulate-auth-verified) and
        # never touch cosign/network in THIS step; the real cosign+live-surface
        # path is exercised by the standalone `auth-canonical-cosign-smoke` job
        # in workflow-selftest.yml AND by every production adopter run. Pinned
        # to the SAME cosign-installer SHA CT's contract-manifest-publish.yml
        # uses (estate-consistent). `cosign verify-blob` with a Sigstore bundle
        # is keyless — it needs NO id-token: write (only signing does).
        if: ${{ !inputs.selftest-mode }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Materialise auth-canonical inputs and evaluate auth rules (WP-SCP-028 Phase 2)
        # WP-SCP-028 Phase 2 companion materialisation (D-058 FIRST auth
        # domain). Mirrors the SCP-R-030 Option-A repo-level opa eval step
        # above: an ADDITIVE pass that builds ONE repo-level input envelope for
        # the auth-canonical rules (SCP-R-009/010/011), evaluates them with
        # `opa eval`, and MERGES their findings into the same
        # output/findings/policy-findings.json the render-deny (warn-baseline)
        # + scorecard steps consume. The conftest per-file pass (SCP-R-001..008)
        # is UNTOUCHED — `--combine` is NOT used (it would change `input` shape
        # for every per-file rule). Zero regression surface for the deny gate.
        #
        # TRUST BOUNDARY (FUP-WP-SCP-028-VERIFIED-FLAG-TRUST-BOUNDARY-001 — the
        # crux): `auth_contract_verified` / `canonical_sdk_versions_verified`
        # are derived ONLY from THIS workflow's own `cosign verify-blob` exit
        # status (production) or the harness `simulate-auth-verified` WORKFLOW
        # INPUT (selftest). They are NEVER read from the adopter/fixture repo
        # tree, nor from the canonical's own bytes. An adopter file ASSERTING
        # `verified: true` cannot flip the flag (proven by the
        # fixture-scp-r-028-trust-boundary selftest fixture). On a present-but-
        # unverified canonical the rules emit their fail-closed signature
        # finding (deny-class, warn-rendered) — never silent trust.
        #
        # CANONICAL SOURCE (D-061): production fetches CT's signed canonicals
        # from the PUBLIC estate-canonicals surface (control-tower is private →
        # 404 unauth in adopter CI) and cosign-verifies BOTH (Decision A: the
        # sdk-versions manifest is cosign-signed too, one trust mechanism).
        #
        # SCOPE GUARD: only rule_ids in AUTH_RULES are merged. SCP-R-006 /
        # SCP-R-030 are evaluated by their OWN steps, not here.
        #
        # DENY/WARN FOLDING + ⚠️ D-059 GATE: the rego rules split deny-class
        # (downgrade / fail-closed / tier_deny shadow / old-shape / invalid-
        # issuer — `data.main.deny`) from inherently-warn-class (stale pin /
        # tier_warn shadow / claim-shape MAJOR-lag — `data.main.warn`). Both are
        # merged here as verdict "deny" and demoted to ::warning:: SOLELY by
        # SCP-R-009/010/011 membership in WARN_BASELINE_RULES (rule-level warn-
        # baseline). This folding is forced because schemas/policy-check-
        # summary.schema.json's verdict enum is {allow,deny,waived,disabled} —
        # there is no finding-level "warn" verdict. It is SAFE ONLY while all
        # three rules are in BOTH WARN_BASELINE_RULES sites. A future D-059
        # deny-promotion that removes a rule from the warn-baseline set MUST, in
        # the SAME PR: (a) stop folding THAT rule's `data.main.warn` outputs into
        # verdict "deny" (else a stale-pin/tier_warn warning would become a
        # BLOCKING deny — the rego deliberately keeps those warn-class), and
        # (b) add a non-blocking render path for them (e.g. a "warn" verdict in
        # the summary schema + render-deny). The rego already separates the two
        # classes; only this fold + the schema need the split. (c) RE-VERIFY the
        # selftest seam stays closed to adopters: the simulate path below is
        # identity-gated to GITHUB_REPOSITORY == the SCP repo (so an adopter
        # cannot fake `*_verified` even with selftest-mode:true), but a
        # deny-promotion must confirm that guard before the rule can block.
        #
        # FAIL-OPEN: like the SCP-R-030 step, all three rules ship warn-baseline,
        # so an SCP-side opa/cosign/network hiccup must never block an adopter
        # merge: an eval error emits a loud ::error:: and merges nothing. ⚠️ The
        # same D-059 promotion that removes a rule from WARN_BASELINE_RULES MUST
        # convert this fail-open to fail-closed for that rule, else a hiccup
        # becomes a silent merge-gate bypass for a now-blocking rule.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          import yaml

          AUTH_RULES = {"SCP-R-009", "SCP-R-010", "SCP-R-011"}
          AUTH_RULE_FILES = ("SCP-R-009.rego", "SCP-R-010.rego", "SCP-R-011.rego")

          PUBLIC_BASE = "https://raw.githubusercontent.com/jrnb2024/estate-canonicals/main"
          CT_IDENTITY = (
              "https://github.com/jrnb2024/control-tower/.github/workflows/"
              "contract-manifest-publish.yml@refs/heads/main"
          )
          CT_ISSUER = "https://token.actions.githubusercontent.com"

          fixture_root = os.environ.get("SCP_FIXTURE_PATH") or "."
          rule_config_env = os.environ.get("SCP_RULE_CONFIG_PATH") or ".scp/rule-config.yaml"
          waivers_env = os.environ.get("SCP_WAIVERS_PATH") or ""
          opa_bin = os.environ["SCP_POLICY_CHECK_OPA_BIN"]
          policy_root = os.environ["SCP_POLICY_CHECK_POLICY_ROOT"]
          runner_temp = Path(os.environ.get("RUNNER_TEMP", "."))
          findings_path = Path("output/findings/policy-findings.json")

          auth_source = os.environ.get("SCP_AUTH_CANONICAL_SOURCE") or "live"
          simulate_verified = os.environ.get("SCP_SIMULATE_AUTH_VERIFIED", "") == "true"
          selftest_mode = os.environ.get("SCP_SELFTEST_MODE", "") == "true"

          def emit_error(message):
              print(f"::error file=.github/workflows/policy-check.yml,title=SCP-E001::{message}")

          def as_dict(parsed):
              return parsed if isinstance(parsed, dict) else {}

          def load_yaml_text(text):
              try:
                  return as_dict(yaml.safe_load(text) or {})
              except Exception:
                  return {}

          def read_text(path):
              try:
                  return Path(path).read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  return ""

          def http_get(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "scp-policy-check"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.read()
              except (urllib.error.URLError, OSError, ValueError):
                  return None

          def cosign_verify(content_path, bundle_path):
              # The ONLY source of truth for `*_verified` on the production path:
              # the exit status of cosign verify-blob against CT's keyless
              # Sigstore identity. Never adopter content, never the canonical
              # bytes themselves.
              try:
                  result = subprocess.run(
                      [
                          "cosign", "verify-blob",
                          "--certificate-identity", CT_IDENTITY,
                          "--certificate-oidc-issuer", CT_ISSUER,
                          "--bundle", str(bundle_path),
                          str(content_path),
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                  return result.returncode == 0
              except (OSError, ValueError):
                  return False

          # --- adopter input extraction (the static extractor; Rego cannot
          # AST-parse). CONSERVATIVE by design: prefers FALSE-NEGATIVES (a missed
          # shadow) over FALSE-POSITIVES, because at warn-baseline a missed
          # finding is observability debt while a spurious finding is adopter
          # friction. The evasion surface this leaves open is recorded at
          # docs/reviews/WP-SCP-028/import-fence-evasion-surface.md
          # (FUP-WP-SCP-028-IMPORT-FENCE-EVASION-DOC-001) so D-059 does not
          # mistake the extractor for exhaustive.
          CT_AUTH_PACKAGE_ALIASES = {
              "ct-auth-python": "ct-auth-python",
              "ct-auth": "ct-auth-python",
              "ct-auth-ts": "ct-auth-ts",
              "control-tower-auth": "ct-auth-ts",
              "@control-tower/auth": "ct-auth-ts",
              "ct-auth-go": "ct-auth-go",
              "ct-rbac-go": "ct-rbac-go",
              "ct-tenant-go": "ct-tenant-go",
              "ct-http-go": "ct-http-go",
              "ct-webhooks-go": "ct-webhooks-go",
              "ct-sdk-common": "ct-sdk-common",
          }
          SKIP_DIRS = {
              ".git", "node_modules", "vendor", "dist", "build", ".venv", "venv",
              "__pycache__", ".scp-runtime", "_scp-workflow", "output", ".mypy_cache",
          }
          LANG_BY_EXT = {".py": "python", ".ts": "typescript", ".tsx": "typescript", ".go": "go"}
          CT_AUTH_IMPORT_MARKERS = (
              "ct_auth", "ct-auth", "control-tower-auth", "@control-tower/auth",
              "control_tower_auth",
          )

          def canonical_pkg(identifier):
              key = (identifier or "").strip().lower()
              if key in CT_AUTH_PACKAGE_ALIASES:
                  return CT_AUTH_PACKAGE_ALIASES[key]
              seg = key.rsplit("/", 1)[-1]
              return CT_AUTH_PACKAGE_ALIASES.get(seg)

          def semver_floor(spec):
              m = re.search(r"(\d+)\.(\d+)\.(\d+)", spec or "")
              return f"{m.group(1)}.{m.group(2)}.{m.group(3)}" if m else ""

          def walk_files(root):
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
                  for fn in filenames:
                      yield Path(dirpath) / fn

          def dedupe(items):
              seen = set()
              out = []
              for x in items:
                  if x not in seen:
                      seen.add(x)
                      out.append(x)
              return out

          def deps_from_pyproject(path, rel):
              text = read_text(path)
              out = []
              data = None
              try:
                  import tomllib
                  data = tomllib.loads(text)
              except Exception:
                  data = None
              if isinstance(data, dict):
                  proj = data.get("project", {})
                  if isinstance(proj, dict):
                      for entry in proj.get("dependencies", []) or []:
                          if isinstance(entry, str):
                              m = re.match(r"\s*([A-Za-z0-9._-]+)", entry)
                              if m:
                                  pkg = canonical_pkg(m.group(1))
                                  if pkg:
                                      out.append({"package": pkg, "version": semver_floor(entry), "file": rel})
                  tool = data.get("tool", {})
                  poetry = tool.get("poetry", {}) if isinstance(tool, dict) else {}
                  pdeps = poetry.get("dependencies", {}) if isinstance(poetry, dict) else {}
                  if isinstance(pdeps, dict):
                      for dep_name, spec in pdeps.items():
                          pkg = canonical_pkg(dep_name)
                          if pkg:
                              ver = spec if isinstance(spec, str) else (spec.get("version", "") if isinstance(spec, dict) else "")
                              out.append({"package": pkg, "version": semver_floor(ver), "file": rel})
                  return out
              for line in text.splitlines():
                  m = re.match(r'\s*"?([A-Za-z0-9._@/-]+)"?\s*[:=]\s*"?[~^>=<! ]*(\d+\.\d+\.\d+)', line)
                  if m:
                      pkg = canonical_pkg(m.group(1))
                      if pkg:
                          out.append({"package": pkg, "version": semver_floor(m.group(2)), "file": rel})
              return out

          def deps_from_package_json(path, rel):
              out = []
              try:
                  data = json.loads(read_text(path) or "{}")
              except json.JSONDecodeError:
                  return out
              if not isinstance(data, dict):
                  return out
              for section in ("dependencies", "devDependencies", "peerDependencies"):
                  block = data.get(section, {})
                  if isinstance(block, dict):
                      for dep_name, spec in block.items():
                          pkg = canonical_pkg(dep_name)
                          if pkg and isinstance(spec, str):
                              out.append({"package": pkg, "version": semver_floor(spec), "file": rel})
              return out

          def deps_from_go_mod(path, rel):
              out = []
              for line in read_text(path).splitlines():
                  s = line.strip()
                  m = re.match(r"(?:require\s+)?([A-Za-z0-9._~/-]+)\s+v(\d+\.\d+\.\d+)", s)
                  if m:
                      pkg = canonical_pkg(m.group(1))
                      if pkg:
                          out.append({"package": pkg, "version": semver_floor(m.group(2)), "file": rel})
              return out

          def imports_ct_auth(text, lang):
              for raw in text.splitlines():
                  s = raw.strip()
                  if not any(marker in s for marker in CT_AUTH_IMPORT_MARKERS):
                      continue
                  if lang == "python" and (s.startswith("import ") or s.startswith("from ")):
                      return True
                  if lang == "typescript" and ("import" in s or "require(" in s):
                      return True
                  if lang == "go" and '"' in s:
                      return True
              return False

          def declared_symbols(text, lang):
              syms = []
              for raw in text.splitlines():
                  s = raw.strip()
                  if lang == "python":
                      m = re.match(r"(?:async\s+)?def\s+([A-Za-z_]\w*)", s) or re.match(r"class\s+([A-Za-z_]\w*)", s)
                      if m:
                          syms.append(m.group(1))
                  elif lang == "typescript":
                      m = (
                          re.match(r"export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)", s)
                          or re.match(r"export\s+(?:default\s+)?class\s+([A-Za-z_$][\w$]*)", s)
                          or re.match(r"export\s+const\s+([A-Za-z_$][\w$]*)", s)
                          or re.match(r"(?:async\s+)?function\s+([A-Za-z_$][\w$]*)", s)
                          or re.match(r"class\s+([A-Za-z_$][\w$]*)", s)
                      )
                      if m:
                          syms.append(m.group(1))
                  elif lang == "go":
                      m = re.match(r"func\s+(?:\([^)]*\)\s*)?([A-Za-z_]\w*)", s) or re.match(r"type\s+([A-Za-z_]\w*)", s)
                      if m:
                          syms.append(m.group(1))
              return dedupe(syms)

          def reexported_symbols(text, lang):
              syms = []
              for raw in text.splitlines():
                  s = raw.strip()
                  if lang == "typescript":
                      m = re.match(r"export\s*\{([^}]*)\}", s)
                      if m:
                          for part in m.group(1).split(","):
                              name = part.strip().split(" as ")[-1].strip()
                              if re.fullmatch(r"[A-Za-z_$][\w$]*", name):
                                  syms.append(name)
                  elif lang == "python":
                      if re.match(r"__all__\s*[:=]", s):
                          syms.extend(re.findall(r"['\"]([A-Za-z_]\w*)['\"]", s))
              return dedupe(syms)

          def handles_authorization(text):
              low = text.lower()
              return ("authorization" in low) or ("bearer " in low)

          def declared_claim_shape_version(text):
              m = re.search(r"claim[_-]?shape[_-]?version\s*[:=]\s*['\"]?(\d+\.\d+\.\d+)", text, re.IGNORECASE)
              return m.group(1) if m else ""

          def hardcoded_issuers(text):
              # Conservative: only quoted values on a line that mentions iss/issuer
              # AND that look issuer-shaped (a URL, or a control-tower token). Avoids
              # flagging arbitrary string literals. A non-canonical issuer here drives
              # SCP-R-011's deny-class finding (warn-rendered); a canonical one does not.
              issuers = []
              for raw in text.splitlines():
                  if not re.search(r"\biss(?:uer)?\b", raw, re.IGNORECASE):
                      continue
                  for m in re.finditer(r"""['"]([^'"]+)['"]""", raw):
                      val = m.group(1).strip()
                      low = val.lower()
                      if val and (low.startswith("http://") or low.startswith("https://") or "control-tower" in low):
                          issuers.append(val)
              return dedupe(issuers)

          def claims_uses_old_shape(text):
              return bool(re.search(r"claims[_-]?uses[_-]?old[_-]?shape\s*[:=]\s*(?:true|1|yes)", text, re.IGNORECASE))

          def extract_ct_auth_deps(root):
              deps = []
              for path in walk_files(root):
                  rel = str(path)
                  if path.name == "pyproject.toml":
                      deps.extend(deps_from_pyproject(path, rel))
                  elif path.name == "package.json":
                      deps.extend(deps_from_package_json(path, rel))
                  elif path.name == "go.mod":
                      deps.extend(deps_from_go_mod(path, rel))
              return deps

          def extract_adopter_code(root):
              source_files = []
              auth_handlers = []
              for path in walk_files(root):
                  lang = LANG_BY_EXT.get(path.suffix)
                  if not lang:
                      continue
                  text = read_text(path)
                  if not text:
                      continue
                  rel = str(path)
                  if imports_ct_auth(text, lang):
                      source_files.append({
                          "path": rel,
                          "language": lang,
                          "imports_ct_auth": True,
                          "declared_symbols": declared_symbols(text, lang),
                          "reexported_symbols": reexported_symbols(text, lang),
                      })
                  if handles_authorization(text):
                      auth_handlers.append({
                          "path": rel,
                          "language": lang,
                          "handles_authorization": True,
                          "declared_claim_shape_version": declared_claim_shape_version(text),
                          "hardcoded_issuers": hardcoded_issuers(text),
                          "claims_uses_old_shape": claims_uses_old_shape(text),
                      })
              return source_files, auth_handlers

          adopter_ct_auth_deps = extract_ct_auth_deps(fixture_root)
          adopter_source_files, adopter_auth_handlers = extract_adopter_code(fixture_root)
          has_auth_surface = bool(adopter_ct_auth_deps or adopter_source_files or adopter_auth_handlers)

          # --- canonical bytes + the `*_verified` trust boundary ---------------
          auth_contract = {}
          auth_contract_verified = False
          canonical_sdk_versions = {}
          canonical_sdk_versions_verified = False

          if not selftest_mode:
              # PRODUCTION adopter. The auth-canonical-source / simulate-auth-verified
              # selftest seams are IGNORED here (honoured ONLY when selftest-mode is
              # true) — a production run can NEVER substitute the canonical source or
              # the `*_verified` flag, so an adopter cannot game its own auth gate via
              # `with:` inputs (matters at D-059 if a rule is deny-promoted). With an
              # auth surface, fetch CT's signed canonicals from the PUBLIC
              # estate-canonicals surface (D-061) + cosign-verify BOTH (Decision A);
              # `*_verified` derives from the cosign exit and nothing else.
              if has_auth_surface:
                  ac_bytes = http_get(f"{PUBLIC_BASE}/auth-contract-v1.yaml")
                  ac_sig = http_get(f"{PUBLIC_BASE}/auth-contract-v1.yaml.sig.bundle")
                  if ac_bytes is not None and ac_sig is not None:
                      ac_file = runner_temp / "scp-auth-contract-v1.yaml"
                      ac_bundle = runner_temp / "scp-auth-contract-v1.yaml.sig.bundle"
                      ac_file.write_bytes(ac_bytes)
                      ac_bundle.write_bytes(ac_sig)
                      auth_contract = load_yaml_text(ac_bytes.decode("utf-8", "replace"))
                      auth_contract_verified = cosign_verify(ac_file, ac_bundle)
                  sv_bytes = http_get(f"{PUBLIC_BASE}/canonical-sdk-versions.yaml")
                  sv_sig = http_get(f"{PUBLIC_BASE}/canonical-sdk-versions.yaml.sig.bundle")
                  if sv_bytes is not None and sv_sig is not None:
                      sv_file = runner_temp / "scp-canonical-sdk-versions.yaml"
                      sv_bundle = runner_temp / "scp-canonical-sdk-versions.yaml.sig.bundle"
                      sv_file.write_bytes(sv_bytes)
                      sv_bundle.write_bytes(sv_sig)
                      canonical_sdk_versions = load_yaml_text(sv_bytes.decode("utf-8", "replace"))
                      canonical_sdk_versions_verified = cosign_verify(sv_file, sv_bundle)
          elif auth_source != "live" and os.environ.get("GITHUB_REPOSITORY", "") == "jrnb2024/standards-control-plane":
              # SELFTEST auth fixture (selftest-mode true + a harness-supplied
              # canonical dir OUTSIDE the fixture-path subtree, so conftest never
              # enumerates it). IDENTITY-GATED to the SCP repo itself
              # (GITHUB_REPOSITORY) so an adopter CANNOT reach this seam even by
              # forcing selftest-mode:true + vendoring the SCP runtime files — the
              # simulate path is unreachable outside SCP's own workflow-selftest
              # (safety_bypass R1 MAJ; defence-in-depth for D-059 deny-promotion).
              # Read the canonical BYTES from that dir and derive
              # `*_verified` from the simulate INPUT (a workflow input, NEVER repo
              # content — the FUP-001 trust boundary). Deterministic + drift-proof;
              # no network, no cosign. The real cosign+live path is covered by the
              # auth-canonical-cosign-smoke job + every production run.
              src = Path(auth_source)
              ac = src / "auth-contract-v1.yaml"
              if ac.is_file():
                  auth_contract = load_yaml_text(read_text(ac))
              sv = src / "canonical-sdk-versions.yaml"
              if sv.is_file():
                  canonical_sdk_versions = load_yaml_text(read_text(sv))
              auth_contract_verified = simulate_verified
              canonical_sdk_versions_verified = simulate_verified
          # else: selftest-mode with source=="live" (the existing fixtures + SCP
          # self-dogfood) — leave canonicals absent ({}) so the auth rules
          # vacuous-pass exactly as on main, the committed fixture oracles stay
          # byte-identical, and no network/cosign runs.

          # --- input.rule_config + data.{rule_config,waivers} (mirror SCP-R-030)
          rule_config = {}
          rule_config_path = Path(rule_config_env)
          if rule_config_path.is_file():
              try:
                  parsed = yaml.safe_load(rule_config_path.read_text(encoding="utf-8")) or {}
              except Exception:
                  parsed = {}
              if isinstance(parsed, dict):
                  rule_config = parsed

          waivers = []
          if waivers_env:
              waivers_path = Path(waivers_env)
              if waivers_path.is_file():
                  try:
                      loaded = json.loads(waivers_path.read_text(encoding="utf-8"))
                  except Exception:
                      loaded = []
                  if isinstance(loaded, list):
                      waivers = loaded

          envelope = {
              "auth_contract": auth_contract,
              "auth_contract_verified": auth_contract_verified,
              "canonical_sdk_versions": canonical_sdk_versions,
              "canonical_sdk_versions_verified": canonical_sdk_versions_verified,
              "adopter_ct_auth_deps": adopter_ct_auth_deps,
              "adopter_source_files": adopter_source_files,
              "adopter_auth_handlers": adopter_auth_handlers,
              "rule_config": rule_config,
          }
          data_doc = {"rule_config": rule_config, "waivers": waivers}

          input_file = runner_temp / "scp-auth-input.json"
          data_file = runner_temp / "scp-auth-data.json"
          input_file.write_text(json.dumps(envelope))
          data_file.write_text(json.dumps(data_doc))

          # opa eval the deny set and the warn set as SEPARATE single-ref
          # queries (the PROVEN SCP-R-030 form — the expression value is a JSON
          # array). Load ONLY scp_common.rego + each auth rule's own .rego — NOT
          # the whole policies/ dir (loading the dir pulls policies/tests/
          # *_test.rego (package main_test) and `opa eval` exits 2 with the
          # diagnostic on STDOUT; this cost a CI round on #201).
          def run_eval(query):
              cmd = [opa_bin, "eval", "--format", "json"]
              cmd += ["--data", str(Path(policy_root) / "scp_common.rego")]
              for rf in AUTH_RULE_FILES:
                  cmd += ["--data", str(Path(policy_root) / rf)]
              cmd += ["--data", str(data_file), "--input", str(input_file), query]
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  sys.stderr.write((result.stderr or "") + (result.stdout or ""))
                  emit_error(
                      f"auth-canonical opa eval failed for '{query}' (exit "
                      f"{result.returncode}); SCP-R-009/010/011 are warn-baseline so "
                      "this does NOT block the gate — merged no auth findings this "
                      f"run. stdout: {(result.stdout or '')[:400]}"
                  )
                  return None
              try:
                  parsed_out = json.loads(result.stdout or "{}")
              except json.JSONDecodeError:
                  emit_error(f"auth-canonical opa eval produced unparseable JSON for '{query}'; merged nothing")
                  return None
              outs = []
              for res in parsed_out.get("result", []):
                  for expr in res.get("expressions", []):
                      value = expr.get("value")
                      if isinstance(value, list):
                          outs.extend(value)
              return outs

          deny_outputs = run_eval("data.main.deny")
          warn_outputs = run_eval("data.main.warn")
          if deny_outputs is None and warn_outputs is None:
              # Both evals errored (already annotated); fail-open, merge nothing.
              raise SystemExit(0)
          deny_outputs = deny_outputs or []
          warn_outputs = warn_outputs or []

          def to_finding(out):
              if not isinstance(out, dict):
                  return None
              # `data.main.warn` carries BOTH inherently-warn findings AND
              # suppression-observability records ({"kind": "waiver"/"rule-config-
              # disable", ...}). Skip the kind-bearing records — a suppressed
              # finding must not render. (Repo-level suppression under-reports in
              # disabled-rules.json/waivers-applied.json exactly as the SCP-R-030
              # step documents; tracked-forward, harmless at warn-baseline.)
              if "kind" in out:
                  return None
              rule_id = out.get("rule_id", "")
              if rule_id not in AUTH_RULES:
                  return None
              file_value = out.get("file") or out.get("path") or "auth-canonical"
              return {
                  "verdict": "deny",
                  "rule_id": str(rule_id),
                  "file": str(file_value),
                  "path": str(file_value),
                  "message": str(out.get("message", out.get("msg", ""))),
                  "remediation_url": str(out.get("remediation_url", "")),
              }

          merged = []
          seen = set()
          for out in deny_outputs + warn_outputs:
              finding = to_finding(out)
              if finding is None:
                  continue
              key = (finding["rule_id"], finding["file"], finding["message"])
              if key in seen:
                  continue
              seen.add(key)
              merged.append(finding)

          # Deterministic order so the selftest oracle matches (the OPA set
          # serialises to a JSON array whose order is not contractually stable).
          merged.sort(key=lambda f: (f["rule_id"], f["message"]))

          existing = []
          if findings_path.exists():
              try:
                  loaded = json.loads(findings_path.read_text())
              except json.JSONDecodeError:
                  loaded = []
              if isinstance(loaded, list):
                  existing = loaded
          existing.extend(merged)
          findings_path.parent.mkdir(parents=True, exist_ok=True)
          findings_path.write_text(json.dumps(existing, indent=2) + "\n")

          if merged:
              print(f"::debug::auth-canonical eval merged {len(merged)} finding(s): {[f['rule_id'] for f in merged]}")
          PY

      - name: Emit SCP-R-003 no-manifest observability record
        shell: bash
        run: |
