              raise SystemExit(0)

          payload = json.loads(path.read_text())
          config_path = os.environ.get("SCP_RULE_CONFIG_PATH", ".scp/rule-config.yaml")
          for item in payload:
              rule_id = item.get("rule_id", "unknown-rule")
              reason = item.get("reason", "disabled")
