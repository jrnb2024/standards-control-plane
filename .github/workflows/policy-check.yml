      - name: Emit expired-rule-config one-release warning
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${SCP_RULE_CONFIG_PATH}" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          # WP-SCP-022 slice 020C.1 (v): rule-config disable with an
          # expires_at in the past still suppresses (Rego layer continues
          # to honour disable=true) for ONE release as a deprecation
          # ramp, but each PR run emits a workflow-level warning so the
          # caller is reminded to remove or extend the override.
          config_path = Path(os.environ["SCP_RULE_CONFIG_PATH"])
          if not config_path.is_file():
              raise SystemExit(0)

          try:
              content = yaml.safe_load(config_path.read_text()) or {}
          except yaml.YAMLError as exc:
              # Schema-validation step ahead of this would have caught a
              # malformed file; this is a defensive no-op.
              print(f"::warning ::rule-config parse failed: {exc}", file=sys.stderr)
              raise SystemExit(0)

          rules = content.get("rules", {}) if isinstance(content, dict) else {}
          if not isinstance(rules, dict):
              raise SystemExit(0)

          now = datetime.now(timezone.utc)

          for rule_id, cfg in rules.items():
              if not isinstance(cfg, dict):
                  continue
              if not cfg.get("disable"):
                  continue
              raw = cfg.get("expires_at", "")
              if not isinstance(raw, str) or not raw:
                  continue
              try:
                  if "T" in raw:
                      expiry = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  else:
                      expiry = datetime.fromisoformat(f"{raw}T00:00:00+00:00")
              except ValueError:
                  continue
              if expiry.tzinfo is None:
                  expiry = expiry.replace(tzinfo=timezone.utc)
              if expiry >= now:
                  continue
              expired_date = expiry.date().isoformat()
              print(
                  f"::warning file={config_path},title={rule_id}::"
                  f"rule-config disable expired {expired_date}; remove or extend"
              )
          PY

      - name: Render deny annotations and enforce threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path("output/findings/policy-findings.json")
          if not path.exists():
              raise SystemExit(0)

          # Warn-baseline rule allow-list. Rules in this set fire the deny
          # rule (raw findings exist) but are rendered as ::warning::
          # annotations rather than ::error:: AND are excluded from the
          # threshold check so they cannot block merge. SCP-R-004 (added
          # at v1.1.0 per slice 020P) was the first warn-baseline rule;
          # SCP-R-008 the second; SCP-R-030 (WP-SCP-030 companion activation
          # — the FIRST repo-level rule, fed by the Option-A opa eval step
          # above) the third. SCP-R-008 STAYS warn at v2.0.0 (amended D-053,
          # operator decision 2026-06-10): v2.0.0's rule-inputs contract is
          # what first makes the rule actually FIRE (the old feed never
          # delivered .env content), so it earns deny on real-traffic
          # evidence, not on the same release that unblinds it. NB the
          # membership here is the load-bearing
          # half of the WP-SCP-030 §4.1 coupling guard: it must land in the
          # SAME PR as the materialisation step, else an opted-in
          # missing-marker adopter would deny-BLOCK instead of warn.
          # When the set grows further, consider promoting this to a
          # data-driven manifest at policies/rule-baselines.yaml
          # (TF-020P-001 forward-compat candidate). Promotion of a rule
          # from warn → deny default (e.g. SCP-R-030 → D-060) requires
          # a separate RFC-NNN / decision per docs/reviews/rule-proposals/
          # README.md §When to file + removal from this set.
          #
          # WP-SCP-028 Phase 2 (companion materialisation) adds the three
          # auth-canonical rules SCP-R-009/010/011 (D-058 first auth domain).
          # Like SCP-R-030, this membership is the load-bearing half of the
          # coupling guard: it MUST land in the SAME PR as the auth
          # materialisation step ("Materialise auth-canonical inputs ..."),
          # else an opted-in adopter with a below-floor pin / tier_deny shadow
          # / old-shape claim would deny-BLOCK instead of warn. Their
          # deny-promotion is gated on D-059 (post-4-week observation) and
          # requires removal from BOTH this set and the scorecard set below.
          WARN_BASELINE_RULES = {"SCP-R-004", "SCP-R-008", "SCP-R-009", "SCP-R-010", "SCP-R-011", "SCP-R-013", "SCP-R-030"}

          payload = json.loads(path.read_text())
          bypass_rule_id = os.environ.get("SCP_BYPASS_RULE_ID", "")
          bypass_approved = os.environ.get("SCP_BYPASS_APPROVED") == "true"
          denies = [item for item in payload if item.get("verdict") == "deny"]
          warn_baseline_findings = [
              item for item in denies
              if item.get("rule_id") in WARN_BASELINE_RULES
          ]
          effective_denies = [
              item for item in denies
              if item.get("rule_id") not in WARN_BASELINE_RULES
              and not (bypass_approved and bypass_rule_id and item.get("rule_id") == bypass_rule_id)
          ]
          annotate = os.environ.get("SCP_ANNOTATE") == "true"

          # Sanitise annotation message text: collapse CR/LF to single spaces
          # so an attacker-controlled `reason` field with embedded newlines
          # cannot inject a synthetic ::error:: / ::warning:: workflow command
          # via the second-line GitHub Actions parses. Closes 020P R1
          # SAFE-MIN-001 (warn-baseline) AND latent same-shape risk on the
          # pre-existing deny-baseline path. Modern runners disable
          # ::set-env / ::add-path so blast-radius is at most cosmetic
          # annotation injection (attacker controls own waivers.json /
          # services.yml content), but the sanitisation is defence-in-depth.
          def _sanitise_annotation_text(text: str) -> str:
              return text.replace("\r\n", " ").replace("\n", " ").replace("\r", " ")

          # Warn-baseline branch: emit ::warning:: annotations for SCP-R-004
          # et al. These findings do NOT trip the threshold check below.
          for finding in warn_baseline_findings:
              structured = {
                  "rule_id": finding.get("rule_id", ""),
                  "file": finding.get("file", finding.get("path", "")),
                  "path": finding.get("path", finding.get("file", "")),
                  "message": finding.get("message", ""),
                  "remediation_url": finding.get("remediation_url", ""),
              }
              print(json.dumps(structured, separators=(",", ":")))
              location = structured["file"] or structured["path"] or "."
              if annotate:
                  suffix = f" - see {structured['remediation_url']}" if structured["remediation_url"] else ""
                  safe_message = _sanitise_annotation_text(structured["message"] + suffix)
                  print(f"::warning file={location},title={structured['rule_id']}::{safe_message}")

          # Deny-baseline branch: existing behaviour (SCP-E003 + per-rule ::error::).
          for finding in effective_denies:
              structured = {
                  "rule_id": finding.get("rule_id", ""),
                  "file": finding.get("file", finding.get("path", "")),
                  "path": finding.get("path", finding.get("file", "")),
                  "message": finding.get("message", ""),
                  "remediation_url": finding.get("remediation_url", ""),
              }
              print(json.dumps(structured, separators=(",", ":")))
              location = structured["file"] or structured["path"] or "."
              print(f"::error file={location},title=SCP-E003::policy deny triggered by {structured['rule_id']}")
              if annotate:
                  suffix = f" - see {structured['remediation_url']}" if structured["remediation_url"] else ""
                  safe_message = _sanitise_annotation_text(structured["message"] + suffix)
                  print(f"::error file={location},title={structured['rule_id']}::{safe_message}")

          if effective_denies and os.environ.get("SCP_THRESHOLD") == "deny":
              sys.exit(1)
          PY

