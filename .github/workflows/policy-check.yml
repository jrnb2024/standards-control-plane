name: policy-check

"on":
  workflow_call:
    inputs:
      rule-set:
        description: Rule bundle selector for the reusable policy check.
        required: false
        type: string
        default: starter
      threshold:
        description: Threshold that converts policy findings into a failing result.
        required: false
        type: string
        default: deny
      annotate:
        description: Emit workflow-command annotations for deny findings.
        required: false
        type: boolean
        default: true
      scp_bypass:
        description: Enable the break-glass pairing and waiver gates.
        required: false
        type: boolean
        default: false
      waivers-path:
        description: Caller-side waiver document path.
        required: false
        type: string
        default: output/findings/waivers.json
      rule-config-path:
        description: Caller-side rule configuration path.
        required: false
        type: string
        default: .scp/rule-config.yaml
      fixture-path:
        description: Restrict changed-file discovery to a fixture subtree when the selftest harness invokes the workflow.
        required: false
        type: string
        default: .

permissions:
  contents: read
  statuses: write

jobs:
  policy-check:
    # GitHub records reusable-workflow checks as "{calling-job-name} / scp/policy-check".
    # 020D1/020D2 must verify the combined context before configuring branch protection.
    name: scp/policy-check
    runs-on: ubuntu-24.04
    env:
      SCP_ANNOTATE: ${{ inputs.annotate }}
      SCP_BASE_REF: ${{ github.event.pull_request.base.ref }}
      SCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SCP_BYPASS: ${{ inputs.scp_bypass }}
      SCP_BYPASS_APPROVED: "false"
      SCP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SCP_FIXTURE_PATH: ${{ inputs.fixture-path }}
      SCP_PR_SHA: ${{ github.sha }}
      SCP_RULE_CONFIG_PATH: ${{ inputs.rule-config-path }}
      SCP_RULE_SET: ${{ inputs.rule-set }}
      SCP_SUMMARY_PATH: policy-check-summary.json
      SCP_THRESHOLD: ${{ inputs.threshold }}
      SCP_RUNTIME_ROOT: .scp-runtime
      SCP_WAIVERS_PATH: ${{ inputs.waivers-path }}
      SCP_WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout SCP runtime repository
        # When invoked cross-repo (the standard adopter path), this step
        # checks out the pinned SCP runtime into .scp-runtime so the
        # install + lib-source steps can read scripts/.tool-versions,
        # scripts/scp-policy-check.lock, lib/policy_check_invocation.sh,
        # and policies/. When invoked LOCALLY (`uses: ./...` from the
        # same repo, e.g. workflow-selftest), github.action_ref is
        # empty and the populate step below symlinks the caller
        # working directory in place of the empty .scp-runtime.
        if: github.action_ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.action_repository }}
          ref: ${{ github.action_ref }}
          path: .scp-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Populate .scp-runtime (self-call fallback)
        # Closes the WP-SCP-022 020C.1 selftest gap. The cross-repo
        # checkout step above always partially runs (creates .scp-runtime
        # with an empty git init even when github.action_repository is
        # the calling repo or the ref is local-form). We therefore
        # detect "did the runtime content actually land?" by checking
        # for scripts/.tool-versions — the canonical sentinel — rather
        # than directory existence. If the sentinel is missing, replace
        # .scp-runtime with a symlink to the caller working directory
        # so the install + lib + policies steps resolve identically to
        # the cross-repo adopter path.
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .scp-runtime/scripts/.tool-versions ]; then
            echo "::debug::.scp-runtime populated by cross-repo checkout"
            exit 0
          fi
          rm -rf .scp-runtime
          ln -s "$(pwd)" .scp-runtime
          ls -la .scp-runtime/scripts/.tool-versions .scp-runtime/scripts/scp-policy-check.lock .scp-runtime/lib/policy_check_invocation.sh .scp-runtime/policies >/dev/null
          echo "::debug::.scp-runtime symlinked to caller working directory (self-call path)"

      - name: Freshness warning (wrapper pin vs SCP main HEAD)
        # WP-SCP-022 020H.1 sub-criterion (closes ADOPT-001 §12.7.11
        # forward-looking flag): annotate ::warning:: when the wrapper's
        # SHA pin is more than `freshness_warning_threshold_minor`
        # minor versions behind SCP main HEAD's published version.
        # Best-effort — never fails the workflow. Adopters who pinned
        # at a pre-020H.1 SHA (no version-manifest.json shipped) get a
        # silent skip; adopters who pinned at 020H.1+ get the warning
        # if they fall behind.
        shell: bash
        run: |
          set -uo pipefail  # NOT errexit — best-effort, must not fail the gate.

          pinned="${SCP_RUNTIME_ROOT}/version-manifest.json"
          if [ ! -f "${pinned}" ]; then
            echo "::debug::freshness-warning: wrapper pin predates 020H.1 (no version-manifest.json under .scp-runtime); skipping check"
            exit 0
          fi

          pinned_minor="$(python3 -c '
          import json, sys
          try:
              with open(sys.argv[1]) as f:
                  print(json.load(f).get("minor", ""))
          except Exception:
              pass
          ' "${pinned}")"

          if [ -z "${pinned_minor}" ]; then
            echo "::debug::freshness-warning: pinned manifest has no minor field; skipping"
            exit 0
          fi

          # Fetch SCP main HEAD's manifest. Public raw URL; --max-time
          # caps the network step so a flaky connection cannot stretch
          # CI wall-clock. --fail prevents an HTML 404 page from being
          # parsed as JSON.
          main_manifest_url="https://raw.githubusercontent.com/jrnb2024/standards-control-plane-/main/version-manifest.json"
          main_manifest="$(curl --fail --silent --show-error --location --max-time 10 "${main_manifest_url}")" || {
            echo "::debug::freshness-warning: could not fetch ${main_manifest_url} (network error or 404); skipping"
            exit 0
          }

          parsed="$(printf '%s' "${main_manifest}" | python3 -c '
          import json, sys
          try:
              p = json.load(sys.stdin)
              print(p.get("minor", ""))
              print(p.get("freshness_warning_threshold_minor", 2))
          except Exception:
              print("")
              print("2")
          ')"
          main_minor="$(printf '%s' "${parsed}" | sed -n '1p')"
          threshold="$(printf '%s' "${parsed}" | sed -n '2p')"

          if [ -z "${main_minor}" ]; then
            echo "::debug::freshness-warning: main manifest has no minor field; skipping"
            exit 0
          fi

          # Parse "X.Y" minor strings as floats for comparison; falls
          # back to string-equal if parse fails.
          delta="$(python3 -c '
          import sys
          try:
              pinned = sys.argv[1].split(".")
              main = sys.argv[2].split(".")
              # Compare: same major → diff in minor; diff major → cap at threshold+1 to surface
              if pinned[0] != main[0]:
                  print(int(sys.argv[3]) + 1)
              else:
                  print(int(main[1]) - int(pinned[1]))
          except Exception:
              print(0)
          ' "${pinned_minor}" "${main_minor}" "${threshold}")"

          if [ "${delta}" -gt "${threshold}" ]; then
            echo "::warning file=.github/workflows/policy-check.yml,title=SCP-FRESH-001::SCP federation primitive pin (${pinned_minor}.x) is more than ${threshold} minor versions behind main HEAD (${main_minor}.x). See ADOPT-001 §12.7.11 for the freshness-warning contract; bump your wrapper SHA via Renovate or manually."
          else
            echo "::debug::freshness-warning: pin ${pinned_minor}.x is within ${threshold} minor versions of main HEAD ${main_minor}.x"
          fi

      - name: Install pinned OPA and Conftest runtimes
        shell: bash
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local file="$2"
            local message="$3"
            echo "::error file=${file},title=${code}::${message}"
          }

          emit_infra_failure() {
            emit_error "SCP-E001" ".github/workflows/policy-check.yml" "$1"
            exit 1
          }

          read_tool_version() {
            local tool="$1"
            awk -v tool="${tool}" '
              $1 == tool {
                print $2
                found = 1
                exit
              }
              END {
                if (!found) {
                  exit 1
                }
              }
            ' "${SCP_RUNTIME_ROOT}/scripts/.tool-versions"
          }

          read_lockfile_field() {
            local tool="$1"
            local platform_key="$2"
            local field="$3"

            python3 - "$tool" "$platform_key" "$field" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          lockfile = Path(os.environ["SCP_RUNTIME_ROOT"]) / "scripts" / "scp-policy-check.lock"
          tool = sys.argv[1]
          platform_key = sys.argv[2]
          field = sys.argv[3]

          try:
              payload = json.loads(lockfile.read_text())
              print(payload[tool][platform_key][field])
          except KeyError as exc:
              raise SystemExit(f"missing lockfile field: {exc}")
          except TypeError as exc:
              raise SystemExit(f"malformed lockfile structure (expected nested dict for {tool}.{platform_key}.{field}): {exc}")
          PY
          }

          OPA_VERSION="$(read_tool_version opa)" || emit_infra_failure "missing OPA version pin in scripts/.tool-versions"
          CONFTST_VERSION="$(read_tool_version conftest)" || emit_infra_failure "missing Conftest version pin in scripts/.tool-versions"
          REGAL_VERSION="$(read_tool_version regal)" || emit_infra_failure "missing Regal version pin in scripts/.tool-versions"
          OPA_REPO="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"
          CONFTST_REPO="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTST_VERSION}"
          REGAL_REPO="https://github.com/open-policy-agent/regal/releases/download/v${REGAL_VERSION}"
          BIN_DIR="${RUNNER_TEMP}/scp-policy/bin"
          mkdir -p "${BIN_DIR}"

          case "$(uname -m)" in
            x86_64|amd64)
              PLATFORM_KEY="linux-x64"
              OPA_ASSET="opa_linux_amd64"
              CONFTST_ARCHIVE="conftest_${CONFTST_VERSION}_Linux_x86_64.tar.gz"
              REGAL_ASSET="regal_Linux_x86_64"
              ;;
            aarch64|arm64)
              PLATFORM_KEY="linux-arm64"
              OPA_ASSET="opa_linux_arm64"
              CONFTST_ARCHIVE="conftest_${CONFTST_VERSION}_Linux_arm64.tar.gz"
              REGAL_ASSET="regal_Linux_arm64"
              ;;
            *)
              emit_infra_failure "unsupported runner architecture: $(uname -m)"
              ;;
          esac

          OPA_SHA256="$(read_lockfile_field opa "${PLATFORM_KEY}" sha256)" || emit_infra_failure "missing OPA SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
          CONFTST_BINARY_SHA256="$(read_lockfile_field conftest "${PLATFORM_KEY}" sha256)" || emit_infra_failure "missing Conftest binary SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
          CONFTST_ARCHIVE_SHA256="$(read_lockfile_field conftest "${PLATFORM_KEY}" archive_sha256)" || emit_infra_failure "missing Conftest archive SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
          REGAL_SHA256="$(read_lockfile_field regal "${PLATFORM_KEY}" sha256)" || emit_infra_failure "missing Regal SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"

          verify_sha256() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(sha256sum "${path}" | awk '{print $1}')"
            [ "${actual}" = "${expected}" ]
          }

          resolve_opa() {
            local downloaded="${RUNNER_TEMP}/${OPA_ASSET}"
            local vendored="${SCP_RUNTIME_ROOT}/vendor/opa/${OPA_ASSET}"
            if curl --fail --silent --show-error --location "${OPA_REPO}/${OPA_ASSET}" --output "${downloaded}" && verify_sha256 "${downloaded}" "${OPA_SHA256}"; then
              printf '%s\n' "${downloaded}"
              return 0
            fi
            if [ -f "${vendored}" ] && verify_sha256 "${vendored}" "${OPA_SHA256}"; then
              printf '%s\n' "${vendored}"
              return 0
            fi
            return 1
          }

          resolve_conftest() {
            local downloaded="${RUNNER_TEMP}/${CONFTST_ARCHIVE}"
            local vendored_archive="${SCP_RUNTIME_ROOT}/vendor/conftest/${CONFTST_ARCHIVE}"
            if curl --fail --silent --show-error --location "${CONFTST_REPO}/${CONFTST_ARCHIVE}" --output "${downloaded}" && verify_sha256 "${downloaded}" "${CONFTST_ARCHIVE_SHA256}"; then
              printf '%s\n' "${downloaded}"
              return 0
            fi
            if [ -f "${vendored_archive}" ] && verify_sha256 "${vendored_archive}" "${CONFTST_ARCHIVE_SHA256}"; then
              printf '%s\n' "${vendored_archive}"
              return 0
            fi
            return 1
          }

          # Defensive: if a future Regal release moves to tarball shipping
          # the lockfile + this resolver need to grow archive_sha256 + a
          # .gz-extraction branch (matching resolve_conftest). Until then,
          # emit a clear infra-failure if the downloaded asset is gzip-
          # shaped rather than letting the smoke test fail with an opaque
          # 'binary format' error. Closes 020H.2 R1 SAFE-003.
          #
          # Uses Python instead of xxd to avoid the silent-degradation
          # surface where xxd absence on a self-hosted runner would let
          # `magic=""` pass the `[ "${magic}" = "1f8b" ]` check (closes
          # 020H.2 R2 SAFE-003 + COR-R2-nit-002). Python 3 is already a
          # required runner dependency for the rule-config wrapping +
          # JSON helpers above, so no new dependency.
          assert_bare_binary_shape() {
            local path="$1"
            local magic
            magic="$(python3 -c 'import sys; print(open(sys.argv[1], "rb").read(2).hex())' "${path}")" || emit_infra_failure "unable to read first 2 bytes of Regal asset ${path}"
            if [ "${magic}" = "1f8b" ]; then
              emit_infra_failure "Regal asset ${path} appears to be a gzip archive; lockfile and resolve_regal() need archive_sha256 + tarball-extraction branch (matching resolve_conftest). Coordinate with @jrnb2024 before bumping REGAL_VERSION."
            fi
          }

          resolve_regal() {
            local downloaded="${RUNNER_TEMP}/${REGAL_ASSET}"
            local vendored="${SCP_RUNTIME_ROOT}/vendor/regal/${REGAL_ASSET}"
            if curl --fail --silent --show-error --location "${REGAL_REPO}/${REGAL_ASSET}" --output "${downloaded}" && verify_sha256 "${downloaded}" "${REGAL_SHA256}"; then
              assert_bare_binary_shape "${downloaded}"
              printf '%s\n' "${downloaded}"
              return 0
            fi
            if [ -f "${vendored}" ] && verify_sha256 "${vendored}" "${REGAL_SHA256}"; then
              assert_bare_binary_shape "${vendored}"
              printf '%s\n' "${vendored}"
              return 0
            fi
            return 1
          }

          OPA_SOURCE="$(resolve_opa)" || emit_infra_failure "unable to resolve OPA v${OPA_VERSION} from release download or vendor/opa fallback"
          cp "${OPA_SOURCE}" "${BIN_DIR}/opa"
          chmod +x "${BIN_DIR}/opa"

          # SHA256 verification (above) is the primary hard-fail control;
          # Sigstore attestation is best-effort soft-warn. OPA v1.x has
          # not yet published Sigstore attestations to GitHub's
          # attestation database (HTTP 404 on lookup), so hard-failing
          # here would block all CI on every adopter forever — even
          # though the binary is genuinely SHA256-verified. Re-tighten
          # to hard-fail when upstream publishes attestations OR when
          # we bump to a version that already does. Closes WP-SCP-022
          # R2 follow-up of MAJ-004 mitigation.
          if gh attestation verify "${BIN_DIR}/opa" --repo open-policy-agent/opa 2>&1; then
            echo "OPA Sigstore attestation verified for v${OPA_VERSION}"
          else
            echo "::warning file=.github/workflows/policy-check.yml,title=SCP-E001-soft::OPA Sigstore attestation not available for v${OPA_VERSION}; SHA256 verification (primary) is the security floor until upstream publishes attestations"
          fi

          CONFTST_SOURCE="$(resolve_conftest)" || emit_infra_failure "unable to resolve Conftest v${CONFTST_VERSION} from release download or vendor/conftest fallback"
          if [ "${CONFTST_SOURCE##*.}" = "gz" ]; then
            tar -xzf "${CONFTST_SOURCE}" -C "${BIN_DIR}" conftest
          else
            cp "${CONFTST_SOURCE}" "${BIN_DIR}/conftest"
          fi
          chmod +x "${BIN_DIR}/conftest"

          verify_sha256 "${BIN_DIR}/conftest" "${CONFTST_BINARY_SHA256}" || emit_infra_failure "Conftest binary verification failed for v${CONFTST_VERSION} after extraction"
          # Conftest does not publish Sigstore attestations; SHA256-verified tarballs are the security floor for conftest.
          # OPA v1.15.2 likewise does not publish Sigstore attestations (HTTP 404 from
          # api.github.com/repos/open-policy-agent/opa/attestations/sha256:<digest>); the OPA gh attestation
          # verify call above is therefore soft-warn, with SHA256 + lockfile-pin as the primary security floor.

          REGAL_SOURCE="$(resolve_regal)" || emit_infra_failure "unable to resolve Regal v${REGAL_VERSION} from release download or vendor/regal fallback (SHA256 verification required)"
          cp "${REGAL_SOURCE}" "${BIN_DIR}/regal"
          chmod +x "${BIN_DIR}/regal"
          # SHA256 verification was performed inside resolve_regal against
          # the lockfile pin (no second verify on BIN_DIR/regal — same
          # design as resolve_opa). The runtime smoke test below is
          # defense-in-depth against an SHA-passing-but-corrupt binary
          # (cross-architecture, glibc mismatch, FS-level bit flip after
          # download). Stderr flows to the runner log on failure for
          # diagnostic fidelity (closes 020H.2 R1 COR-nit-002).
          # emit_infra_failure on either failure mode keeps the gate
          # fail-closed (TF-020H3-001 closure, WP-SCP-022 020H.2).
          "${BIN_DIR}/regal" version >/dev/null || emit_infra_failure "Regal runtime failed its post-download smoke test"

          printf '%s\n' "${BIN_DIR}" >> "${GITHUB_PATH}"
          printf 'SCP_POLICY_CHECK_POLICY_ROOT=%s/policies\n' "${SCP_RUNTIME_ROOT}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_OPA_BIN=%s/opa\n' "${BIN_DIR}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_OPA_SHA256=%s\n' "${OPA_SHA256}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_CONFTEST_BIN=%s/conftest\n' "${BIN_DIR}" >> "${GITHUB_ENV}"
          printf 'SCP_POLICY_CHECK_CONFTEST_SHA256=%s\n' "${CONFTST_BINARY_SHA256}" >> "${GITHUB_ENV}"

      - name: Collect changed files
        id: collect-changed-files
        shell: bash
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local file="$2"
            local message="$3"
            echo "::error file=${file},title=${code}::${message}"
          }

          emit_infra_failure() {
            emit_error "SCP-E001" ".github/workflows/policy-check.yml" "$1"
            exit 1
          }

          if [ -z "${SCP_BASE_SHA}" ] || [ -z "${SCP_HEAD_SHA}" ]; then
            emit_infra_failure "pull_request base/head SHAs are required for changed-files mode"
          fi

          if ! python3 - <<'PY'
          import os
          import sys

          value = os.environ.get("SCP_FIXTURE_PATH", "")
          sys.exit(0 if value and all(ch not in value for ch in ("\n", "\r", "\x00")) else 1)
          PY
          then
            emit_infra_failure "fixture-path must be non-empty and free of control characters"
          fi

          if [ "${SCP_FIXTURE_PATH}" != "." ] && [ ! -e "${SCP_FIXTURE_PATH}" ]; then
            emit_infra_failure "fixture-path '${SCP_FIXTURE_PATH}' does not exist in the checked-out repository"
          fi

          # Output: changed-files.txt.
          #
          # Selftest invocations (`SCP_FIXTURE_PATH != "."`) ALWAYS
          # enumerate the fixture tree — they exist to evaluate the
          # workflow against a known fixture state, not against a PR
          # diff. The previous logic only enumerated when the diff was
          # empty, which meant a PR that modified
          # `tests/workflow/<harness>/expected-annotations.json` (the
          # oracle ratchet) would scope conftest's input to the oracle
          # and skip the fixture's services.yml — the actual subject
          # under test.
          #
          # Adopter invocations (`SCP_FIXTURE_PATH == "."`, the default)
          # continue to scope to the PR diff, which is the federation
          # primitive's contract.
          if [ "${SCP_FIXTURE_PATH}" != "." ]; then
            if [ -f "${SCP_FIXTURE_PATH}" ]; then
              printf '%s\n' "${SCP_FIXTURE_PATH}" > changed-files.txt
            else
              find "${SCP_FIXTURE_PATH}" -type f | LC_ALL=C sort > changed-files.txt || emit_infra_failure "unable to enumerate fixture files under ${SCP_FIXTURE_PATH}"
            fi
          else
            git diff --name-only "${SCP_BASE_SHA}..${SCP_HEAD_SHA}" -- "${SCP_FIXTURE_PATH}" > changed-files.txt || emit_infra_failure "git diff failed for ${SCP_BASE_SHA}..${SCP_HEAD_SHA} within ${SCP_FIXTURE_PATH}"
          fi

          printf 'changed_files=changed-files.txt\n' >> "${GITHUB_OUTPUT}"

      - name: Prepare manifest evaluation targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          changed_files_path = Path("changed-files.txt")
          transformed_root = Path(os.environ["RUNNER_TEMP"]) / "scp-policy-manifest-surrogates"
          transformed_root.mkdir(parents=True, exist_ok=True)

          manifest_names = {"package.json", "pyproject.toml", "go.mod"}
          rewritten: list[str] = []
          manifest_count = 0

          for index, raw_line in enumerate(changed_files_path.read_text().splitlines()):
              path = raw_line.strip()
              if not path:
                  continue

              name = Path(path).name
              if name not in manifest_names:
                  rewritten.append(path)
                  continue

              manifest_count += 1
              source = Path(path)
              if not source.is_file():
                  print(f"::error file={path},title=SCP-E002::manifest file is missing from the checkout and cannot be evaluated")
                  sys.exit(1)

              content = source.read_text(encoding="utf-8")
              surrogate = transformed_root / f"{index:04d}-{name}.yaml"
              yaml_payload = [
                  f"source_file: {json.dumps(path)}",
                  "content: |-",
              ]
              for line in content.splitlines():
                  yaml_payload.append(f"  {line}")
              if content.endswith("\n"):
                  yaml_payload.append("  ")
              surrogate.write_text("\n".join(yaml_payload) + "\n", encoding="utf-8")
              rewritten.append(str(surrogate))

          changed_files_path.write_text("".join(f"{entry}\n" for entry in rewritten), encoding="utf-8")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SCP_R003_MANIFEST_APPLICABLE={'true' if manifest_count else 'false'}\n")
          PY

      - name: Lint policies with Regal
        shell: bash
        run: |
          set -euo pipefail
          if find "${SCP_RUNTIME_ROOT}/policies" -type f -name '*.rego' -print -quit | grep -q .; then
            # Rule disable list — see policies/README.md for rationale.
            # opa-fmt is enforced by the separate "Check policy
            # formatting with OPA" step using `opa fmt --fail`, which
            # is the authoritative formatting gate.
            regal lint \
              --disable directory-package-mismatch \
              --disable no-defined-entrypoint \
              --disable with-outside-test-context \
              --disable unconditional-assignment \
              --disable line-length \
              --disable superfluous-object-get \
              --disable non-loop-expression \
              --disable external-reference \
              --disable unresolved-reference \
              --disable defer-assignment \
              --disable opa-fmt \
              --disable messy-rule \
              "${SCP_RUNTIME_ROOT}/policies"
          fi

      - name: Check policy formatting with OPA
        shell: bash
        run: |
          set -euo pipefail
          if find "${SCP_RUNTIME_ROOT}/policies" -type f -name '*.rego' -print -quit | grep -q .; then
            while IFS= read -r -d '' rego_file; do
              opa fmt --fail "${rego_file}"
            done < <(find "${SCP_RUNTIME_ROOT}/policies" -type f -name '*.rego' -print0)
          fi

      - name: Enforce per-rule OPA coverage
        shell: bash
        run: |
          set -euo pipefail
          policy_root="${SCP_RUNTIME_ROOT}/policies"
          test_root="${policy_root}/tests"
          common_file="${policy_root}/scp_common.rego"

          if ! find "${policy_root}" -maxdepth 1 -type f -name 'SCP-R-*.rego' -print -quit | grep -q .; then
            exit 0
          fi

          if [ ! -f "${common_file}" ]; then
            echo "::error file=${policy_root},title=SCP-E001::missing scp_common.rego — required by every SCP-R-NNN rule"
            exit 1
          fi

          for rule_file in "${policy_root}"/SCP-R-*.rego; do
            [ -e "${rule_file}" ] || continue

            rule_base="$(basename "${rule_file}" .rego)"
            test_file="${test_root}/$(printf '%s' "${rule_base}" | tr '[:upper:]-' '[:lower:]_')_test.rego"

            if [ ! -f "${test_file}" ]; then
              echo "::error file=${test_root},title=SCP-E001::missing OPA test file for ${rule_base}"
              exit 1
            fi

            # WP-SCP-022 slice 020C.1: load scp_common.rego alongside each
            # SCP-R-NNN rule so the waiver-aware + rule-config-aware
            # helpers resolve. Coverage threshold applies across all
            # loaded files; the per-rule test sets each exercise the
            # common helpers via their own waiver/rule-config tests.
            opa test \
              "${rule_file}" \
              "${common_file}" \
              "${test_file}" \
              --coverage \
              --threshold 90 \
              --fail-on-empty \
              -v
          done

      - name: Ensure caller-data dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -m pip install --user pyyaml==6.0.2 >/dev/null 2>&1 || {
              echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::unable to install pyyaml for rule-config wrapping"
              exit 1
            }
          fi
          if ! python3 -c 'import jsonschema' >/dev/null 2>&1; then
            python3 -m pip install --user jsonschema==4.23.0 >/dev/null 2>&1 || {
              echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::unable to install jsonschema for rule-config validation"
              exit 1
            }
          fi

      - name: Validate rule-config against schema
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${SCP_RULE_CONFIG_PATH}" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import jsonschema
          import yaml

          rule_config_path = Path(os.environ["SCP_RULE_CONFIG_PATH"])
          schema_path = Path(os.environ["SCP_RUNTIME_ROOT"]) / "schemas/rule-config.schema.json"

          if not schema_path.is_file():
              print(f"::error file={schema_path},title=SCP-E001::rule-config.schema.json missing from SCP runtime checkout")
              sys.exit(1)

          try:
              content = yaml.safe_load(rule_config_path.read_text()) or {}
              schema = json.loads(schema_path.read_text())
              validator = jsonschema.Draft202012Validator(
                  schema,
                  format_checker=jsonschema.FormatChecker(),
              )
              validator.validate(content)
          except Exception as exc:  # pragma: no cover - workflow runtime guard
              print(f"::error file={rule_config_path},title=SCP-E007::rule-config schema validation failed: {exc}")
              sys.exit(1)
          PY

      - name: Run shared policy-check invocation
        shell: bash
        run: |
          set -euo pipefail
          source "${SCP_RUNTIME_ROOT}/lib/policy_check_invocation.sh"
          scp_policy_check_run

      - name: Emit SCP-R-003 no-manifest observability record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ.get("SCP_R003_MANIFEST_APPLICABLE", "false") == "true":
              raise SystemExit(0)

          path = Path("output/findings/disabled-rules.json")
          payload = json.loads(path.read_text()) if path.exists() else []
          payload.append(
              {
                  "rule_id": "SCP-R-003",
                  "reason": "no-manifest-applicable",
                  "expires_at": "2099-12-31",
              }
          )
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Enforce break-glass pairing gates
        id: bypass-gate
        if: inputs.scp_bypass
        shell: bash
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local file="$2"
            local message="$3"
            echo "::error file=${file},title=${code}::${message}"
          }

          if ! python3 -c 'import jsonschema' >/dev/null 2>&1; then
            python3 -m pip install --user jsonschema==4.23.0 >/dev/null 2>&1 || {
              emit_error "SCP-E004" "${SCP_WAIVERS_PATH}" "unable to install jsonschema for waiver validation"
              exit 1
            }
          fi

          BYPASS_RULE_ID="$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/findings/policy-findings.json")
          if not path.exists():
              raise SystemExit(0)
          payload = json.loads(path.read_text())
          for finding in payload:
              if finding.get("verdict") == "deny" and finding.get("rule_id"):
                  print(finding["rule_id"])
                  raise SystemExit(0)
          raise SystemExit(0)
          PY
          )"

          if [ -z "${BYPASS_RULE_ID}" ]; then
            exit 0
          fi

          if ! python3 - "${BYPASS_RULE_ID}" <<'PY'
          import sys

          rule_id = sys.argv[1]
          sys.exit(0 if all(ch not in rule_id for ch in ("\n", "\r", "\x00")) else 1)
          PY
          then
            emit_error "SCP-E004" "${SCP_WAIVERS_PATH}" "bypass rule_id contains a forbidden control character"
            exit 1
          fi

          PAIRING_METADATA="$(SCP_DIFF_BASE="${SCP_BASE_SHA}" SCP_DIFF_HEAD="${SCP_HEAD_SHA}" SCP_WAIVERS_PATH="${SCP_WAIVERS_PATH}" scripts/verify-bypass-pairing.sh "${BYPASS_RULE_ID}")" || {
            emit_error "SCP-E004" "${SCP_WAIVERS_PATH}" "bypass pairing gate failed for rule ${BYPASS_RULE_ID}"
            exit 1
          }

          if [ ! -f "${SCP_WAIVERS_PATH}" ]; then
            emit_error "SCP-E004" "${SCP_WAIVERS_PATH}" "waivers-path must exist when scp_bypass=true"
            exit 1
          fi

          python3 - <<'PY' || exit 1
          import json
          import os
          import sys
          from pathlib import Path

          import jsonschema

          waivers_path = Path(os.environ["SCP_WAIVERS_PATH"])
          schema_path = Path(os.environ["SCP_RUNTIME_ROOT"]) / "schemas/waivers-file.schema.json"

          try:
              if not schema_path.is_file():
                  raise FileNotFoundError(schema_path)
              waivers = json.loads(waivers_path.read_text())
              schema = json.loads(schema_path.read_text())
              validator = jsonschema.Draft202012Validator(
                  schema,
                  format_checker=jsonschema.FormatChecker(),
              )
              validator.validate(waivers)
          except Exception as exc:  # pragma: no cover - workflow runtime guard
              print(f"::error file={waivers_path},title=SCP-E004::waiver schema validation failed: {exc}")
              sys.exit(1)
          PY

          decision_id="$(printf '%s\n' "${PAIRING_METADATA}" | awk -F= '$1 == "decision_id" {print $2}')"
          expires_at="$(printf '%s\n' "${PAIRING_METADATA}" | awk -F= '$1 == "expires_at" {print $2}')"
          waiver_expires_at="$(printf '%s\n' "${PAIRING_METADATA}" | awk -F= '$1 == "waiver_expires_at" {print $2}')"
          emitted_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          append_github_env_multiline() {
            local key="$1"
            local value="$2"
            local delim

            delim="${key}_$(uuidgen | tr -d '-')"
            while printf '%s\n' "${value}" | grep -Fxq "${delim}"; do
              delim="${key}_$(uuidgen | tr -d '-')"
            done

            printf '%s<<%s\n%s\n%s\n' "${key}" "${delim}" "${value}" "${delim}" >> "${GITHUB_ENV}"
          }

          printf 'SCP_BYPASS_APPROVED=true\n' >> "${GITHUB_ENV}"
          append_github_env_multiline "SCP_BYPASS_RULE_ID" "${BYPASS_RULE_ID}"
          append_github_env_multiline "SCP_BYPASS_DECISION_ID" "${decision_id}"
          append_github_env_multiline "SCP_BYPASS_EXPIRES_AT" "${waiver_expires_at}"
          append_github_env_multiline "SCP_BYPASS_EMITTED_AT" "${emitted_at}"
          printf '::error file=%s,title=SCP-E004::break-glass bypass active for %s via %s until %s\n' "${SCP_WAIVERS_PATH}" "${BYPASS_RULE_ID}" "${decision_id:-D-unknown}" "${expires_at}"

      - name: Emit disabled-rule observability records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/findings/disabled-rules.json")
          if not path.exists():
              raise SystemExit(0)

          payload = json.loads(path.read_text())
          config_path = os.environ.get("SCP_RULE_CONFIG_PATH", ".scp/rule-config.yaml")
          for item in payload:
              rule_id = item.get("rule_id", "unknown-rule")
              reason = item.get("reason", "disabled")
              expires_at = item.get("expires_at", "unspecified")
              print(f"::error file={config_path},title=SCP-E006::{rule_id} disabled: {reason}; expires_at={expires_at}")
          PY

      - name: Emit expired-rule-config one-release warning
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${SCP_RULE_CONFIG_PATH}" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          # WP-SCP-022 slice 020C.1 (v): rule-config disable with an
          # expires_at in the past still suppresses (Rego layer continues
          # to honour disable=true) for ONE release as a deprecation
          # ramp, but each PR run emits a workflow-level warning so the
          # caller is reminded to remove or extend the override.
          config_path = Path(os.environ["SCP_RULE_CONFIG_PATH"])
          if not config_path.is_file():
              raise SystemExit(0)

          try:
              content = yaml.safe_load(config_path.read_text()) or {}
          except yaml.YAMLError as exc:
              # Schema-validation step ahead of this would have caught a
              # malformed file; this is a defensive no-op.
              print(f"::warning ::rule-config parse failed: {exc}", file=sys.stderr)
              raise SystemExit(0)

          rules = content.get("rules", {}) if isinstance(content, dict) else {}
          if not isinstance(rules, dict):
              raise SystemExit(0)

          now = datetime.now(timezone.utc)

          for rule_id, cfg in rules.items():
              if not isinstance(cfg, dict):
                  continue
              if not cfg.get("disable"):
                  continue
              raw = cfg.get("expires_at", "")
              if not isinstance(raw, str) or not raw:
                  continue
              try:
                  if "T" in raw:
                      expiry = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  else:
                      expiry = datetime.fromisoformat(f"{raw}T00:00:00+00:00")
              except ValueError:
                  continue
              if expiry.tzinfo is None:
                  expiry = expiry.replace(tzinfo=timezone.utc)
              if expiry >= now:
                  continue
              expired_date = expiry.date().isoformat()
              print(
                  f"::warning file={config_path},title={rule_id}::"
                  f"rule-config disable expired {expired_date}; remove or extend"
              )
          PY

      - name: Render deny annotations and enforce threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path("output/findings/policy-findings.json")
          if not path.exists():
              raise SystemExit(0)

          payload = json.loads(path.read_text())
          bypass_rule_id = os.environ.get("SCP_BYPASS_RULE_ID", "")
          bypass_approved = os.environ.get("SCP_BYPASS_APPROVED") == "true"
          denies = [item for item in payload if item.get("verdict") == "deny"]
          effective_denies = [
              item for item in denies
              if not (bypass_approved and bypass_rule_id and item.get("rule_id") == bypass_rule_id)
          ]
          annotate = os.environ.get("SCP_ANNOTATE") == "true"

          for finding in effective_denies:
              structured = {
                  "rule_id": finding.get("rule_id", ""),
                  "file": finding.get("file", finding.get("path", "")),
                  "path": finding.get("path", finding.get("file", "")),
                  "message": finding.get("message", ""),
                  "remediation_url": finding.get("remediation_url", ""),
              }
              print(json.dumps(structured, separators=(",", ":")))
              location = structured["file"] or structured["path"] or "."
              print(f"::error file={location},title=SCP-E003::policy deny triggered by {structured['rule_id']}")
              if annotate:
                  suffix = f" - see {structured['remediation_url']}" if structured["remediation_url"] else ""
                  print(f"::error file={location},title={structured['rule_id']}::{structured['message']}{suffix}")

          if effective_denies and os.environ.get("SCP_THRESHOLD") == "deny":
              sys.exit(1)
          PY

      - name: Fail on conflict-gate disagreements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("output/findings/conflict-gate.json")
          if not path.exists():
              raise SystemExit(0)

          payload = json.loads(path.read_text())
          disagreements = payload.get("disagreements", [])
          if disagreements:
              for item in disagreements:
                  location = item.get("file", ".")
                  rule_id = item.get("rule_id", "unknown-rule")
                  message = item.get("message", "python/rego disagreement")
                  print(f"::error file={location},title=SCP-E005::{rule_id}: {message}")
              sys.exit(1)
          PY

      - name: Build policy-check summary
        id: build-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def emit_error(message):
              print(f"::error file=.github/workflows/policy-check.yml,title=SCP-E001::{message}")

          def load_json(path_str, fallback):
              path = Path(path_str)
              if not path.exists():
                  return fallback
              return json.loads(path.read_text())

          pr_sha = os.environ.get("SCP_PR_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", pr_sha):
              emit_error("SCP_PR_SHA must be a 40-character lowercase hex commit SHA before writing the summary artifact")
              sys.exit(1)

          base_ref = os.environ.get("SCP_BASE_REF", "")
          if not base_ref:
              emit_error("SCP_BASE_REF must be set before writing the summary artifact")
              sys.exit(1)

          rule_set = os.environ.get("SCP_RULE_SET", "")
          if not rule_set:
              emit_error("SCP_RULE_SET must be set before writing the summary artifact")
              sys.exit(1)

          run_id_raw = os.environ.get("SCP_WORKFLOW_RUN_ID", "0")
          try:
              workflow_run_id = int(run_id_raw)
          except ValueError:
              emit_error("SCP_WORKFLOW_RUN_ID must be an integer before writing the summary artifact")
              sys.exit(1)

          bypass_emitted = os.environ.get("SCP_BYPASS_APPROVED", "false") == "true"

          summary = {
              "schema_version": "1.0.0",
              "pr_sha": pr_sha,
              "base_ref": base_ref,
              "rule_set": rule_set,
              "workflow_run_id": workflow_run_id,
              "findings": load_json("output/findings/policy-findings.json", []),
              "disabled_rules": load_json("output/findings/disabled-rules.json", []),
              "waivers_applied": load_json("output/findings/waivers-applied.json", []),
              "bypass_emitted": bypass_emitted,
              "conflict_gate": load_json("output/findings/conflict-gate.json", {"run": False, "disagreements": []}),
          }

          if bypass_emitted:
              bypass_record = {
                  "rule_id": os.environ.get("SCP_BYPASS_RULE_ID", ""),
                  "decision_id": os.environ.get("SCP_BYPASS_DECISION_ID", ""),
                  "waiver_expires_at": os.environ.get("SCP_BYPASS_EXPIRES_AT", ""),
                  "emitted_at": os.environ.get("SCP_BYPASS_EMITTED_AT", ""),
              }
              missing = [key for key, value in bypass_record.items() if not value]
              if missing:
                  emit_error(f"bypass metadata missing required field(s): {', '.join(missing)}")
                  sys.exit(1)
              summary["bypass_record"] = bypass_record

          Path(os.environ["SCP_SUMMARY_PATH"]).write_text(json.dumps(summary, indent=2) + "\n")
          PY

      # Closes WP-SCP-022 R2 F-R2-COR-001: caller-relative schema lookup
      # broke for external adopters (the workflow's reusable role means
      # `schemas/policy-check-summary.schema.json` is in SCP's repo, not
      # the caller's checkout). Check out SCP at the workflow's pinned
      # SHA into a sub-path so the schema is always available regardless
      # of caller. Caller-tree fallback retained for the SCP self-dogfood
      # case (where the caller IS SCP and the schema is already on disk).
      - name: Check out SCP repo at workflow ref for schema lookup
        id: scp-self-checkout
        if: always()
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jrnb2024/standards-control-plane-
          ref: ${{ github.workflow_sha }}
          path: _scp-workflow
          persist-credentials: false

      - name: Validate policy-check summary schema
        id: validate-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! python3 -c 'import jsonschema' >/dev/null 2>&1; then
            python3 -m pip install --user jsonschema==4.23.0 >/dev/null 2>&1 || {
              echo "::error file=schemas/policy-check-summary.schema.json,title=SCP-E001::unable to install jsonschema for summary validation"
              exit 1
            }
          fi

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          import jsonschema

          summary_path = Path("policy-check-summary.json")

          # Schema lookup: caller-tree first (SCP self-dogfood case where
          # the caller IS SCP), then fall back to the workflow-ref checkout
          # (the standard adopter case). Closes R2 F-R2-COR-001.
          schema_candidates = [
              Path("schemas/policy-check-summary.schema.json"),
              Path("_scp-workflow/schemas/policy-check-summary.schema.json"),
          ]
          schema_path = None
          for candidate in schema_candidates:
              if candidate.exists():
                  schema_path = candidate
                  break
          if schema_path is None:
              print(
                  f"::error file=policy-check-summary.json,title=SCP-E001::"
                  f"could not locate policy-check-summary.schema.json in any "
                  f"expected location: {[str(p) for p in schema_candidates]}"
              )
              sys.exit(1)

          try:
              summary = json.loads(summary_path.read_text())
              schema = json.loads(schema_path.read_text())
              validator = jsonschema.Draft202012Validator(
                  schema,
                  format_checker=jsonschema.FormatChecker(),
              )
              validator.validate(summary)
          except Exception as exc:  # pragma: no cover - workflow runtime guard
              print(f"::error file={summary_path},title=SCP-E001::summary schema validation failed: {exc}")
              sys.exit(1)
          PY

      - name: Upload policy-check summary artifact
        if: always() && steps.validate-summary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-check-summary
          path: policy-check-summary.json
          if-no-files-found: error

      - name: Post policy-check read-back commit status
        # WP-SCP-022 slice 020C.1 (vi): expose enabled/disabled-rule
        # state on a sibling commit status so PR reviewers can see
        # bypass posture without reading the JSON summary.
        if: always() && steps.validate-summary.outcome == 'success' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          DESC="$(python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ.get("SCP_SUMMARY_PATH", "policy-check-summary.json"))
          if not summary_path.is_file():
              print("policy-check summary unavailable")
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text())
          disabled = summary.get("disabled_rules", []) or []
          waivers = summary.get("waivers_applied", []) or []

          # Closes WP-SCP-022 R1 completeness MIN-002:
          # (a) total_rules is derived dynamically from the policy bundle
          #     (count of SCP-R-NNN.rego files) so growing past 3 doesn't
          #     produce wrong "X rules enabled" descriptions;
          # (b) "no-manifest-applicable" entries are observability-only
          #     (the rule is functionally active, just inapplicable to
          #     the changed-file set) and must NOT count as disabled in
          #     the read-back; we partition them into a separate "N/A"
          #     bucket. Adopter rule-config / waiver disables continue
          #     to count toward the disabled total.
          policy_root = Path(os.environ.get("SCP_RUNTIME_ROOT", ".")) / "policies"
          rule_files = sorted(policy_root.glob("SCP-R-*.rego"))
          total_rules = len(rule_files) if rule_files else 0

          adopter_disabled = [
              d for d in disabled
              if d.get("reason") != "no-manifest-applicable"
          ]
          not_applicable = [
              d for d in disabled
              if d.get("reason") == "no-manifest-applicable"
          ]
          adopter_disabled_rule_ids = sorted({
              entry.get("rule_id", "") for entry in adopter_disabled if entry.get("rule_id")
          })
          enabled_count = max(0, total_rules - len(adopter_disabled_rule_ids) - len(not_applicable))

          parts = [
              f"{enabled_count}/{total_rules} rules enabled, "
              f"{len(adopter_disabled_rule_ids)} disabled"
          ]
          if not_applicable:
              parts[0] += f", {len(not_applicable)} not applicable"
          if adopter_disabled:
              entries = ", ".join(
                  f"{d.get('rule_id', 'unknown')} until {d.get('expires_at', 'unspecified')} ({d.get('reason', 'disabled')})"
                  for d in adopter_disabled
              )
              parts.append(entries)
          if waivers:
              parts.append(f"{len(waivers)} waiver(s) applied")
          desc = "; ".join(parts)
          # GitHub commit-status descriptions are truncated at 140 chars.
          if len(desc) > 140:
              desc = desc[:137] + "..."
          print(desc)
          PY
          )"

          if [ -z "${DESC}" ]; then
              exit 0
          fi

          if [ -z "${HEAD_SHA}" ]; then
              echo "::warning ::no PR head SHA available for read-back status"
              exit 0
          fi

          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=scp/policy-check-readback \
            -f description="${DESC}" >/dev/null 2>&1 || {
              echo "::warning ::failed to post scp/policy-check-readback commit status"
            }
