      - name: Build policy-check summary
        id: build-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def emit_error(message):
              print(f"::error file=.github/workflows/policy-check.yml,title=SCP-E001::{message}")

          def load_json(path_str, fallback):
              path = Path(path_str)
              if not path.exists():
                  return fallback
              return json.loads(path.read_text())

          pr_sha = os.environ.get("SCP_PR_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", pr_sha):
              emit_error("SCP_PR_SHA must be a 40-character lowercase hex commit SHA before writing the summary artifact")
              sys.exit(1)

          base_ref = os.environ.get("SCP_BASE_REF", "")
          if not base_ref:
              emit_error("SCP_BASE_REF must be set before writing the summary artifact")
              sys.exit(1)

          rule_set = os.environ.get("SCP_RULE_SET", "")
          if not rule_set:
              emit_error("SCP_RULE_SET must be set before writing the summary artifact")
              sys.exit(1)

          run_id_raw = os.environ.get("SCP_WORKFLOW_RUN_ID", "0")
          try:
              workflow_run_id = int(run_id_raw)
          except ValueError:
              emit_error("SCP_WORKFLOW_RUN_ID must be an integer before writing the summary artifact")
              sys.exit(1)

          bypass_emitted = os.environ.get("SCP_BYPASS_APPROVED", "false") == "true"

          summary = {
              "schema_version": "1.0.0",
              "pr_sha": pr_sha,
              "base_ref": base_ref,
              "rule_set": rule_set,
              "workflow_run_id": workflow_run_id,
              "findings": load_json("output/findings/policy-findings.json", []),
              "disabled_rules": load_json("output/findings/disabled-rules.json", []),
              "waivers_applied": load_json("output/findings/waivers-applied.json", []),
              "bypass_emitted": bypass_emitted,
              "conflict_gate": load_json("output/findings/conflict-gate.json", {"run": False, "disagreements": []}),
          }

          if bypass_emitted:
              bypass_record = {
                  "rule_id": os.environ.get("SCP_BYPASS_RULE_ID", ""),
                  "decision_id": os.environ.get("SCP_BYPASS_DECISION_ID", ""),
                  "waiver_expires_at": os.environ.get("SCP_BYPASS_EXPIRES_AT", ""),
                  "emitted_at": os.environ.get("SCP_BYPASS_EMITTED_AT", ""),
              }
              missing = [key for key, value in bypass_record.items() if not value]
              if missing:
                  emit_error(f"bypass metadata missing required field(s): {', '.join(missing)}")
                  sys.exit(1)
              summary["bypass_record"] = bypass_record

          Path(os.environ["SCP_SUMMARY_PATH"]).write_text(json.dumps(summary, indent=2) + "\n")
          PY

      # Closes WP-SCP-022 R2 F-R2-COR-001: caller-relative schema lookup
      # broke for external adopters (the workflow's reusable role means
      # `schemas/policy-check-summary.schema.json` is in SCP's repo, not
      # the caller's checkout). Check out SCP at the workflow's pinned
      # SHA into a sub-path so the schema is always available regardless
      # of caller. Caller-tree fallback retained for the SCP self-dogfood
      # case (where the caller IS SCP and the schema is already on disk).
      - name: Check out SCP repo at workflow ref for schema lookup
        id: scp-self-checkout
        # WAVE-G AXIS-I FIX (v0.6 — 2026-05-23): same axis-I bug as the
        # .scp-runtime checkout step above. ref: was github.workflow_sha
        # (CALLER's wrapper SHA in cross-repo); now uses inputs.scp-sha
        # (SCP-side SHA the reusable workflow was loaded from).
        # v0.7 (R2 Lens A HIGH-005 + Lens B NEW-001 closure): fallback
        # `|| github.workflow_sha` REMOVED. Original v0.6 retained the
        # fallback for SCP-self / workflow-selftest compatibility but R2
        # surfaced a silent-downgrade attack: cross-repo callers omitting
        # `scp-sha:` would silently fall through to `github.workflow_sha`
        # (CALLER's wrapper SHA), re-introducing axis I in a subtle way.
        # v0.7 fix: pure `inputs.scp-sha`. Workflow-selftest fixture
        # is updated to pass `scp-sha: ${{ github.sha }}` explicitly
        # (SCP-self CI context has github.sha == SCP HEAD, which is the
        # correct SCP-side SHA to checkout). This makes both checkout
        # steps (.scp-runtime + _scp-workflow) symmetric — both use pure
        # `inputs.scp-sha` — eliminating the asymmetry-adopter-confusion
        # risk surfaced by R2 Lens B NEW-001.
        if: always()
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jrnb2024/standards-control-plane
          ref: ${{ inputs.scp-sha }}
          token: ${{ steps.scp-app-token.outputs.token || github.token }}
          path: _scp-workflow
          persist-credentials: false

      - name: Validate policy-check summary schema
        id: validate-summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          # Unconditional hash-pinned install (closes 020M R1 SAFE-MAJ-002 —
          # runner-preinstall bypass). Idempotent if the exact pinned version
          # is already active.
          python3 -m pip install --user --require-hashes -r "${SCP_RUNTIME_ROOT}/requirements/policy-check.txt" >/dev/null 2>&1 || {
            echo "::error file=schemas/policy-check-summary.schema.json,title=SCP-E001::unable to install jsonschema (hash-pinned via requirements/policy-check.txt) for summary validation"
            exit 1
          }
          if ! python3 -c 'import jsonschema; assert jsonschema.__version__ == "4.23.0"' >/dev/null 2>&1; then
            actual="$(python3 -c 'import jsonschema; print(jsonschema.__version__)' 2>/dev/null || echo 'unknown')"
            echo "::error file=schemas/policy-check-summary.schema.json,title=SCP-E001::pinned-version assertion failed: jsonschema=${actual}, expected 4.23.0"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          import jsonschema

          summary_path = Path("policy-check-summary.json")

          # Schema lookup: caller-tree first (SCP self-dogfood case where
          # the caller IS SCP), then fall back to the workflow-ref checkout
          # (the standard adopter case). Closes R2 F-R2-COR-001.
          schema_candidates = [
              Path("schemas/policy-check-summary.schema.json"),
              Path("_scp-workflow/schemas/policy-check-summary.schema.json"),
          ]
          schema_path = None
          for candidate in schema_candidates:
              if candidate.exists():
                  schema_path = candidate
                  break
          if schema_path is None:
              print(
                  f"::error file=policy-check-summary.json,title=SCP-E001::"
                  f"could not locate policy-check-summary.schema.json in any "
                  f"expected location: {[str(p) for p in schema_candidates]}"
              )
              sys.exit(1)

          try:
              summary = json.loads(summary_path.read_text())
              schema = json.loads(schema_path.read_text())
              validator = jsonschema.Draft202012Validator(
                  schema,
                  format_checker=jsonschema.FormatChecker(),
              )
              validator.validate(summary)
          except Exception as exc:  # pragma: no cover - workflow runtime guard
              print(f"::error file={summary_path},title=SCP-E001::summary schema validation failed: {exc}")
              sys.exit(1)
          PY

      - name: Upload policy-check summary artifact
        if: always() && steps.validate-summary.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-check-summary
          path: policy-check-summary.json
          if-no-files-found: error

      # WP-SCP-023 023B: opt-in scorecard-emit step. Gated on
      # `inputs.scorecard-emit == true` (default false). Reads the
      # validated policy-check-summary.json + sibling
      # output/findings/waivers.json + sibling .scp/rule-config.yaml,
      # transforms into the scorecard-emit shape per
      # schemas/scorecard-emit.schema.json, and writes
      # output/scorecards/scorecard-emit.json. NEVER carries waiver
      # content (per WP-SCP-023 plan-doc invariant 2). The artifact is
      # uploaded + attested via actions/attest-build-provenance for
      # aggregator-side OIDC verification (per D-042 reservation).
      - name: Build scorecard emit
        id: build-scorecard-emit
        if: inputs.scorecard-emit && steps.validate-summary.outcome == 'success'
        shell: bash
        env:
          SCP_RULE_CONFIG_PATH: ${{ env.SCP_RULE_CONFIG_PATH }}
          SCP_WAIVERS_PATH: ${{ env.SCP_WAIVERS_PATH }}
          SCP_SCORECARD_EMIT_PATH: output/scorecards/scorecard-emit.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SCP_SCORECARD_EMIT_PATH}")"
          # Hash-pinned jsonschema is already installed by the Validate
          # policy-check summary schema step above; pyyaml is also
          # already installed via requirements/policy-check.txt.
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def emit_error(message):
              print(f"::error file=.github/workflows/policy-check.yml,title=SCP-E001::{message}")

          summary_path = Path("policy-check-summary.json")
          if not summary_path.is_file():
              emit_error("scorecard-emit: policy-check-summary.json missing")
              sys.exit(1)
          summary = json.loads(summary_path.read_text())

          # Read manifest pin from .scp-runtime/version-manifest.json
          # (the manifest at the wrapper's SHA pin per 020H.1
          # freshness-warning convention; lockfile-trust principle).
          scp_runtime_root = os.environ.get("SCP_RUNTIME_ROOT", ".scp-runtime")
          pinned_manifest = Path(scp_runtime_root) / "version-manifest.json"
          if pinned_manifest.is_file():
              try:
                  scp_version = str(json.loads(pinned_manifest.read_text()).get("version", ""))
              except (json.JSONDecodeError, KeyError):
                  scp_version = ""
          else:
              scp_version = ""
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", scp_version):
              emit_error(
                  "scorecard-emit: could not derive scp_version from "
                  f"{pinned_manifest} — required for emit per "
                  "schemas/scorecard-emit.schema.json. Adopters at SCP "
                  "v1.0.x predate WP-SCP-022 020H.1 freshness-warning + "
                  "predate this scorecard-emit; bump wrapper SHA past "
                  "v1.2.0 to opt in."
              )
              sys.exit(1)

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          ref = os.environ.get("GITHUB_REF_NAME", os.environ.get("GITHUB_REF", ""))
          commit = summary.get("pr_sha", "")
          emitted_at = datetime.now(tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          horizon_30d = datetime.now(tz=timezone.utc) + timedelta(days=30)

          findings = summary.get("findings", [])
          waivers_applied = summary.get("waivers_applied", [])
          disabled_rules = summary.get("disabled_rules", [])

          # Warn-baseline rules per `.github/workflows/policy-check.yml`
          # "Render deny annotations and enforce threshold" step (closes
          # 023B R2 R2-COR-MAJ-001). A warn-baseline rule's findings are
          # rendered as warnings, NOT errors, and excluded from the
          # threshold check — so a scorecard verdict of 'deny' must
          # likewise exclude warn-baseline rules' raw deny findings.
          # Mirrors the WARN_BASELINE_RULES set in the workflow's
          # render-deny step. Future warn-baseline rules add to this
          # set (or promote to data-driven manifest per TF-020P-001).
          # WP-SCP-028 Phase 2 adds SCP-R-009/010/011 — kept in lockstep
          # with the render-deny set above (both must change together).
          WARN_BASELINE_RULES = {"SCP-R-004", "SCP-R-008", "SCP-R-009", "SCP-R-010", "SCP-R-011", "SCP-R-013", "SCP-R-030"}

          # Pre-compute set of rule_ids suppressed by an active matching
          # waiver (closes 023B R1 C-COR-MAJ-002: denies must be EFFECTIVE
          # denies, post-suppression — not raw deny findings). The
          # waivers_applied set is the system's authoritative answer to
          # "which rule_ids did a matching waiver suppress this run."
          waived_rule_ids = {
              w.get("rule_id")
              for w in waivers_applied
              if isinstance(w, dict) and w.get("rule_id")
          }

          # Per-rule rule_counts
          rule_counts = {}
          for f in findings:
              rid = f.get("rule_id")
              if not rid or not re.fullmatch(r"SCP-R-[0-9]+", rid):
                  continue
              entry = rule_counts.setdefault(rid, {
                  "raw_findings": 0, "denies": 0, "waived": 0, "rule_config_disabled": False,
              })
              entry["raw_findings"] += 1
              verdict = f.get("verdict", "")
              if (
                  verdict == "deny"
                  and rid not in waived_rule_ids
                  and rid not in WARN_BASELINE_RULES
              ):
                  entry["denies"] += 1
          for w in waivers_applied:
              rid = w.get("rule_id")
              if not rid or not re.fullmatch(r"SCP-R-[0-9]+", rid):
                  continue
              entry = rule_counts.setdefault(rid, {
                  "raw_findings": 0, "denies": 0, "waived": 0, "rule_config_disabled": False,
              })
              entry["waived"] += 1
          for d in disabled_rules:
              # Closes 023B R1 C-COR-MAJ-003: skip workflow-injected
              # observability records (e.g. SCP-R-003 'no-manifest-applicable')
              # — those are NOT .scp/rule-config.yaml disables. The schema
              # description for rule_config_disabled binds it specifically
              # to the rule-config.yaml source.
              if isinstance(d, dict) and d.get("reason") == "no-manifest-applicable":
                  continue
              rid = d.get("rule_id") if isinstance(d, dict) else d
              if not rid or not re.fullmatch(r"SCP-R-[0-9]+", rid):
                  continue
              entry = rule_counts.setdefault(rid, {
                  "raw_findings": 0, "denies": 0, "waived": 0, "rule_config_disabled": False,
              })
              entry["rule_config_disabled"] = True

          # Aggregate verdict — derived from rule_counts post-suppression.
          # Closes 023B R2 R2-COR-MAJ-001: warn-baseline rules (e.g.
          # SCP-R-004 at v1.1.0+) emit raw findings with verdict='deny'
          # but the threshold check excludes them — so the scorecard
          # verdict path prefers 'warn' over 'deny' when ONLY
          # warn-baseline rules have raw_findings.
          if any(v["denies"] > 0 for v in rule_counts.values()):
              verdict = "deny"
          elif any(
              rid in WARN_BASELINE_RULES and v["raw_findings"] > v["waived"] and not v["rule_config_disabled"]
              for rid, v in rule_counts.items()
          ):
              # A warn-baseline rule fired, was not suppressed by waiver
              # or rule-config: aggregate verdict is 'warn'.
              verdict = "warn"
          else:
              verdict = "allow"

          # Waivers aggregate — read sibling waivers.json (NOT content; counts only)
          waivers_path = Path(os.environ.get("SCP_WAIVERS_PATH", "output/findings/waivers.json"))
          waivers_active_count = 0
          waivers_by_rule_id: dict = {}
          waivers_expiring_30d = 0
          if waivers_path.is_file():
              try:
                  wlist = json.loads(waivers_path.read_text())
              except json.JSONDecodeError:
                  wlist = []
              if isinstance(wlist, list):
                  for w in wlist:
                      if not isinstance(w, dict):
                          continue
                      expires_at_str = w.get("expires_at", "")
                      if not isinstance(expires_at_str, str) or not expires_at_str:
                          continue
                      # Mirror scp_common.rego dateish parser (date or datetime).
                      try:
                          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", expires_at_str):
                              exp = datetime(int(expires_at_str[:4]), int(expires_at_str[5:7]), int(expires_at_str[8:10]), tzinfo=timezone.utc)
                          else:
                              exp = datetime.fromisoformat(expires_at_str.replace("Z", "+00:00"))
                              if exp.tzinfo is None:
                                  continue
                      except ValueError:
                          continue
                      if exp <= datetime.now(tz=timezone.utc):
                          continue  # expired
                      waivers_active_count += 1
                      rid = w.get("rule_id", "")
                      if isinstance(rid, str) and re.fullmatch(r"SCP-R-[0-9]+", rid):
                          waivers_by_rule_id[rid] = waivers_by_rule_id.get(rid, 0) + 1
                      if exp <= horizon_30d:
                          waivers_expiring_30d += 1

          # Rule-config aggregate — read sibling .scp/rule-config.yaml
          rc_path = Path(os.environ.get("SCP_RULE_CONFIG_PATH", ".scp/rule-config.yaml"))
          rc_disabled_rules: list = []
          rc_expiring_30d = 0
          if rc_path.is_file():
              try:
                  import yaml
                  rc = yaml.safe_load(rc_path.read_text())
              except (ImportError, Exception):
                  rc = {}
              if isinstance(rc, dict):
                  rules = rc.get("rules", {})
                  if isinstance(rules, dict):
                      for rid, entry in rules.items():
                          if not isinstance(entry, dict):
                              continue
                          if entry.get("disable") is not True:
                              continue
                          if not isinstance(rid, str) or not re.fullmatch(r"SCP-R-[0-9]+", rid):
                              continue
                          rc_disabled_rules.append(rid)
                          expires_at_str = entry.get("expires_at", "")
                          if isinstance(expires_at_str, str) and re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", expires_at_str):
                              try:
                                  exp = datetime(int(expires_at_str[:4]), int(expires_at_str[5:7]), int(expires_at_str[8:10]), tzinfo=timezone.utc)
                              except ValueError:
                                  continue
                              if exp <= horizon_30d:
                                  rc_expiring_30d += 1
          rc_disabled_rules.sort()

          emit = {
              "schema_version": "0.1",
              "emitted_at": emitted_at,
              "scp_version": scp_version,
              "repo": repo,
              "ref": ref,
              "commit": commit,
              "verdict": verdict,
              "rule_counts": rule_counts,
              "waivers_aggregate": {
                  "active_count": waivers_active_count,
                  "by_rule_id": waivers_by_rule_id,
                  "expiring_within_30d": waivers_expiring_30d,
              },
              "rule_config_aggregate": {
                  "disabled_rules": rc_disabled_rules,
                  "expiring_within_30d": rc_expiring_30d,
              },
          }

          out_path = Path(os.environ["SCP_SCORECARD_EMIT_PATH"])
          out_path.write_text(json.dumps(emit, indent=2, sort_keys=True) + "\n")
          print(f"::notice file={out_path}::scorecard-emit written ({verdict}; active_waivers={waivers_active_count}; disabled_rules={len(rc_disabled_rules)})")
          PY

      - name: Validate scorecard emit against schema
        id: validate-scorecard-emit
        if: inputs.scorecard-emit && steps.build-scorecard-emit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          import jsonschema
          schema_paths = [
              Path("schemas/scorecard-emit.schema.json"),
              Path("_scp-workflow/schemas/scorecard-emit.schema.json"),
          ]
          schema_path = next((p for p in schema_paths if p.is_file()), None)
          if schema_path is None:
              print("::error file=schemas/scorecard-emit.schema.json,title=SCP-E001::scorecard-emit.schema.json missing from SCP runtime checkout")
              sys.exit(1)
          emit = json.loads(Path("output/scorecards/scorecard-emit.json").read_text())
          schema = json.loads(schema_path.read_text())
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(emit)
          PY

      - name: Upload scorecard emit artifact
        if: inputs.scorecard-emit && steps.validate-scorecard-emit.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-emit
          path: output/scorecards/scorecard-emit.json
          if-no-files-found: error

      # The OIDC attestation step lives in a separate `attest-scorecard`
      # job (see below) — job-scoped permissions per 023B R1 MAJ-SAFE-001.

      - name: Post policy-check read-back commit status
        # WP-SCP-022 slice 020C.1 (vi): expose enabled/disabled-rule
        # state on a sibling commit status so PR reviewers can see
        # bypass posture without reading the JSON summary.
        if: always() && steps.validate-summary.outcome == 'success' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          DESC="$(python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ.get("SCP_SUMMARY_PATH", "policy-check-summary.json"))
          if not summary_path.is_file():
              print("policy-check summary unavailable")
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text())
          disabled = summary.get("disabled_rules", []) or []
          waivers = summary.get("waivers_applied", []) or []

          # Closes WP-SCP-022 R1 completeness MIN-002:
          # (a) total_rules is derived dynamically from the policy bundle
          #     (count of SCP-R-NNN.rego files) so growing past 3 doesn't
          #     produce wrong "X rules enabled" descriptions;
          # (b) "no-manifest-applicable" entries are observability-only
          #     (the rule is functionally active, just inapplicable to
          #     the changed-file set) and must NOT count as disabled in
          #     the read-back; we partition them into a separate "N/A"
          #     bucket. Adopter rule-config / waiver disables continue
          #     to count toward the disabled total.
          policy_root = Path(os.environ.get("SCP_RUNTIME_ROOT", ".")) / "policies"
          rule_files = sorted(policy_root.glob("SCP-R-*.rego"))
          total_rules = len(rule_files) if rule_files else 0

          adopter_disabled = [
              d for d in disabled
              if d.get("reason") != "no-manifest-applicable"
          ]
          not_applicable = [
              d for d in disabled
              if d.get("reason") == "no-manifest-applicable"
          ]
          adopter_disabled_rule_ids = sorted({
              entry.get("rule_id", "") for entry in adopter_disabled if entry.get("rule_id")
          })
          enabled_count = max(0, total_rules - len(adopter_disabled_rule_ids) - len(not_applicable))

          parts = [
              f"{enabled_count}/{total_rules} rules enabled, "
              f"{len(adopter_disabled_rule_ids)} disabled"
          ]
          if not_applicable:
              parts[0] += f", {len(not_applicable)} not applicable"
          if adopter_disabled:
              entries = ", ".join(
                  f"{d.get('rule_id', 'unknown')} until {d.get('expires_at', 'unspecified')} ({d.get('reason', 'disabled')})"
                  for d in adopter_disabled
              )
              parts.append(entries)
          if waivers:
              parts.append(f"{len(waivers)} waiver(s) applied")
          desc = "; ".join(parts)
          # GitHub commit-status descriptions are truncated at 140 chars.
          if len(desc) > 140:
              desc = desc[:137] + "..."
          print(desc)
          PY
          )"

          if [ -z "${DESC}" ]; then
              exit 0
          fi

          if [ -z "${HEAD_SHA}" ]; then
              echo "::warning ::no PR head SHA available for read-back status"
              exit 0
          fi

          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=scp/policy-check-readback \
            -f description="${DESC}" >/dev/null 2>&1 || {
              echo "::warning ::failed to post scp/policy-check-readback commit status"
            }

  # WP-SCP-023 023B (closes 023B R1 MAJ-SAFE-001): OIDC artifact
  # attestation runs in this separate job with job-level permissions
  # so attestations: write + id-token: write are NEVER granted to
  # opt-out runs. The job is gated on (a) inputs.scorecard-emit being
  # true, AND (b) the policy-check job succeeding (which only happens
  # if the scorecard emit was built + validated). It downloads the
  # scorecard-emit artifact, verifies its presence, and produces the
  # OIDC attestation against the SCP reusable workflow's job_workflow_ref
  # claim — verifiable by the aggregator (slice 023C) via
  # `gh attestation verify --signer-workflow`.
  attest-scorecard:
    name: scp/attest-scorecard
    if: inputs.scorecard-emit
    needs: policy-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download scorecard emit artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorecard-emit
          path: ./scorecard-emit-download
      - name: Verify artifact present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./scorecard-emit-download/scorecard-emit.json ]; then
            echo "::error file=.github/workflows/policy-check.yml,title=SCP-E001::scorecard-emit artifact missing despite policy-check success"
            exit 1
          fi
      - name: Attest scorecard emit (OIDC artifact attestation)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./scorecard-emit-download/scorecard-emit.json
