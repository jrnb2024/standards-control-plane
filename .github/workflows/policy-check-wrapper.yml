# SCP self-dogfood wrapper — calls SCP's own reusable policy-check
# workflow on every PR to main.
#
# WP-SCP-022 slice 020D1 (advisory mode — `scp/policy-check` is NOT
# yet a required status check on this repo). Slice 020D2 flips the
# gate from advisory to required after USER-GATE-A0 signoff.
#
# Pin lifecycle:
# - 020D1 (PR #57, 2026-04-30 morning): @9820489 (the 020K merge SHA).
# - 020D1.1 (this slice, 2026-04-30 evening): @41a5299 — main HEAD
#   post the 020E.c warn-msg fix (PR #68). The bump is necessary
#   because conftest 0.x rejected the warn records in the @9820489
#   rule bundle when the 020E.c canary first exercised waiver
#   suppression. The fix is a forward-compatible additive change
#   (msg field added to existing warn records) so adopters pinned
#   at @9820489 keep working until they choose to upgrade.
#
# The pin must always be a 40-char commit SHA (per WP-SCP-020 020B(v)
# — adopters MUST pin by SHA, never by branch or tag name).
#
# Wrapper conforms to the canonical adopter shape documented in
# WP-SCP-020 020H part 3 (ADOPT-001 §12) and the contract in
# WP-SCP-020 020B (refuses fork PRs; declares `permissions:
# contents: read, statuses: write` per D-029; declares no
# `secrets:`).
#
# References:
#   docs/plans/WP-SCP-020-policy-federation-primitive.md §4 020D1
#   docs/adoption/ADOPT-001-project-onboarding.md §12

name: policy-check

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write  # required for scp/policy-check-readback per D-029 / 020C.1(vi)
  # WP-SCP-023 023E fix-round-3 (TF-023E-001): `scorecard-emit` is NOT set
  # below, so the called `attest-scorecard` job is skipped. We do NOT
  # grant `attestations: write` + `id-token: write` here — least-privilege.
  # If we ever flip this wrapper to `scorecard-emit: true`, both
  # permissions MUST be added (reusable workflows cannot escalate above
  # the caller's ceiling). The flip is blocked on TF-023E-001
  # (`standards-control-plane` is user-owned + private; GitHub blocks
  # `actions/attest-build-provenance` with HTTP error "Feature not
  # available for user-owned private repositories"). See ADOPT-001
  # §12.7.15 step 2 for the canonical opt-in shape adopters use.

jobs:
  policy-check:
    # Refuse fork PRs — same-repo only for v1.0.0 (per WP-SCP-020 020B
    # acceptance: caller wrapper refuses fork PRs).
    if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
    # renovate: datasource=github-tags depName=jrnb2024/standards-control-plane
    # WP-SCP-023 023E fix-round-3: pin REMAINS at v1.0.0 (@41a5299).
    # We attempted to bump to @5ff2acd (post-v1.2.0 / 023D merge) but
    # the bumped called workflow declares an `attest-scorecard` job
    # with `attestations: write` + `id-token: write`. GitHub Actions
    # validates declared permissions on ALL jobs in a called workflow
    # at startup — BEFORE evaluating `if: inputs.scorecard-emit` —
    # against the caller's ceiling. The caller (this wrapper) has only
    # contents:read + statuses:write, so the workflow is rejected with
    # `startup_failure` even when scorecard-emit defaults to false and
    # attest-scorecard would be skipped at runtime.
    #
    # Bump is forward-filed as TF-023E-002. Two options to unblock:
    # (a) restructure policy-check.yml so attest-scorecard lives in a
    # separate top-level workflow (called workflows can't have
    # job-scoped perms above caller ceiling at all), OR (b) make the
    # SCP repo public/org-owned + universally grant attestations: write
    # + id-token: write at the wrapper level. (a) is the cleanest
    # because it preserves least-privilege for opt-out adopters.
    uses: jrnb2024/standards-control-plane/.github/workflows/policy-check.yml@41a529908ef5355b82ca924ef0502fa5ec2fcc11  # tag: v1.0.0 (pre-WP-SCP-023; see TF-023E-002)
