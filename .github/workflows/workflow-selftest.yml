      - fixture-scp-r-013-embedded-policy-check
      - stash-fixture-scp-r-013-embedded-summary
      - fixture-scp-r-013-compliant-policy-check
      - stash-fixture-scp-r-013-compliant-summary
      - fixture-scp-r-013-carveout-policy-check
      - stash-fixture-scp-r-013-carveout-summary
      - fixture-scp-r-013-no-self-assert-policy-check
      - stash-fixture-scp-r-013-no-self-assert-summary
      - fixture-scp-r-031-marker-present-both-policy-check
      - stash-fixture-scp-r-031-marker-present-both-summary
      - fixture-scp-r-031-marker-absent-claude-policy-check
      - stash-fixture-scp-r-031-marker-absent-claude-summary
      - fixture-scp-r-031-marker-absent-agents-policy-check
