                  "downloaded/fixture-scp-r-030-claude-absent/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-claude-absent/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-disabled",
                  "downloaded/fixture-scp-r-030-disabled/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-disabled/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-028-pass",
                  "downloaded/fixture-scp-r-028-pass/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-028-pass/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-028-import-fence",
                  "downloaded/fixture-scp-r-028-import-fence/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-028-import-fence/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-028-trust-boundary",
                  "downloaded/fixture-scp-r-028-trust-boundary/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-028-trust-boundary/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-013-embedded",
                  "downloaded/fixture-scp-r-013-embedded/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-013-embedded/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-013-compliant",
                  "downloaded/fixture-scp-r-013-compliant/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-013-compliant/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-013-carveout",
                  "downloaded/fixture-scp-r-013-carveout/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-013-carveout/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-013-no-self-assert",
                  "downloaded/fixture-scp-r-013-no-self-assert/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-013-no-self-assert/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-031-marker-present-both",
                  "downloaded/fixture-scp-r-031-marker-present-both/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-031-marker-present-both/expected-annotations.json",
              ),
              (
