  fixture-simulate-token-exchange-failure-policy-check:
    name: fixture-simulate-token-exchange-failure-policy-check
    needs: fixture-scp-sha-validation-mismatched-valid-sha-policy-check
    # The prior needs-chain includes jobs that fail BY DESIGN. Without
    # `if: always()`, the harness would cascade to `skipped` and hide
    # the failure-path assertions the orchestrator expects to inspect.
    if: always()
    permissions:
      contents: read
      statuses: write
      # See fixture-pass-policy-check permissions block for why
      # attestations:write + id-token:write are required despite the
      # callee's attest-scorecard job being `if:`-gated off (GHA startup-
      # validation requirement on reusable-workflow callers).
      attestations: write
      id-token: write
    # TF-PIM-001 Wave E / TF-PIM-001-ARCH-002 selftest fixture. Invokes
    # the reusable workflow with simulate-app-token-failure=true, which
    # short-circuits the App token-exchange path: the simulate step emits
    # SCP-E001 and exits 1 BEFORE any real token-exchange API call. This
    # job's result is `failure` BY DESIGN — the orchestrator
    # `workflow-selftest` job asserts result ∈ {failure, cancelled} as
    # the success criterion (cancelled is acceptable under workflow-run
    # cancellation; same shape as the existing `Assert upstream job
    # outcomes are inspectable` step's treatment of fixture-fail-policy-check).
    # needs `fixture-fail-policy-check` for linear harness sequencing
    # (NOT for artifact-name conflict, which does not apply since this
    # job exits at the simulate step before any artifact-write step;
    # sequencing convention preserved for harness consistency).
    # v0.1 ships mock-based coverage; real-API coverage tracked-forward
    # as TF-PIM-001-ARCH-002 follow-up. See `tests/workflow/conftest.md`
    # for the mock-vs-real-API decision rationale.
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-pass
      threshold: deny
      simulate-app-token-failure: true
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  fixture-simulate-post-checkout-failure-policy-check:
    name: fixture-simulate-post-checkout-failure-policy-check
    needs: fixture-simulate-token-exchange-failure-policy-check
    # The prior needs-chain includes jobs that fail BY DESIGN. Without
    # `if: always()`, the harness would cascade to `skipped` and hide the
    # publication-gate assertions the orchestrator expects to inspect.
    if: always()
    permissions:
      contents: read
      statuses: write
      # See fixture-pass-policy-check permissions block for why
      # attestations:write + id-token:write are required despite the
      # callee's attest-scorecard job being `if:`-gated off (GHA startup-
      # validation requirement on reusable-workflow callers).
      attestations: write
      id-token: write
    # Publication-gate fixture. Invokes the reusable workflow with
    # simulate-post-checkout-failure=true: the seam step exits 1 AFTER
    # .scp-runtime is populated and BEFORE "Install pinned OPA and Conftest
    # runtimes" — the window in which an infra failure used to publish a
    # zero-findings summary artifact and read-back. This is the only fixture
    # that fails after the runtime checkout: the three scp-sha-validation
    # failure fixtures and fixture-simulate-token-exchange-failure all die
    # before it, where the summary schema validation cannot succeed anyway.
    # This job's result is `failure` BY DESIGN. The orchestrator
    # `workflow-selftest` job asserts, via the jobs API, that "Validate
    # policy-check summary schema" succeeded while "Upload policy-check
    # summary artifact", "Post policy-check read-back commit status",
    # "Build scorecard emit" and "Upload scorecard emit artifact" were
    # skipped, and that no second `policy-check-summary` artifact exists.
    # Tail of the serial chain on purpose: fixture-fail's artifact still
    # holds the fixed name, so a broken gate cannot pass unnoticed (its
    # upload would conclude `failure` on the name clash, not `skipped`).
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-pass
      threshold: deny
      simulate-post-checkout-failure: true
      # Opt in to the scorecard emit so the third gated publication path
      # ("Build scorecard emit" + "Upload scorecard emit artifact") is
      # observed skipped on the infra path too. attest-scorecard stays
      # skipped: its `if: inputs.scorecard-emit` carries an implicit
      # success() and this job's policy-check fails.
      scorecard-emit: true
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  workflow-selftest:
    name: workflow-selftest
    if: always()
    needs:
      - prepare-manifest-targets-unit
      - policy-check-pin-guards-unit
      - stash-fixture-pass-summary
      - stash-fixture-scp-sha-validation-happy-path-summary
      - stash-fixture-scp-sha-validation-cross-repo-happy-path-summary
      - fixture-scp-r-030-pass-policy-check
