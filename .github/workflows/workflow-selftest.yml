  fixture-fail-policy-check:
    name: fixture-fail-policy-check
    # Terminal producer of the linear fixture chain: it must run AFTER the last
    # green stash so only one policy-check invocation exists at a time (the
    # shared `policy-check-summary` artifact-name invariant). The SCP-R-031
    # chain was spliced between the SCP-R-013 tail and this job (WP-SCP-031), so
    # this re-points from stash-fixture-scp-r-013-no-self-assert-summary to the
    # new tail stash-fixture-scp-r-031-disabled-summary.
    needs: stash-fixture-scp-r-031-disabled-summary
    permissions:
      contents: read
      statuses: write
      # See fixture-pass-policy-check permissions block for why
      # attestations:write + id-token:write are required despite the
      # callee's attest-scorecard job being `if:`-gated off (GHA startup-
      # validation requirement on reusable-workflow callers).
      attestations: write
      id-token: write
    # The fixture-fail harness intentionally invokes the reusable
    # workflow against a services.yml that triggers SCP-R-001's deny.
    # The reusable workflow exits 1 on deny → this job's result is
    # `failure` BY DESIGN. The orchestrator `workflow-selftest` job
    # asserts that result == 'failure' as the success criterion.
    #
    # The inner job's red status surfaces on the PR check list. This
    # is acceptable because:
    # (a) workflow-selftest is documented as a selftest harness, not a
    #     gate.
    # (b) The substantive gate is the orchestrator's `workflow-selftest`
    #     job (different from the workflow file's name); green there
    #     means both fixtures behaved as expected.
    # (c) GitHub Actions does NOT support `continue-on-error: true` on
    #     reusable-workflow `uses:` jobs — adding it produces a
    #     workflow-load failure (no jobs run) — so the inner-job-red
    #     state cannot be suppressed at this layer.
    # (d) 020D1 will configure branch protection to require ONLY the
    #     orchestrator's job, not the harness inner jobs.
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-fail
      threshold: deny
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  fixture-scp-sha-validation-required-input-missing-policy-check:
    name: fixture-scp-sha-validation-required-input-missing-policy-check
    needs: fixture-fail-policy-check
    if: always()
    permissions:
      contents: read
      statuses: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-scp-sha-validation
      threshold: deny
      simulate-cross-repo: true
      scp-sha: ""
      selftest-mode: true

  fixture-scp-sha-validation-wrong-sha-shape-policy-check:
