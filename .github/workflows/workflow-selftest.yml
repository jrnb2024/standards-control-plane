name: workflow-selftest

"on":
  pull_request:
    paths:
      - .github/workflows/policy-check.yml
      # The policy-check workflow sources lib/policy_check_invocation.sh
      # (e.g. scp_policy_check_prepare_manifest_targets), so a lib-only edit
      # to that shared logic must re-run the selftest + its unit job.
      - lib/**
      - policies/**
      - tests/workflow/**
      - schemas/policy-check-summary.schema.json
      # Closes 020M R1 SAFE-MIN-002: hash-pinned Python deps lockfile is
      # load-bearing for the gate workflow. Renovate auto-bump PRs that
      # touch only requirements/policy-check.txt would otherwise miss the
      # selftest harness verification.
      - requirements/**

jobs:
  validate-selftest-config:
    name: validate-selftest-config
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate reusable-workflow pin and fixture-oracle ratchet
        env:
          SCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          # Closes WP-SCP-022 020C.1 follow-up: GitHub Actions does NOT
          # support `@<ref>` on local reusable-workflow `uses:` lines —
          # only cross-repo refs accept @ref. The previous workflow used
          # `uses: ./.github/workflows/policy-check.yml@<sha>` which
          # made every workflow-selftest run fail at parse time on every
          # commit since the file was authored. Local reusable workflows
          # always run at the calling workflow's HEAD SHA, so the pin is
          # effectively the PR HEAD itself; a separate "what changed in
          # this PR" check below replaces the pin-staleness check.
          workflow_text = Path(".github/workflows/workflow-selftest.yml").read_text()
          local_uses_count = len(re.findall(
              r"uses:\s+\./\.github/workflows/policy-check\.yml\s*$",
              workflow_text,
              re.M,
          ))
          if local_uses_count != 25:
              raise SystemExit(
                  "workflow-selftest must invoke policy-check.yml exactly twenty-five times via "
                  "`uses: ./.github/workflows/policy-check.yml` (no @ref): fixture-pass, "
                  "fixture-scp-sha-validation-happy-path, fixture-scp-sha-validation-"
                  "cross-repo-happy-path, fixture-scp-r-030-pass, fixture-scp-r-030-marker-"
                  "absent, fixture-scp-r-030-claude-absent, fixture-scp-r-030-disabled, "
                  "fixture-scp-r-028-pass, fixture-scp-r-028-import-fence, "
                  "fixture-scp-r-028-trust-boundary, fixture-scp-r-013-embedded, "
                  "fixture-scp-r-013-compliant, fixture-scp-r-013-carveout, "
                  "fixture-scp-r-013-no-self-assert, fixture-scp-r-031-marker-present-both, "
                  "fixture-scp-r-031-marker-absent-claude, fixture-scp-r-031-marker-absent-"
                  "agents, fixture-scp-r-031-dynamic-state-present, fixture-scp-r-031-disabled, "
                  "fixture-fail, fixture-scp-sha-validation-required-input-missing, "
                  "fixture-scp-sha-validation-wrong-sha-shape, fixture-scp-sha-validation-"
                  "mismatched-valid-sha, fixture-simulate-token-exchange-failure, and "
                  "fixture-simulate-post-checkout-failure "
                  "(the four fixture-scp-r-030-* invocations were added by the WP-SCP-030 "
                  "companion-workflow activation; the three fixture-scp-r-028-* by the "
                  "WP-SCP-028 Phase 2 auth-canonical companion materialisation; the four "
                  "fixture-scp-r-013-* by the WP-SCP-037 ARCH-006 materialiser activation; "
                  "the five fixture-scp-r-031-* by the WP-SCP-031 estate-context-marker "
                  "companion materialisation; fixture-simulate-post-checkout-failure by "
                  "the policy-check publication gate, the only fixture that fails after "
                  "the runtime checkout)"
              )

          base = os.environ["SCP_BASE_SHA"]
          head = os.environ["SCP_HEAD_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..{head}"],
              text=True,
          ).splitlines()

          # When policy-check.yml changes in this PR, the selftest will
          # naturally exercise the new version (local reusable workflows
          # run at the PR HEAD). No pin-bump is required.

          def exists_at(ref: str, path: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{ref}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          for fixture_root in (
              "tests/workflow/fixture-pass",
              "tests/workflow/fixture-fail",
              "tests/workflow/fixture-scp-sha-validation",
          ):
              services_path = f"{fixture_root}/services.yml"
              expected_path = f"{fixture_root}/expected-annotations.json"
              if (
                  services_path in changed
                  and expected_path in changed
                  and exists_at(base, services_path)
                  and exists_at(base, expected_path)
              ):
                  raise SystemExit(
                      f"{fixture_root} cannot change services.yml and expected-annotations.json in the same PR; add a new fixture pair or stage the oracle update separately."
                  )
          PY

  prepare-manifest-targets-unit:
    name: prepare-manifest-targets-unit
    # Unit-tests the extracted scp_policy_check_prepare_manifest_targets lib
    # function (lib/policy_check_invocation.sh). Proves a manifest DELETED in
    # the PR diff is SKIPPED (no SCP-E002, gate green) while a modified
    # manifest is still evaluated — the v1.5.1 SCP-E002 over-broad fix.
    # Standalone (no `uses: ./.github/workflows/policy-check.yml` invocation),
    # so it does NOT change the validate-selftest-config 12-invocation count.
    # The test is stdlib-only and run via `python` directly (no pip install);
    # conftest-gate.yml runs pytest only over tests/conflict_gate/, so this is
    # the runner for the workflow-target-prep test. The workflow-selftest
    # aggregator both `needs:` this job AND asserts its result == success.
    needs: validate-selftest-config
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Run manifest target-prep unit tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/workflow/test_prepare_manifest_targets.py
          # Same class one layer down: the conftest target loop selected on
          # extension alone, so a deleted .yaml/.json/.toml reached conftest and
          # hard-failed the gate with SCP-E002.
          python tests/workflow/test_conftest_targets_skip_deletions.py

  policy-check-pin-guards-unit:
    name: policy-check-pin-guards-unit
    # Structural guards on the cross-repo `actions/checkout` steps in
    # policy-check.yml that fetch the SCP repo. Proves the federation pin
    # cannot silently stop being a pin: `ref:` is the pin with no `||`
    # fallback (v0.7 R2 Lens A HIGH-005), and no such checkout can run on a
    # pin that failed validation. That matters because actions/checkout
    # RESOLVES a bad ref rather than refusing it — empty and whitespace refs
    # become the workflow's context ref or the repository default branch,
    # and a branch or tag name is checked out as that branch or tag — while
    # the `_scp-workflow` step is `if: always()`. On run 33970219430 it duly
    # checked out a moving ref despite the fail-closed scp-sha validation.
    # The test also replays the mutations an R1 review used to defeat its
    # own first version, so it cannot rot into a check that passes on
    # anything. Standalone (no `uses: ./.github/workflows/policy-check.yml`),
    # so it does NOT change the validate-selftest-config invocation count.
    # The workflow-selftest aggregator both `needs:` this job AND asserts
    # its result == success — loud, but note that workflow-selftest is not a
    # required status check on main, so it does not itself block a merge.
    needs: validate-selftest-config
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Run policy-check pin-guard tests
        shell: bash
        run: |
          set -euo pipefail
          # PyYAML, hash-pinned from the same lockfile policy-check.yml
          # installs. Unlike prepare-manifest-targets-unit this test is not
          # stdlib-only: hand-rolled line parsing was the first version's
          # biggest weakness (blind to flow-style `with:`, folded `if:`
          # scalars, quoted refs and inline comments), and every one of
          # those blind spots was a way to reopen the escape while the
          # test stayed green.
          #
          # --no-deps is load-bearing, not tidiness. On Python 3.12 (this
          # job's pin) `referencing==0.37.0` pulls `typing-extensions>=4.4.0`,
          # which the lockfile does not hash-pin, so plain --require-hashes
          # dies with "all requirements must have their versions pinned with
          # ==" (measured: run 33994889174, and reproduced locally on 3.12 —
          # it passes on 3.13+, where the marker drops that dependency). PR
          # #269 fixes the lockfile; this job must not depend on that landing
          # first, and it needs only PyYAML, which has no dependencies of its
          # own. The version assertion below is what proves the install.
          python -m pip install --user --no-deps --require-hashes -r requirements/policy-check.txt
          python -c 'import yaml; assert yaml.__version__ == "6.0.2", yaml.__version__'
          python tests/workflow/test_policy_check_pin_guards.py

  fixture-pass-policy-check:
    name: fixture-pass-policy-check
    needs: validate-selftest-config
    permissions:
      contents: read
      statuses: write
      # WP-SCP-023 023B (commit 5d4341b) added the `attest-scorecard`
      # job to policy-check.yml with job-level `attestations: write +
      # id-token: write`. GitHub Actions validates reusable-workflow
      # caller permissions at workflow STARTUP, BEFORE `if:` conditions
      # — so even though attest-scorecard is `if: inputs.scorecard-emit`-
      # gated (and this caller leaves scorecard-emit default-false),
      # the caller MUST still grant the permissions the callee declares
      # on every job. Omitting these caused workflow-selftest startup_
      # failure on every run since 2026-05-03 (sample-size 100+ red runs
      # across all branches). Fold-in fix in TF-PIM-001 Wave E (PR #139).
      attestations: write
      id-token: write
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-pass
      threshold: deny
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  stash-fixture-pass-summary:
    name: stash-fixture-pass-summary
    needs: fixture-pass-policy-check
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Download fixture-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-check-summary
          path: artifact-pass

      - name: Re-upload fixture-pass summary under a stable harness name
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-pass-policy-check-summary
          path: artifact-pass/policy-check-summary.json
          if-no-files-found: error

      - name: Delete reusable-workflow artifact so the second invocation can reuse the fixed name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          list_request = urllib.request.Request(
              f"{api_url}/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(list_request) as response:
              payload = json.load(response)

          matches = [
              artifact
              for artifact in payload.get("artifacts", [])
              if artifact.get("name") == "policy-check-summary"
          ]
          if len(matches) != 1:
              print(
                  f"expected exactly one policy-check-summary artifact before the second invocation, found {len(matches)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          artifact_id = matches[0]["id"]
          delete_request = urllib.request.Request(
              f"{api_url}/repos/{repository}/actions/artifacts/{artifact_id}",
              headers=headers,
              method="DELETE",
          )

          try:
              with urllib.request.urlopen(delete_request) as response:
                  if response.status != 204:
                      print(
                          f"unexpected delete status for artifact {artifact_id}: {response.status}",
                          file=sys.stderr,
                      )
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print(f"artifact delete failed: {exc}", file=sys.stderr)
              sys.exit(1)
          PY

  fixture-scp-sha-validation-happy-path-policy-check:
    name: fixture-scp-sha-validation-happy-path-policy-check
    needs: stash-fixture-pass-summary
    permissions:
      contents: read
