      - name: Assert upstream job outcomes are inspectable
        shell: bash
        env:
          FIXTURE_PASS_STASH_RESULT: ${{ needs.stash-fixture-pass-summary.result }}
          SCP_SHA_HAPPY_PATH_STASH_RESULT: ${{ needs.stash-fixture-scp-sha-validation-happy-path-summary.result }}
          SCP_SHA_CROSS_REPO_STASH_RESULT: ${{ needs.stash-fixture-scp-sha-validation-cross-repo-happy-path-summary.result }}
