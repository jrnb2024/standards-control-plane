  # Real cosign + live-surface smoke test (the mock-masking guard). The auth
  # fixtures above use the deterministic simulate seam; this standalone job
  # exercises the PRODUCTION path's trust anchor — it installs cosign, fetches
  # BOTH canonicals + their .sig.bundle from the public estate-canonicals
  # surface, and cosign-verifies them against CT's contract-manifest-publish.yml
  # keyless identity. It asserts ONLY that the live signatures verify (NOT any
  # canonical content), so it is drift-proof against version bumps while
  # catching URL / identity / surface drift that the simulated fixtures cannot.
  # A transient Sigstore/Rekor or network outage makes this job red; it is
  # re-runnable and carries no adopter-gate weight (workflow-selftest is SCP's
  # own selftest, merged operator-attended).
  auth-canonical-cosign-smoke:
    name: auth-canonical-cosign-smoke
    needs: validate-selftest-config
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify both canonicals against CT's keyless identity (live surface)
        shell: bash
        env:
          PUBLIC_BASE: https://raw.githubusercontent.com/jrnb2024/estate-canonicals/main
          CT_IDENTITY: https://github.com/jrnb2024/control-tower/.github/workflows/contract-manifest-publish.yml@refs/heads/main
          CT_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/scp-cosign-smoke"
          mkdir -p "${work}"
          verify_one() {
            local name="$1"
            curl --fail --silent --show-error --location --max-time 30 \
              "${PUBLIC_BASE}/${name}" --output "${work}/${name}"
            curl --fail --silent --show-error --location --max-time 30 \
              "${PUBLIC_BASE}/${name}.sig.bundle" --output "${work}/${name}.sig.bundle"
            cosign verify-blob \
              --certificate-identity "${CT_IDENTITY}" \
              --certificate-oidc-issuer "${CT_ISSUER}" \
              --bundle "${work}/${name}.sig.bundle" \
              "${work}/${name}"
            echo "✓ cosign-verified ${name} against the live public surface"
          }
          verify_one auth-contract-v1.yaml
          verify_one canonical-sdk-versions.yaml

