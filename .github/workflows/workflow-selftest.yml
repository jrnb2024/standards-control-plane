    # asserts that result == 'failure' as the success criterion.
    #
    # The inner job's red status surfaces on the PR check list. This
    # is acceptable because:
    # (a) workflow-selftest is documented as a selftest harness, not a
    #     gate.
    # (b) The substantive gate is the orchestrator's `workflow-selftest`
    #     job (different from the workflow file's name); green there
    #     means both fixtures behaved as expected.
    # (c) GitHub Actions does NOT support `continue-on-error: true` on
    #     reusable-workflow `uses:` jobs — adding it produces a
    #     workflow-load failure (no jobs run) — so the inner-job-red
    #     state cannot be suppressed at this layer.
    # (d) 020D1 will configure branch protection to require ONLY the
    #     orchestrator's job, not the harness inner jobs.
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-fail
      threshold: deny
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  fixture-scp-sha-validation-required-input-missing-policy-check:
    name: fixture-scp-sha-validation-required-input-missing-policy-check
    needs: fixture-fail-policy-check
    if: always()
    permissions:
      contents: read
      statuses: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-scp-sha-validation
      threshold: deny
      simulate-cross-repo: true
      scp-sha: ""
      selftest-mode: true

  fixture-scp-sha-validation-wrong-sha-shape-policy-check:
    name: fixture-scp-sha-validation-wrong-sha-shape-policy-check
    needs: fixture-scp-sha-validation-required-input-missing-policy-check
    if: always()
    permissions:
      contents: read
      statuses: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-scp-sha-validation
      threshold: deny
      simulate-cross-repo: true
      scp-sha: not-a-sha
      selftest-mode: true

  fixture-scp-sha-validation-mismatched-valid-sha-policy-check:
    name: fixture-scp-sha-validation-mismatched-valid-sha-policy-check
    needs: fixture-scp-sha-validation-wrong-sha-shape-policy-check
    if: always()
    permissions:
      contents: read
      statuses: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-scp-sha-validation
      threshold: deny
      simulate-cross-repo: true
      scp-sha: 0000000000000000000000000000000000000000
      selftest-mode: true

  fixture-simulate-token-exchange-failure-policy-check:
    name: fixture-simulate-token-exchange-failure-policy-check
    needs: fixture-scp-sha-validation-mismatched-valid-sha-policy-check
    # The prior needs-chain includes jobs that fail BY DESIGN. Without
    # `if: always()`, the harness would cascade to `skipped` and hide
    # the failure-path assertions the orchestrator expects to inspect.
    if: always()
    permissions:
      contents: read
      statuses: write
      # See fixture-pass-policy-check permissions block for why
      # attestations:write + id-token:write are required despite the
      # callee's attest-scorecard job being `if:`-gated off (GHA startup-
      # validation requirement on reusable-workflow callers).
      attestations: write
      id-token: write
    # TF-PIM-001 Wave E / TF-PIM-001-ARCH-002 selftest fixture. Invokes
    # the reusable workflow with simulate-app-token-failure=true, which
    # short-circuits the App token-exchange path: the simulate step emits
    # SCP-E001 and exits 1 BEFORE any real token-exchange API call. This
    # job's result is `failure` BY DESIGN — the orchestrator
    # `workflow-selftest` job asserts result ∈ {failure, cancelled} as
    # the success criterion (cancelled is acceptable under workflow-run
    # cancellation; same shape as the existing `Assert upstream job
    # outcomes are inspectable` step's treatment of fixture-fail-policy-check).
    # needs `fixture-fail-policy-check` for linear harness sequencing
    # (NOT for artifact-name conflict, which does not apply since this
    # job exits at the simulate step before any artifact-write step;
    # sequencing convention preserved for harness consistency).
    # v0.1 ships mock-based coverage; real-API coverage tracked-forward
    # as TF-PIM-001-ARCH-002 follow-up. See `tests/workflow/conftest.md`
    # for the mock-vs-real-API decision rationale.
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-pass
      threshold: deny
      simulate-app-token-failure: true
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  workflow-selftest:
    name: workflow-selftest
    if: always()
    needs:
      - prepare-manifest-targets-unit
      - stash-fixture-pass-summary
      - stash-fixture-scp-sha-validation-happy-path-summary
      - stash-fixture-scp-sha-validation-cross-repo-happy-path-summary
      - fixture-scp-r-030-pass-policy-check
      - stash-fixture-scp-r-030-pass-summary
      - fixture-scp-r-030-marker-absent-policy-check
      - stash-fixture-scp-r-030-marker-absent-summary
      - fixture-scp-r-030-claude-absent-policy-check
      - stash-fixture-scp-r-030-claude-absent-summary
      - fixture-scp-r-030-disabled-policy-check
      - stash-fixture-scp-r-030-disabled-summary
      - fixture-scp-r-028-pass-policy-check
      - stash-fixture-scp-r-028-pass-summary
      - fixture-scp-r-028-import-fence-policy-check
      - stash-fixture-scp-r-028-import-fence-summary
      - fixture-scp-r-028-trust-boundary-policy-check
      - stash-fixture-scp-r-028-trust-boundary-summary
      - auth-canonical-cosign-smoke
      - fixture-fail-policy-check
      - fixture-scp-sha-validation-required-input-missing-policy-check
      - fixture-scp-sha-validation-wrong-sha-shape-policy-check
      - fixture-scp-sha-validation-mismatched-valid-sha-policy-check
      - fixture-simulate-token-exchange-failure-policy-check
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download fixture-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-pass-policy-check-summary
          path: downloaded/fixture-pass

      - name: Download fixture-scp-sha-validation happy-path summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-sha-validation-happy-path-policy-check-summary
          path: downloaded/fixture-scp-sha-validation-happy-path

      - name: Download fixture-scp-sha-validation cross-repo happy-path summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-sha-validation-cross-repo-happy-path-policy-check-summary
          path: downloaded/fixture-scp-sha-validation-cross-repo-happy-path

      - name: Download fixture-scp-r-030-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-030-pass-policy-check-summary
          path: downloaded/fixture-scp-r-030-pass

      - name: Download fixture-scp-r-030-marker-absent summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-030-marker-absent-policy-check-summary
          path: downloaded/fixture-scp-r-030-marker-absent

      - name: Download fixture-scp-r-030-claude-absent summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-030-claude-absent-policy-check-summary
          path: downloaded/fixture-scp-r-030-claude-absent

      - name: Download fixture-scp-r-030-disabled summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-030-disabled-policy-check-summary
          path: downloaded/fixture-scp-r-030-disabled

      - name: Download fixture-scp-r-028-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-028-pass-policy-check-summary
          path: downloaded/fixture-scp-r-028-pass

      - name: Download fixture-scp-r-028-import-fence summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-028-import-fence-policy-check-summary
          path: downloaded/fixture-scp-r-028-import-fence

      - name: Download fixture-scp-r-028-trust-boundary summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-scp-r-028-trust-boundary-policy-check-summary
          path: downloaded/fixture-scp-r-028-trust-boundary

      - name: Download fixture-fail summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-check-summary
          path: downloaded/fixture-fail

      - name: Assert upstream job outcomes are inspectable
        shell: bash
        env:
          FIXTURE_PASS_STASH_RESULT: ${{ needs.stash-fixture-pass-summary.result }}
          SCP_SHA_HAPPY_PATH_STASH_RESULT: ${{ needs.stash-fixture-scp-sha-validation-happy-path-summary.result }}
          SCP_SHA_CROSS_REPO_STASH_RESULT: ${{ needs.stash-fixture-scp-sha-validation-cross-repo-happy-path-summary.result }}
          FIXTURE_FAIL_RESULT: ${{ needs.fixture-fail-policy-check.result }}
        run: |
          set -euo pipefail
          [ "${FIXTURE_PASS_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-pass artifact staging must succeed before comparison"
            exit 1
          }
          [ "${SCP_SHA_HAPPY_PATH_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-scp-sha-validation happy-path artifact staging must succeed before comparison"
            exit 1
          }
          [ "${SCP_SHA_CROSS_REPO_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-scp-sha-validation cross-repo happy-path artifact staging must succeed before comparison"
            exit 1
          }
          case "${FIXTURE_FAIL_RESULT}" in
            success|failure) ;;
            *)
              echo "::error::fixture-fail reusable-workflow result must remain inspectable for the harness"
              exit 1
              ;;
          esac

      - name: Assert manifest target-prep unit tests passed
        # The prepare-manifest-targets-unit job runs the lib unit test that
        # proves a DELETED manifest is skipped (no SCP-E002) — the v1.5.1
        # regression guard. This aggregator is `if: always()`, so a failed
        # need does NOT auto-fail it; assert the result explicitly (same
        # pattern as the SCP-R-030 coupling guard below).
        shell: bash
        env:
          PREPARE_MANIFEST_TARGETS_UNIT_RESULT: ${{ needs.prepare-manifest-targets-unit.result }}
        run: |
          set -euo pipefail
          [ "${PREPARE_MANIFEST_TARGETS_UNIT_RESULT}" = "success" ] || {
            echo "::error::prepare-manifest-targets-unit must succeed (v1.5.1 SCP-E002 deleted-manifest regression guard); got '${PREPARE_MANIFEST_TARGETS_UNIT_RESULT}'"
            exit 1
          }

      - name: Assert scp-sha validation failure-path jobs failed by design
        shell: bash
        env:
          REQUIRED_INPUT_MISSING_RESULT: ${{ needs.fixture-scp-sha-validation-required-input-missing-policy-check.result }}
          WRONG_SHA_SHAPE_RESULT: ${{ needs.fixture-scp-sha-validation-wrong-sha-shape-policy-check.result }}
          MISMATCHED_VALID_SHA_RESULT: ${{ needs.fixture-scp-sha-validation-mismatched-valid-sha-policy-check.result }}
          SIMULATE_FAILURE_RESULT: ${{ needs.fixture-simulate-token-exchange-failure-policy-check.result }}
        run: |
          set -euo pipefail
          for name in REQUIRED_INPUT_MISSING_RESULT WRONG_SHA_SHAPE_RESULT MISMATCHED_VALID_SHA_RESULT SIMULATE_FAILURE_RESULT; do
            result="${!name}"
            [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ] || {
              echo "::error::${name} must result in 'failure' (or 'cancelled' under workflow-run cancellation); got '${result}'"
              exit 1
            }
          done

      - name: Assert SCP-R-030 fixtures stayed green (WP-SCP-030 §4.1 coupling guard)
        # The keystone of the companion activation. Every fixture-scp-r-030-*
        # invocation runs with threshold: deny; ALL must result in 'success'.
        # The marker-absent + claude-absent fixtures carry an SCP-R-030 deny
        # finding — if SCP-R-030 were NOT in both WARN_BASELINE_RULES sites the
        # threshold check would trip and these jobs would FAIL. result ==
        # success therefore proves the materialisation step + warn-baseline
        # membership are coupled correctly: an opted-in missing-marker adopter
        # WARNS (gate green), never deny-BLOCKS.
        shell: bash
        env:
          SCP_R030_PASS_RESULT: ${{ needs.fixture-scp-r-030-pass-policy-check.result }}
          SCP_R030_MARKER_ABSENT_RESULT: ${{ needs.fixture-scp-r-030-marker-absent-policy-check.result }}
          SCP_R030_CLAUDE_ABSENT_RESULT: ${{ needs.fixture-scp-r-030-claude-absent-policy-check.result }}
          SCP_R030_DISABLED_RESULT: ${{ needs.fixture-scp-r-030-disabled-policy-check.result }}
        run: |
          set -euo pipefail
          for name in SCP_R030_PASS_RESULT SCP_R030_MARKER_ABSENT_RESULT SCP_R030_CLAUDE_ABSENT_RESULT SCP_R030_DISABLED_RESULT; do
            result="${!name}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} must result in 'success' — SCP-R-030 is warn-baseline and must NEVER block the merge gate (WP-SCP-030 §4.1 coupling guard); got '${result}'"
              exit 1
            }
          done

      - name: Assert SCP-R-028 auth fixtures stayed green (WP-SCP-028 Phase 2 coupling guard)
        # The keystone of the auth-canonical companion activation. Every
        # fixture-scp-r-028-* invocation runs with threshold: deny; ALL must
        # result in 'success'. The import-fence + trust-boundary fixtures carry
        # an SCP-R-010 deny finding — if SCP-R-009/010/011 were materialised but
        # NOT in both WARN_BASELINE_RULES sites, the threshold check would trip
        # and these jobs would FAIL. result == success therefore proves the
        # materialisation step + warn-baseline membership are coupled correctly:
        # an adopter with a tier_deny shadow (or a present-but-unverified
        # canonical) WARNS (gate green), never deny-BLOCKS.
        shell: bash
        env:
          SCP_R028_PASS_RESULT: ${{ needs.fixture-scp-r-028-pass-policy-check.result }}
          SCP_R028_IMPORT_FENCE_RESULT: ${{ needs.fixture-scp-r-028-import-fence-policy-check.result }}
          SCP_R028_TRUST_BOUNDARY_RESULT: ${{ needs.fixture-scp-r-028-trust-boundary-policy-check.result }}
        run: |
          set -euo pipefail
          for name in SCP_R028_PASS_RESULT SCP_R028_IMPORT_FENCE_RESULT SCP_R028_TRUST_BOUNDARY_RESULT; do
            result="${!name}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} must result in 'success' — SCP-R-009/010/011 are warn-baseline and must NEVER block the merge gate (WP-SCP-028 Phase 2 coupling guard); got '${result}'"
              exit 1
            }
          done

      - name: Assert auth-canonical cosign smoke passed (mock-masking guard)
        # The fixtures use the simulated cosign seam; this asserts the REAL
        # cosign+live-surface trust anchor verified, so a URL/identity/surface
        # drift cannot hide behind the simulated path. A transient Sigstore
        # outage makes this red — re-run; it is not an adopter gate.
        shell: bash
        env:
          COSIGN_SMOKE_RESULT: ${{ needs.auth-canonical-cosign-smoke.result }}
        run: |
          set -euo pipefail
          [ "${COSIGN_SMOKE_RESULT}" = "success" ] || {
            echo "::error::auth-canonical-cosign-smoke must succeed — the live public canonical surface must cosign-verify against CT's keyless identity (mock-masking guard); got '${COSIGN_SMOKE_RESULT}'. Transient Sigstore/network outages are re-runnable."
            exit 1
          }

      - name: Compare reusable-workflow summaries to committed expectations
        env:
          FIXTURE_FAIL_RESULT: ${{ needs.fixture-fail-policy-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def load(path: str) -> dict:
              return json.loads(Path(path).read_text())

          def normalize(payload: dict) -> dict:
              pr_sha = payload.get("pr_sha", "")
              if not re.fullmatch(r"[0-9a-f]{40}", pr_sha):
                  raise SystemExit(f"summary pr_sha must be a lowercase 40-character hex string, got {pr_sha!r}")
              if not isinstance(payload.get("workflow_run_id"), int) or payload["workflow_run_id"] < 0:
                  raise SystemExit("summary workflow_run_id must be a non-negative integer")
              if not payload.get("base_ref"):
                  raise SystemExit("summary base_ref must be a non-empty string")

              return {
                  "schema_version": payload["schema_version"],
                  "rule_set": payload["rule_set"],
                  "findings": payload["findings"],
                  "disabled_rules": payload["disabled_rules"],
                  "waivers_applied": payload["waivers_applied"],
                  "bypass_emitted": payload["bypass_emitted"],
                  "conflict_gate": payload["conflict_gate"],
              }

          cases = [
              (
                  "fixture-pass",
                  "downloaded/fixture-pass/policy-check-summary.json",
                  "tests/workflow/fixture-pass/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-pass",
                  "downloaded/fixture-scp-r-030-pass/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-pass/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-marker-absent",
                  "downloaded/fixture-scp-r-030-marker-absent/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-marker-absent/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-claude-absent",
                  "downloaded/fixture-scp-r-030-claude-absent/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-claude-absent/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-disabled",
                  "downloaded/fixture-scp-r-030-disabled/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-disabled/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-028-pass",
                  "downloaded/fixture-scp-r-028-pass/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-028-pass/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-028-import-fence",
                  "downloaded/fixture-scp-r-028-import-fence/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-028-import-fence/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-028-trust-boundary",
                  "downloaded/fixture-scp-r-028-trust-boundary/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-028-trust-boundary/expected-annotations.json",
              ),
              (
                  "fixture-fail",
                  "downloaded/fixture-fail/policy-check-summary.json",
                  "tests/workflow/fixture-fail/expected-annotations.json",
              ),
              (
                  "fixture-scp-sha-validation-happy-path",
                  "downloaded/fixture-scp-sha-validation-happy-path/policy-check-summary.json",
                  "tests/workflow/fixture-scp-sha-validation/expected-annotations.json",
              ),
              (
                  "fixture-scp-sha-validation-cross-repo-happy-path",
                  "downloaded/fixture-scp-sha-validation-cross-repo-happy-path/policy-check-summary.json",
                  "tests/workflow/fixture-scp-sha-validation/expected-annotations.json",
              ),
          ]

          actual_by_case = {}

          for name, actual_path, expected_path in cases:
              actual = normalize(load(actual_path))
              expected = normalize(load(expected_path))
              if actual != expected:
                  raise SystemExit(
                      f"{name} summary mismatch\nactual={json.dumps(actual, indent=2, sort_keys=True)}\nexpected={json.dumps(expected, indent=2, sort_keys=True)}"
                  )
              actual_by_case[name] = actual

          fixture_fail_result = os.environ["FIXTURE_FAIL_RESULT"]
          fixture_fail_has_deny = any(
              item.get("verdict") == "deny"
              for item in actual_by_case["fixture-fail"]["findings"]
          )
          if fixture_fail_has_deny and fixture_fail_result != "failure":
              raise SystemExit(
                  "fixture-fail must fail the reusable workflow when deny findings are present"
              )
          if not fixture_fail_has_deny and fixture_fail_result != "success":
              raise SystemExit(
                  "fixture-fail must stay green until the oracle contains deny findings"
              )
          PY

      - name: Emit workflow summary
        shell: bash
        run: |
          {
            echo "workflow-selftest: fixture-pass, fixture-fail, the scp-sha validation matrix, the four SCP-R-030 companion-activation fixtures (pass / marker-absent / claude-absent / disabled), and the three SCP-R-028 auth-canonical fixtures (pass / import-fence / trust-boundary) all evaluated as expected; the live cosign smoke verified both canonicals."
            echo
            echo "The SCP-R-028 fixtures prove the WP-SCP-028 Phase 2 coupling guard end-to-end: a tier_deny shadow (import-fence) and a present-but-unverified canonical (trust-boundary) WARN with the merge gate GREEN (result==success) while the summary carries the SCP-R-010 finding; the trust-boundary fixture proves an adopter cannot spoof the *_verified flag from repo content."
            echo
            echo "The SCP-R-030 fixtures prove the WP-SCP-030 §4.1 coupling guard end-to-end: an opted-in missing-marker adopter WARNS with the merge gate GREEN (result==success) while the summary carries the SCP-R-030 finding (materialisation fires)."
            echo
            echo "Each reusable-workflow invocation was isolated to its own fixture subtree before the summaries were compared, and the staged-artifact flow kept repeated policy-check invocations from colliding on the fixed artifact name."
            echo "The harness also verified that deny findings force the reusable workflow to fail when threshold enforcement is active, and that malformed or missing scp-sha inputs fail in the expected selftest paths."
          } >> "${GITHUB_STEP_SUMMARY}"
