name: workflow-selftest

"on":
  pull_request:
    paths:
      - .github/workflows/policy-check.yml
      - policies/**
      - tests/workflow/**
      - schemas/policy-check-summary.schema.json
      # Closes 020M R1 SAFE-MIN-002: hash-pinned Python deps lockfile is
      # load-bearing for the gate workflow. Renovate auto-bump PRs that
      # touch only requirements/policy-check.txt would otherwise miss the
      # selftest harness verification.
      - requirements/**

jobs:
  validate-selftest-config:
    name: validate-selftest-config
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate reusable-workflow pin and fixture-oracle ratchet
        env:
          SCP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          # Closes WP-SCP-022 020C.1 follow-up: GitHub Actions does NOT
          # support `@<ref>` on local reusable-workflow `uses:` lines —
          # only cross-repo refs accept @ref. The previous workflow used
          # `uses: ./.github/workflows/policy-check.yml@<sha>` which
          # made every workflow-selftest run fail at parse time on every
          # commit since the file was authored. Local reusable workflows
          # always run at the calling workflow's HEAD SHA, so the pin is
          # effectively the PR HEAD itself; a separate "what changed in
          # this PR" check below replaces the pin-staleness check.
          workflow_text = Path(".github/workflows/workflow-selftest.yml").read_text()
          local_uses_count = len(re.findall(
              r"uses:\s+\./\.github/workflows/policy-check\.yml\s*$",
              workflow_text,
              re.M,
          ))
          if local_uses_count != 3:
              raise SystemExit(
                  "workflow-selftest must invoke policy-check.yml exactly three times via "
                  "`uses: ./.github/workflows/policy-check.yml` (no @ref): fixture-pass, fixture-fail, and fixture-simulate-token-exchange-failure"
              )

          base = os.environ["SCP_BASE_SHA"]
          head = os.environ["SCP_HEAD_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..{head}"],
              text=True,
          ).splitlines()

          # When policy-check.yml changes in this PR, the selftest will
          # naturally exercise the new version (local reusable workflows
          # run at the PR HEAD). No pin-bump is required.

          def exists_at(ref: str, path: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{ref}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          for fixture_root in (
              "tests/workflow/fixture-pass",
              "tests/workflow/fixture-fail",
          ):
              services_path = f"{fixture_root}/services.yml"
              expected_path = f"{fixture_root}/expected-annotations.json"
              if (
                  services_path in changed
                  and expected_path in changed
                  and exists_at(base, services_path)
                  and exists_at(base, expected_path)
              ):
                  raise SystemExit(
                      f"{fixture_root} cannot change services.yml and expected-annotations.json in the same PR; add a new fixture pair or stage the oracle update separately."
                  )
          PY

  fixture-pass-policy-check:
    name: fixture-pass-policy-check
    needs: validate-selftest-config
    permissions:
      contents: read
      statuses: write
      # WP-SCP-023 023B (commit 5d4341b) added the `attest-scorecard`
      # job to policy-check.yml with job-level `attestations: write +
      # id-token: write`. GitHub Actions validates reusable-workflow
      # caller permissions at workflow STARTUP, BEFORE `if:` conditions
      # — so even though attest-scorecard is `if: inputs.scorecard-emit`-
      # gated (and this caller leaves scorecard-emit default-false),
      # the caller MUST still grant the permissions the callee declares
      # on every job. Omitting these caused workflow-selftest startup_
      # failure on every run since 2026-05-03 (sample-size 100+ red runs
      # across all branches). Fold-in fix in TF-PIM-001 Wave E (PR #139).
      attestations: write
      id-token: write
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-pass
      threshold: deny

  stash-fixture-pass-summary:
    name: stash-fixture-pass-summary
    needs: fixture-pass-policy-check
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Download fixture-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-check-summary
          path: artifact-pass

      - name: Re-upload fixture-pass summary under a stable harness name
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-pass-policy-check-summary
          path: artifact-pass/policy-check-summary.json
          if-no-files-found: error

      - name: Delete reusable-workflow artifact so the second invocation can reuse the fixed name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          list_request = urllib.request.Request(
              f"{api_url}/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(list_request) as response:
              payload = json.load(response)

          matches = [
              artifact
              for artifact in payload.get("artifacts", [])
              if artifact.get("name") == "policy-check-summary"
          ]
          if len(matches) != 1:
              print(
                  f"expected exactly one policy-check-summary artifact before the second invocation, found {len(matches)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          artifact_id = matches[0]["id"]
          delete_request = urllib.request.Request(
              f"{api_url}/repos/{repository}/actions/artifacts/{artifact_id}",
              headers=headers,
              method="DELETE",
          )

          try:
              with urllib.request.urlopen(delete_request) as response:
                  if response.status != 204:
                      print(
                          f"unexpected delete status for artifact {artifact_id}: {response.status}",
                          file=sys.stderr,
                      )
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print(f"artifact delete failed: {exc}", file=sys.stderr)
              sys.exit(1)
          PY

  fixture-fail-policy-check:
    name: fixture-fail-policy-check
    needs: stash-fixture-pass-summary
    permissions:
      contents: read
      statuses: write
      # See fixture-pass-policy-check permissions block for why
      # attestations:write + id-token:write are required despite the
      # callee's attest-scorecard job being `if:`-gated off (GHA startup-
      # validation requirement on reusable-workflow callers).
      attestations: write
      id-token: write
    # The fixture-fail harness intentionally invokes the reusable
    # workflow against a services.yml that triggers SCP-R-001's deny.
    # The reusable workflow exits 1 on deny → this job's result is
    # `failure` BY DESIGN. The orchestrator `workflow-selftest` job
    # asserts that result == 'failure' as the success criterion.
    #
    # The inner job's red status surfaces on the PR check list. This
    # is acceptable because:
    # (a) workflow-selftest is documented as a selftest harness, not a
    #     gate.
    # (b) The substantive gate is the orchestrator's `workflow-selftest`
    #     job (different from the workflow file's name); green there
    #     means both fixtures behaved as expected.
    # (c) GitHub Actions does NOT support `continue-on-error: true` on
    #     reusable-workflow `uses:` jobs — adding it produces a
    #     workflow-load failure (no jobs run) — so the inner-job-red
    #     state cannot be suppressed at this layer.
    # (d) 020D1 will configure branch protection to require ONLY the
    #     orchestrator's job, not the harness inner jobs.
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-fail
      threshold: deny

  fixture-simulate-token-exchange-failure-policy-check:
    name: fixture-simulate-token-exchange-failure-policy-check
    needs: fixture-fail-policy-check
    permissions:
      contents: read
      statuses: write
      # See fixture-pass-policy-check permissions block for why
      # attestations:write + id-token:write are required despite the
      # callee's attest-scorecard job being `if:`-gated off (GHA startup-
      # validation requirement on reusable-workflow callers).
      attestations: write
      id-token: write
    # TF-PIM-001 Wave E / TF-PIM-001-ARCH-002 selftest fixture. Invokes
    # the reusable workflow with simulate-app-token-failure=true, which
    # short-circuits the App token-exchange path: the simulate step emits
    # SCP-E001 and exits 1 BEFORE any real token-exchange API call. This
    # job's result is `failure` BY DESIGN — the orchestrator
    # `workflow-selftest` job asserts result ∈ {failure, cancelled} as
    # the success criterion (cancelled is acceptable under workflow-run
    # cancellation; same shape as the existing `Assert upstream job
    # outcomes are inspectable` step's treatment of fixture-fail-policy-check).
    # needs `fixture-fail-policy-check` for linear harness sequencing
    # (NOT for artifact-name conflict, which does not apply since this
    # job exits at the simulate step before any artifact-write step;
    # sequencing convention preserved for harness consistency).
    # v0.1 ships mock-based coverage; real-API coverage tracked-forward
    # as TF-PIM-001-ARCH-002 follow-up. See `tests/workflow/conftest.md`
    # for the mock-vs-real-API decision rationale.
    # Local reusable workflow: GitHub Actions runs this at the calling
    # workflow's HEAD SHA. `@<ref>` is not valid for local refs.
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-pass
      threshold: deny
      simulate-app-token-failure: true

  workflow-selftest:
    name: workflow-selftest
    if: always()
    needs:
      - stash-fixture-pass-summary
      - fixture-fail-policy-check
      - fixture-simulate-token-exchange-failure-policy-check
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download fixture-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixture-pass-policy-check-summary
          path: downloaded/fixture-pass

      - name: Download fixture-fail summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-check-summary
          path: downloaded/fixture-fail

      - name: Assert upstream job outcomes are inspectable
        shell: bash
        env:
          FIXTURE_PASS_STASH_RESULT: ${{ needs.stash-fixture-pass-summary.result }}
          FIXTURE_FAIL_RESULT: ${{ needs.fixture-fail-policy-check.result }}
        run: |
          set -euo pipefail
          [ "${FIXTURE_PASS_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-pass artifact staging must succeed before comparison"
            exit 1
          }
          case "${FIXTURE_FAIL_RESULT}" in
            success|failure) ;;
            *)
              echo "::error::fixture-fail reusable-workflow result must remain inspectable for the harness"
              exit 1
              ;;
          esac

      - name: Assert simulate-token-exchange-failure job failed by design
        shell: bash
        env:
          SIMULATE_FAILURE_RESULT: ${{ needs.fixture-simulate-token-exchange-failure-policy-check.result }}
        run: |
          set -euo pipefail
          [ "${SIMULATE_FAILURE_RESULT}" = "failure" ] || [ "${SIMULATE_FAILURE_RESULT}" = "cancelled" ] || {
            echo "::error::TF-PIM-001-ARCH-002 selftest: simulate-token-exchange-failure job must result in 'failure' (got '${SIMULATE_FAILURE_RESULT}'). The simulate step is expected to emit SCP-E001 and exit 1 (failure = by-design success criterion); cancelled is acceptable under workflow-run cancellation; any other outcome means the failure-path wiring is broken."
            exit 1
          }

      - name: Compare reusable-workflow summaries to committed expectations
        env:
          FIXTURE_FAIL_RESULT: ${{ needs.fixture-fail-policy-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def load(path: str) -> dict:
              return json.loads(Path(path).read_text())

          def normalize(payload: dict) -> dict:
              pr_sha = payload.get("pr_sha", "")
              if not re.fullmatch(r"[0-9a-f]{40}", pr_sha):
                  raise SystemExit(f"summary pr_sha must be a lowercase 40-character hex string, got {pr_sha!r}")
              if not isinstance(payload.get("workflow_run_id"), int) or payload["workflow_run_id"] < 0:
                  raise SystemExit("summary workflow_run_id must be a non-negative integer")
              if not payload.get("base_ref"):
                  raise SystemExit("summary base_ref must be a non-empty string")

              return {
                  "schema_version": payload["schema_version"],
                  "rule_set": payload["rule_set"],
                  "findings": payload["findings"],
                  "disabled_rules": payload["disabled_rules"],
                  "waivers_applied": payload["waivers_applied"],
                  "bypass_emitted": payload["bypass_emitted"],
                  "conflict_gate": payload["conflict_gate"],
              }

          cases = [
              (
                  "fixture-pass",
                  "downloaded/fixture-pass/policy-check-summary.json",
                  "tests/workflow/fixture-pass/expected-annotations.json",
              ),
              (
                  "fixture-fail",
                  "downloaded/fixture-fail/policy-check-summary.json",
                  "tests/workflow/fixture-fail/expected-annotations.json",
              ),
          ]

          actual_by_case = {}

          for name, actual_path, expected_path in cases:
              actual = normalize(load(actual_path))
              expected = normalize(load(expected_path))
              if actual != expected:
                  raise SystemExit(
                      f"{name} summary mismatch\nactual={json.dumps(actual, indent=2, sort_keys=True)}\nexpected={json.dumps(expected, indent=2, sort_keys=True)}"
                  )
              actual_by_case[name] = actual

          fixture_fail_result = os.environ["FIXTURE_FAIL_RESULT"]
          fixture_fail_has_deny = any(
              item.get("verdict") == "deny"
              for item in actual_by_case["fixture-fail"]["findings"]
          )
          if fixture_fail_has_deny and fixture_fail_result != "failure":
              raise SystemExit(
                  "fixture-fail must fail the reusable workflow when deny findings are present"
              )
          if not fixture_fail_has_deny and fixture_fail_result != "success":
              raise SystemExit(
                  "fixture-fail must stay green until the oracle contains deny findings"
              )
          PY

      - name: Emit workflow summary
        shell: bash
        run: |
          {
            echo "workflow-selftest: fixture-pass and fixture-fail both evaluated as expected."
            echo
            echo "Each reusable-workflow invocation was isolated to its own fixture subtree before the summaries were compared."
            echo "The harness also verified that deny findings force the reusable workflow to fail when threshold enforcement is active."
          } >> "${GITHUB_STEP_SUMMARY}"
