                  "tests/workflow/fixture-scp-r-031-marker-absent-agents/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-031-dynamic-state-present",
                  "downloaded/fixture-scp-r-031-dynamic-state-present/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-031-dynamic-state-present/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-031-disabled",
                  "downloaded/fixture-scp-r-031-disabled/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-031-disabled/expected-annotations.json",
              ),
              (
                  "fixture-fail",
                  "downloaded/fixture-fail/policy-check-summary.json",
                  "tests/workflow/fixture-fail/expected-annotations.json",
              ),
              (
                  "fixture-scp-sha-validation-happy-path",
                  "downloaded/fixture-scp-sha-validation-happy-path/policy-check-summary.json",
                  "tests/workflow/fixture-scp-sha-validation/expected-annotations.json",
              ),
              (
                  "fixture-scp-sha-validation-cross-repo-happy-path",
                  "downloaded/fixture-scp-sha-validation-cross-repo-happy-path/policy-check-summary.json",
                  "tests/workflow/fixture-scp-sha-validation/expected-annotations.json",
              ),
          ]

          actual_by_case = {}

          for name, actual_path, expected_path in cases:
              actual = normalize(load(actual_path))
              expected = normalize(load(expected_path))
              if actual != expected:
                  raise SystemExit(
                      f"{name} summary mismatch\nactual={json.dumps(actual, indent=2, sort_keys=True)}\nexpected={json.dumps(expected, indent=2, sort_keys=True)}"
                  )
              actual_by_case[name] = actual

          fixture_fail_result = os.environ["FIXTURE_FAIL_RESULT"]
          fixture_fail_has_deny = any(
              item.get("verdict") == "deny"
              for item in actual_by_case["fixture-fail"]["findings"]
          )
          if fixture_fail_has_deny and fixture_fail_result != "failure":
              raise SystemExit(
                  "fixture-fail must fail the reusable workflow when deny findings are present"
              )
          if not fixture_fail_has_deny and fixture_fail_result != "success":
              raise SystemExit(
                  "fixture-fail must stay green until the oracle contains deny findings"
              )
          PY

