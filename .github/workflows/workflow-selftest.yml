            echo
            echo "The SCP-R-028 fixtures prove the WP-SCP-028 Phase 2 coupling guard end-to-end: a tier_deny shadow (import-fence) and a present-but-unverified canonical (trust-boundary) WARN with the merge gate GREEN (result==success) while the summary carries the SCP-R-010 finding; the trust-boundary fixture proves an adopter cannot spoof the *_verified flag from repo content."
            echo
            echo "The SCP-R-030 fixtures prove the WP-SCP-030 §4.1 coupling guard end-to-end: an opted-in missing-marker adopter WARNS with the merge gate GREEN (result==success) while the summary carries the SCP-R-030 finding (materialisation fires)."
            echo
            echo "The SCP-R-013 fixtures prove the WP-SCP-037 ARCH-006 materialiser end-to-end: an ontology consumer that vendors a divergent copy (embedded) or omits its contract WARNS with the merge gate GREEN (result==success) while the summary carries the SCP-R-013 finding; the carveout fixture proves an allowlisted authoring source is exempt, and the no-self-assert fixture proves the carve-out keys on the SCP-injected allowlist and cannot be spoofed from adopter services.yml content."
            echo
            echo "Each reusable-workflow invocation was isolated to its own fixture subtree before the summaries were compared, and the staged-artifact flow kept repeated policy-check invocations from colliding on the fixed artifact name."
            echo "The harness also verified that deny findings force the reusable workflow to fail when threshold enforcement is active, and that malformed or missing scp-sha inputs fail in the expected selftest paths."
            echo "The post-checkout failure fixture proved the publication gate: an infra failure after the SCP runtime checkout left the summary schema validation green while the summary artifact upload, the read-back commit status and the scorecard emit were skipped, and no second policy-check-summary artifact was published."
          } >> "${GITHUB_STEP_SUMMARY}"
