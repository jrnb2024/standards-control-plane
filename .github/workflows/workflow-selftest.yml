  # --- WP-SCP-030 companion-workflow activation fixtures ------------------
  # Four reusable-workflow invocations exercising the repo-level Option-A
  # opa eval path end-to-end through the real merge-gate workflow. Each runs
  # with threshold: deny and MUST stay green (SCP-R-030 is warn-baseline) —
  # the orchestrator asserts result == success (coupling-guard proof) AND
  # compares the summary to the committed oracle (materialisation proof).
  # Each passes its own rule-config-path (the .scp opt-in lives OUTSIDE the
  # fixture-path subtree so the conftest per-file pass never enumerates it;
  # the subtree holds only the adopter-root CLAUDE.md, which conftest skips).
  # A stash job follows each so the next invocation can reuse the fixed
  # `policy-check-summary` artifact name (same pattern as the fixtures above).
  #
  # SPEC §6 test-matrix coverage (no silent descope — R1 CG-MAJ-002):
  #   row 1 opted-in + full preamble  -> fixture-scp-r-030-pass          (no finding, green)
  #   row 2 opted-in + marker absent  -> fixture-scp-r-030-marker-absent (WARN, green; LOAD-BEARING §4.1)
  #   row 3 opted-in + CLAUDE.md none -> fixture-scp-r-030-claude-absent (WARN, green)
  #   row 5 opted-in + disabled       -> fixture-scp-r-030-disabled      (suppressed, green)
  #   row 4 NOT opted in              -> covered by the EXISTING fixture-pass: it passes no
  #         rule-config-path, so SCP_RULE_CONFIG_PATH defaults to a `.scp/rule-config.yaml`
  #         absent in that subtree -> input.rule_config = {} -> SCP-R-030 not opted in ->
  #         vacuous-pass. Its oracle (findings: []) is unchanged by this PR, proving the
  #         not-opted-in path adds zero findings.
  #   row 6 regression (SCP-R-001..008 unchanged) -> covered by the EXISTING fixture-pass +
  #         fixture-fail oracles staying BYTE-IDENTICAL (neither is modified in this PR); the
  #         additive opa eval step touches only SCP-R-030, so their per-file outcomes are
  #         asserted unchanged by the existing compare-cases. (Rule-branch coverage for all
  #         rows also exists at the rego-unit layer in policies/tests/scp_r_030_test.rego, #196.)

  fixture-scp-r-030-pass-policy-check:
    name: fixture-scp-r-030-pass-policy-check
    needs: stash-fixture-scp-sha-validation-cross-repo-happy-path-summary
    permissions:
      contents: read
      statuses: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/policy-check.yml
    with:
      fixture-path: tests/workflow/fixture-scp-r-030-pass/repo
      rule-config-path: tests/workflow/fixture-scp-r-030-pass/rule-config.yaml
      threshold: deny
      scp-sha: ${{ github.sha }}
      selftest-mode: true

  stash-fixture-scp-r-030-pass-summary:
    name: stash-fixture-scp-r-030-pass-summary
    needs: fixture-scp-r-030-pass-policy-check
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Download fixture-scp-r-030-pass summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
