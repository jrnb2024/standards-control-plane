        run: |
          set -euo pipefail
          [ "${FIXTURE_PASS_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-pass artifact staging must succeed before comparison"
            exit 1
          }
          [ "${SCP_SHA_HAPPY_PATH_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-scp-sha-validation happy-path artifact staging must succeed before comparison"
            exit 1
          }
          [ "${SCP_SHA_CROSS_REPO_STASH_RESULT}" = "success" ] || {
            echo "::error::fixture-scp-sha-validation cross-repo happy-path artifact staging must succeed before comparison"
            exit 1
          }
          case "${FIXTURE_FAIL_RESULT}" in
            success|failure) ;;
            *)
              echo "::error::fixture-fail reusable-workflow result must remain inspectable for the harness"
              exit 1
              ;;
          esac

      - name: Assert manifest target-prep unit tests passed
        # The prepare-manifest-targets-unit job runs the lib unit test that
        # proves a DELETED manifest is skipped (no SCP-E002) — the v1.5.1
        # regression guard. This aggregator is `if: always()`, so a failed
        # need does NOT auto-fail it; assert the result explicitly (same
        # pattern as the SCP-R-030 coupling guard below).
        shell: bash
        env:
          PREPARE_MANIFEST_TARGETS_UNIT_RESULT: ${{ needs.prepare-manifest-targets-unit.result }}
        run: |
          set -euo pipefail
          [ "${PREPARE_MANIFEST_TARGETS_UNIT_RESULT}" = "success" ] || {
            echo "::error::prepare-manifest-targets-unit must succeed (v1.5.1 SCP-E002 deleted-manifest regression guard); got '${PREPARE_MANIFEST_TARGETS_UNIT_RESULT}'"
            exit 1
          }

      - name: Assert policy-check pin-guard tests passed
        # The policy-check-pin-guards-unit job asserts that every cross-repo
        # SCP `actions/checkout` resolves the pin with no `||` fallback and
        # is gated on the scp-sha validation step's outcome. Same explicit-
        # result pattern as the assertion above: this aggregator is
        # `if: always()`, so a failed need does not auto-fail it.
        shell: bash
        env:
          POLICY_CHECK_PIN_GUARDS_UNIT_RESULT: ${{ needs.policy-check-pin-guards-unit.result }}
        run: |
          set -euo pipefail
          [ "${POLICY_CHECK_PIN_GUARDS_UNIT_RESULT}" = "success" ] || {
            echo "::error::policy-check-pin-guards-unit must succeed (federation-pin escape guard: no cross-repo SCP checkout may run on a pin that failed validation, because actions/checkout resolves an empty, whitespace, branch or tag ref instead of refusing it); got '${POLICY_CHECK_PIN_GUARDS_UNIT_RESULT}'"
            exit 1
          }

      - name: Assert scp-sha validation failure-path jobs failed by design
        shell: bash
        env:
          REQUIRED_INPUT_MISSING_RESULT: ${{ needs.fixture-scp-sha-validation-required-input-missing-policy-check.result }}
          WRONG_SHA_SHAPE_RESULT: ${{ needs.fixture-scp-sha-validation-wrong-sha-shape-policy-check.result }}
          MISMATCHED_VALID_SHA_RESULT: ${{ needs.fixture-scp-sha-validation-mismatched-valid-sha-policy-check.result }}
          SIMULATE_FAILURE_RESULT: ${{ needs.fixture-simulate-token-exchange-failure-policy-check.result }}
        run: |
          set -euo pipefail
          for name in REQUIRED_INPUT_MISSING_RESULT WRONG_SHA_SHAPE_RESULT MISMATCHED_VALID_SHA_RESULT SIMULATE_FAILURE_RESULT; do
            result="${!name}"
            [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ] || {
              echo "::error::${name} must result in 'failure' (or 'cancelled' under workflow-run cancellation); got '${result}'"
              exit 1
            }
          done

      - name: Assert post-checkout infra failure withheld publication (policy-check publication gate)
        # Direct CI observation of the publication gate in policy-check.yml.
        # fixture-simulate-post-checkout-failure dies after .scp-runtime is
        # populated, so the always() summary build falls back to [] and its
        # schema validation SUCCEEDS — the exact shape that used to publish
        # a zero-findings artifact and read-back. The `evaluated=true`
        # witness is never written, so upload + read-back must be `skipped`.
        # A broken gate cannot hide here: fixture-fail's artifact already
        # holds the fixed name, so the upload would conclude `failure`, not
        # `skipped`, and the artifact count would still be checked. Step
        # conclusions come from the jobs API (hence actions: read above).
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_CHECKOUT_FAILURE_RESULT: ${{ needs.fixture-simulate-post-checkout-failure-policy-check.result }}
          POST_CHECKOUT_FAILURE_JOB_NAME: fixture-simulate-post-checkout-failure-policy-check / scp/policy-check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          result = os.environ["POST_CHECKOUT_FAILURE_RESULT"]
          if result == "cancelled":
              # Workflow-run cancellation (same tolerance as the scp-sha
              # failure-path assertion above): step conclusions cannot hold
              # on a cancelled job, and the run is not mergeable anyway.
              print("::notice::fixture-simulate-post-checkout-failure was cancelled with the run; publication-gate assertion not evaluated")
              sys.exit(0)
          if result != "failure":
              print(
                  "::error::fixture-simulate-post-checkout-failure must result in 'failure' "
                  f"(the seam exits 1 after the runtime checkout); got '{result}'"
              )
              sys.exit(1)

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def paginate(path, key):
              items = []
              page = 1
              while True:
                  request = urllib.request.Request(
                      f"{api_url}/repos/{repository}/actions/runs/{run_id}/{path}?per_page=100&page={page}",
                      headers=headers,
                  )
                  with urllib.request.urlopen(request) as response:
                      batch = json.load(response).get(key, [])
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          job_name = os.environ["POST_CHECKOUT_FAILURE_JOB_NAME"]
          jobs = [job for job in paginate("jobs", "jobs") if job.get("name") == job_name]
          if len(jobs) != 1:
              print(f"::error::expected exactly one job named {job_name!r} in run {run_id}, found {len(jobs)}")
              sys.exit(1)
          conclusions = {step.get("name"): step.get("conclusion") for step in jobs[0].get("steps", [])}

          # (name, expected conclusion): the seam fired where intended, the
          # threshold step never ran (no witness), validation succeeded (so a
          # skip below is the gate's doing, not validation's), and nothing
          # was published on any of the three gated paths (the fixture opts
          # in to scorecard-emit so the scorecard rows are not vacuous).
          expected = (
              ("Simulate post-checkout infra failure (publication-gate selftest fixture)", "failure"),
              ("Render deny annotations and enforce threshold", "skipped"),
              ("Validate policy-check summary schema", "success"),
              ("Upload policy-check summary artifact", "skipped"),
              ("Post policy-check read-back commit status", "skipped"),
              ("Build scorecard emit", "skipped"),
              ("Upload scorecard emit artifact", "skipped"),
          )
          mismatches = [
              f"{name!r}: expected {want}, got {conclusions.get(name, '<absent>')}"
              for name, want in expected
              if conclusions.get(name) != want
          ]
          if mismatches:
              for line in mismatches:
                  print(f"::error::publication gate: {line}")
              sys.exit(1)

          summaries = [
              artifact
              for artifact in paginate("artifacts", "artifacts")
              if artifact.get("name") == "policy-check-summary"
          ]
          if len(summaries) != 1:
              print(
                  "::error::expected exactly one policy-check-summary artifact (fixture-fail's) "
                  f"after the post-checkout failure fixture, found {len(summaries)}"
              )
              sys.exit(1)

          print(
              "publication gate held: validate-summary success; summary upload, read-back "
              "and scorecard emit skipped; one policy-check-summary artifact (fixture-fail's)"
          )
          PY

      - name: Assert SCP-R-030 fixtures stayed green (WP-SCP-030 §4.1 coupling guard)
        # The keystone of the companion activation. Every fixture-scp-r-030-*
        # invocation runs with threshold: deny; ALL must result in 'success'.
        # The marker-absent + claude-absent fixtures carry an SCP-R-030 deny
        # finding — if SCP-R-030 were NOT in both WARN_BASELINE_RULES sites the
        # threshold check would trip and these jobs would FAIL. result ==
        # success therefore proves the materialisation step + warn-baseline
        # membership are coupled correctly: an opted-in missing-marker adopter
        # WARNS (gate green), never deny-BLOCKS.
        shell: bash
        env:
          SCP_R030_PASS_RESULT: ${{ needs.fixture-scp-r-030-pass-policy-check.result }}
          SCP_R030_MARKER_ABSENT_RESULT: ${{ needs.fixture-scp-r-030-marker-absent-policy-check.result }}
          SCP_R030_CLAUDE_ABSENT_RESULT: ${{ needs.fixture-scp-r-030-claude-absent-policy-check.result }}
          SCP_R030_DISABLED_RESULT: ${{ needs.fixture-scp-r-030-disabled-policy-check.result }}
        run: |
          set -euo pipefail
          for name in SCP_R030_PASS_RESULT SCP_R030_MARKER_ABSENT_RESULT SCP_R030_CLAUDE_ABSENT_RESULT SCP_R030_DISABLED_RESULT; do
            result="${!name}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} must result in 'success' — SCP-R-030 is warn-baseline and must NEVER block the merge gate (WP-SCP-030 §4.1 coupling guard); got '${result}'"
              exit 1
            }
          done

      - name: Assert SCP-R-028 auth fixtures stayed green (WP-SCP-028 Phase 2 coupling guard)
        # The keystone of the auth-canonical companion activation. Every
        # fixture-scp-r-028-* invocation runs with threshold: deny; ALL must
        # result in 'success'. The import-fence + trust-boundary fixtures carry
        # an SCP-R-010 deny finding — if SCP-R-009/010/011 were materialised but
        # NOT in both WARN_BASELINE_RULES sites, the threshold check would trip
        # and these jobs would FAIL. result == success therefore proves the
        # materialisation step + warn-baseline membership are coupled correctly:
        # an adopter with a tier_deny shadow (or a present-but-unverified
        # canonical) WARNS (gate green), never deny-BLOCKS.
        shell: bash
        env:
          SCP_R028_PASS_RESULT: ${{ needs.fixture-scp-r-028-pass-policy-check.result }}
          SCP_R028_IMPORT_FENCE_RESULT: ${{ needs.fixture-scp-r-028-import-fence-policy-check.result }}
          SCP_R028_TRUST_BOUNDARY_RESULT: ${{ needs.fixture-scp-r-028-trust-boundary-policy-check.result }}
        run: |
          set -euo pipefail
          for name in SCP_R028_PASS_RESULT SCP_R028_IMPORT_FENCE_RESULT SCP_R028_TRUST_BOUNDARY_RESULT; do
            result="${!name}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} must result in 'success' — SCP-R-009/010/011 are warn-baseline and must NEVER block the merge gate (WP-SCP-028 Phase 2 coupling guard); got '${result}'"
              exit 1
            }
          done

      - name: Assert SCP-R-013 ontology fixtures stayed green (WP-SCP-037 ARCH-006 coupling guard)
        # The keystone of the ARCH-006 materialiser activation. Every
        # fixture-scp-r-013-* invocation runs with threshold: deny; ALL must
        # result in 'success'. The embedded + no-self-assert fixtures carry
        # SCP-R-013 deny findings — if SCP-R-013 were materialised but NOT in
        # both WARN_BASELINE_RULES sites, the threshold check would trip and
        # those jobs would FAIL. result == success therefore proves the
        # materialisation step + warn-baseline membership are coupled correctly:
        # an ontology consumer that vendors a divergent copy (or omits its
        # contract) WARNS with the merge gate GREEN, never deny-BLOCKS.
        shell: bash
        env:
          SCP_R013_EMBEDDED_RESULT: ${{ needs.fixture-scp-r-013-embedded-policy-check.result }}
          SCP_R013_COMPLIANT_RESULT: ${{ needs.fixture-scp-r-013-compliant-policy-check.result }}
          SCP_R013_CARVEOUT_RESULT: ${{ needs.fixture-scp-r-013-carveout-policy-check.result }}
          SCP_R013_NO_SELF_ASSERT_RESULT: ${{ needs.fixture-scp-r-013-no-self-assert-policy-check.result }}
        run: |
          set -euo pipefail
          for name in SCP_R013_EMBEDDED_RESULT SCP_R013_COMPLIANT_RESULT SCP_R013_CARVEOUT_RESULT SCP_R013_NO_SELF_ASSERT_RESULT; do
            result="${!name}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} must result in 'success' — SCP-R-013 is warn-baseline and must NEVER block the merge gate (WP-SCP-037 ARCH-006 coupling guard); got '${result}'"
              exit 1
            }
          done

      - name: Assert SCP-R-031 fixtures stayed green (WP-SCP-031 §5.1 coupling guard)
        # The keystone of the estate-context-marker companion activation. Every
        # fixture-scp-r-031-* invocation runs with threshold: deny; ALL must
        # result in 'success'. The marker-absent-claude, marker-absent-agents,
        # and dynamic-state-present fixtures each carry an SCP-R-031 deny finding
        # — if SCP-R-031 were materialised (REPO_LEVEL_RULES) but NOT in both
        # WARN_BASELINE_RULES sites, the threshold check would trip and those
        # jobs would FAIL. result == success therefore proves the
        # materialisation step + warn-baseline membership are coupled correctly:
        # an opted-in adopter missing the marker on EITHER instruction surface
        # (or leaking dynamic state) WARNS with the gate GREEN, never
        # deny-BLOCKS. This is the advisory-safety invariant made executable.
        shell: bash
        env:
          SCP_R031_MARKER_PRESENT_BOTH_RESULT: ${{ needs.fixture-scp-r-031-marker-present-both-policy-check.result }}
          SCP_R031_MARKER_ABSENT_CLAUDE_RESULT: ${{ needs.fixture-scp-r-031-marker-absent-claude-policy-check.result }}
          SCP_R031_MARKER_ABSENT_AGENTS_RESULT: ${{ needs.fixture-scp-r-031-marker-absent-agents-policy-check.result }}
          SCP_R031_DYNAMIC_STATE_RESULT: ${{ needs.fixture-scp-r-031-dynamic-state-present-policy-check.result }}
          SCP_R031_DISABLED_RESULT: ${{ needs.fixture-scp-r-031-disabled-policy-check.result }}
        run: |
          set -euo pipefail
          for name in SCP_R031_MARKER_PRESENT_BOTH_RESULT SCP_R031_MARKER_ABSENT_CLAUDE_RESULT SCP_R031_MARKER_ABSENT_AGENTS_RESULT SCP_R031_DYNAMIC_STATE_RESULT SCP_R031_DISABLED_RESULT; do
            result="${!name}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} must result in 'success' — SCP-R-031 is warn-baseline and must NEVER block the merge gate (WP-SCP-031 §5.1 coupling guard); got '${result}'"
              exit 1
            }
          done

      - name: Assert auth-canonical cosign smoke passed (mock-masking guard)
        # The fixtures use the simulated cosign seam; this asserts the REAL
        # cosign+live-surface trust anchor verified, so a URL/identity/surface
        # drift cannot hide behind the simulated path. A transient Sigstore
        # outage makes this red — re-run; it is not an adopter gate.
        shell: bash
        env:
          COSIGN_SMOKE_RESULT: ${{ needs.auth-canonical-cosign-smoke.result }}
        run: |
          set -euo pipefail
          [ "${COSIGN_SMOKE_RESULT}" = "success" ] || {
            echo "::error::auth-canonical-cosign-smoke must succeed — the live public canonical surface must cosign-verify against CT's keyless identity (mock-masking guard); got '${COSIGN_SMOKE_RESULT}'. Transient Sigstore/network outages are re-runnable."
            exit 1
          }

      - name: Compare reusable-workflow summaries to committed expectations
        env:
          FIXTURE_FAIL_RESULT: ${{ needs.fixture-fail-policy-check.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def load(path: str) -> dict:
              return json.loads(Path(path).read_text())

          def normalize(payload: dict) -> dict:
              pr_sha = payload.get("pr_sha", "")
              if not re.fullmatch(r"[0-9a-f]{40}", pr_sha):
                  raise SystemExit(f"summary pr_sha must be a lowercase 40-character hex string, got {pr_sha!r}")
              if not isinstance(payload.get("workflow_run_id"), int) or payload["workflow_run_id"] < 0:
                  raise SystemExit("summary workflow_run_id must be a non-negative integer")
              if not payload.get("base_ref"):
                  raise SystemExit("summary base_ref must be a non-empty string")

              return {
                  "schema_version": payload["schema_version"],
                  "rule_set": payload["rule_set"],
                  "findings": payload["findings"],
                  "disabled_rules": payload["disabled_rules"],
                  "waivers_applied": payload["waivers_applied"],
                  "bypass_emitted": payload["bypass_emitted"],
                  "conflict_gate": payload["conflict_gate"],
              }

          cases = [
              (
                  "fixture-pass",
                  "downloaded/fixture-pass/policy-check-summary.json",
                  "tests/workflow/fixture-pass/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-pass",
                  "downloaded/fixture-scp-r-030-pass/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-pass/expected-annotations.json",
              ),
              (
                  "fixture-scp-r-030-marker-absent",
                  "downloaded/fixture-scp-r-030-marker-absent/policy-check-summary.json",
                  "tests/workflow/fixture-scp-r-030-marker-absent/expected-annotations.json",
              ),
              (
