# WP-SCP-022 020H.1 (iv-d): weekly canary replay.
#
# Replays the three SCP federation-primitive canaries via
# scripts/replay-canary.sh and opens a `rule-regression` issue on
# divergence from the canonical baseline at
# docs/reviews/WP-SCP-020/canary-evidence.md.
#
# Trigger: cron 0 9 * * MON (Monday 09:00 UTC) + manual workflow_dispatch.
#
# This is best-effort rollback detection — there is no paging rotation
# at v1.0.0 (per WP-SCP-020 §4 020H.1 (iv-d)). The opened issue
# auto-pings @jrnb2024 via the rule-regression template's
# `assignees:` block and labels `rule-regression` + `needs-triage` so
# it surfaces in the operator's normal triage queue.
#
# Closes: WP-SCP-020 §4 020H.1 (iv-d) + ADOPT-001 §12.7.5 forward-
# looking flag.
#
# References:
#   - scripts/replay-canary.sh (the replay harness, landed in 020E.c)
#   - docs/reviews/WP-SCP-020/canary-evidence.md (baseline)
#   - .github/ISSUE_TEMPLATE/rule-regression.md (opened issue's body skeleton)

name: canary-replay

"on":
  schedule:
    # Monday 09:00 UTC. Aligns with the start of the operator's
    # working week so a regression detected over the weekend gets
    # triaged in the same Monday triage pass.
    - cron: "0 9 * * MON"
  release:
    # Closes 020H.1 R1 COMP-MIN-001: plan §4 020H.1 (iv-b)
    # specified canary re-run "on each release" — the published-
    # release event is the canonical trigger.
    types: [published]
  workflow_dispatch:
    inputs:
      measure_cold_start:
        description: "Measure cold-start wall-clock (triggers fresh workflow_dispatch on each canary)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # required to open rule-regression issues on divergence
  actions: read  # required by replay-canary.sh to read workflow runs

# Serialise overlapping runs to eliminate the gh-issue-list /
# gh-issue-create TOCTOU race two concurrent runs could otherwise
# trip (closes 020H.1 R1 COR-DEDUP-001). cancel-in-progress: false
# means the second run queues rather than killing the first — we want
# both runs' detection signals on the audit trail.
concurrency:
  group: canary-replay
  cancel-in-progress: false

jobs:
  replay-canaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SCP repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false  # gh auth uses GITHUB_TOKEN env

      - name: Run canary replay
        id: replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCP_REPLAY_REPO: ${{ github.repository }}
          # Pass workflow_dispatch input via env to avoid direct
          # ${{ }} expansion inside `run:` (closes 020H.1 R1
          # COR-INPUTS-001 — 020B security pattern).
          INPUT_MEASURE_COLD_START: ${{ inputs.measure_cold_start }}
        run: |
          set +e  # script exits 1 on regression — we want to capture and continue
          if [ "${INPUT_MEASURE_COLD_START}" = "true" ]; then
            replay_args=("--measure-cold-start")
          else
            replay_args=()
          fi
          # Capture stdout (TSV per canary) and exit code separately.
          replay_output="$(./scripts/replay-canary.sh "${replay_args[@]}")"
          replay_exit=$?
          # Use a per-run heredoc delimiter (closes COR-REPLAY-001).
          # The script's stdout is TSV per canary; collision with
          # the literal token below is cryptographically negligible.
          delim="REPLAY_EOF_${RANDOM}_${RANDOM}_$(date +%N)"
          {
            echo "exit_code=${replay_exit}"
            echo "output<<${delim}"
            printf '%s\n' "${replay_output}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"
          # Also surface in the workflow log for human triage.
          printf '\n=== canary-replay output ===\n%s\n=== exit=%d ===\n' "${replay_output}" "${replay_exit}"
          # Do not fail the step itself — the issue-opening step below
          # is the actual signal. A failed step suppresses subsequent
          # steps including the issue-creation, defeating the purpose.
          exit 0

      - name: Open rule-regression issue on divergence
        if: steps.replay.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_OUTPUT: ${{ steps.replay.outputs.output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # De-dup: search for an existing open rule-regression issue
          # with title prefix "[regression] canary-replay" and the
          # same week-of-year so we don't open a fresh issue every
          # Monday for a chronic regression.
          week_tag="$(date -u +'%G-W%V')"
          title="[regression] canary-replay divergence (week ${week_tag})"

          existing="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label rule-regression \
            --search "in:title \"canary-replay divergence (week ${week_tag})\"" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            echo "rule-regression issue #${existing} already exists for week ${week_tag}; appending a comment."
            gh issue comment "${existing}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Re-detected in workflow run ${RUN_URL}.

          Replay output:

          \`\`\`
          ${REPLAY_OUTPUT}
          \`\`\`"
            exit 0
          fi

          # Compose the issue body — minimal skeleton; the human
          # operator adds detail per the .github/ISSUE_TEMPLATE/rule-regression.md
          # template fields during triage.
          # Use a quoted heredoc delimiter ('EOF') to suppress shell
          # expansion of REPLAY_OUTPUT (closes 020H.1 R1 SAFE-MIN-004:
          # if a future replay output ever contained shell metacharacters
          # — backticks, $(...) — unquoted EOF would interpret them).
          # Then substitute the placeholders explicitly via Python so
          # control over what gets interpolated is in the orchestrator,
          # not the shell parser.
          body="$(python3 - <<'PY'
          import os
          template = """# Auto-detected by WP-SCP-022 020H.1 (iv-d) weekly canary replay.

          ## Affected SCP version

          - HEAD on `main` at the time of this replay.
          - Workflow run: __RUN_URL__

          ## Affected rule(s)

          See replay output below — the divergence row identifies the
          canary branch (and therefore the rule) that drifted.

          ## Regression class

          - [x] Auto-detected by `canary-replay.yml` — divergence from baseline.

          ## Symptom

          ```
          __REPLAY_OUTPUT__
          ```

          ## Triage checklist (SCP maintainer fills in)

          - [ ] Reproduced locally via `scripts/replay-canary.sh`.
          - [ ] Confirmed against baseline at `docs/reviews/WP-SCP-020/canary-evidence.md`.
          - [ ] Root cause identified: SCP source / runner environment / GitHub-Actions API drift / canary-evidence baseline staleness.
          - [ ] Fix path determined: revert tag pin / patch SCP source / amend baseline.
          - [ ] Estate-cascade impact assessed.
          - [ ] Issue closed with a link to the fix PR + post-incident note.

          ## References

          - Template: `.github/ISSUE_TEMPLATE/rule-regression.md`
          - Baseline: `docs/reviews/WP-SCP-020/canary-evidence.md`
          - Replay harness: `scripts/replay-canary.sh`
          - WP-SCP-020 §4 020H.1 (iv) — rollback detection.
          """
          out = template.replace("__RUN_URL__", os.environ.get("RUN_URL", ""))
          out = out.replace("__REPLAY_OUTPUT__", os.environ.get("REPLAY_OUTPUT", ""))
          print(out)
          PY
          )"

          # Assignee read from CODEOWNERS-derived env (closes 020H.1
          # R1 SAFE-nit-007 — forward-compat for the 2026-07-21
          # second-maintainer escalation; current single-operator
          # mode resolves to @jrnb2024 only).
          assignees="${SCP_REGRESSION_ASSIGNEES:-jrnb2024}"

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --label rule-regression \
            --label needs-triage \
            --label auto-opened \
            --assignee "${assignees}" \
            --body "${body}"
