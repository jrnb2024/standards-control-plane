name: check-invocation-log-entry

# WP-SCP-024 slice 024B fix-round-7 bootstrap guard.
# Rationale:
# - 024B introduces the invocation-log tooling but is not a cohort
#   cascade slice; its DISPATCH-NOTE declares `cascade-status: not
#   applicable` and must not be forced through the cohort-only check.
# - The CI gate is intended for 024C-F cohort slices (plus future
#   forward-compatible cohort slices) while explicitly excluding 024A
#   and 024B from workflow triggering.
# - The script itself also self-exempts on `cascade-status: not
#   applicable` so tooling slices remain safe if they ever land in scope.

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - docs/reviews/WP-SCP-024/024[C-Z]*/**
      - docs/reviews/WP-SCP-024/024[a-z]*/**
      - docs/reviews/WP-SCP-020/branch-protection-log.md
      - STATUS.md
    paths-ignore:
      - docs/reviews/WP-SCP-024/024A/**
      - docs/reviews/WP-SCP-024/024B/**

permissions:
  contents: read
  pull-requests: read

jobs:
  check-invocation-log-entry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce invocation-log entry contract
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin main

          dispatch_note="$(
            git diff --name-only origin/main...HEAD |
              awk '/^docs\/reviews\/WP-SCP-024\/[^\/]+\/DISPATCH-NOTE\.md$/ { note = $0 } END { print note }'
          )"

          if [ -z "$dispatch_note" ]; then
            # This PR did not touch a WP-SCP-024 cascade DISPATCH-NOTE.md,
            # so there is nothing for invariant 2 to enforce.
            exit 0
          fi

          scripts/check-invocation-log-entry.sh \
            --diff-base origin/main \
            --dispatch-note "$dispatch_note" \
            --status-md STATUS.md \
            --branch-protection-log docs/reviews/WP-SCP-020/branch-protection-log.md
