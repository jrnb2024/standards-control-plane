# WP-SCP-024 024B-extras — CI wiring for the invocation-log gate.
#
# D-047 ratifies the break-glass restore flow and this workflow wiring.
# Plan-doc invariant 2 still governs the enforcement script itself;
# this workflow just feeds it the correct slice-local arguments.
#
# Critical bootstrap guard: paths-ignore excludes 024A / 024B-*
# tooling slices, and the job body short-circuits tooling slices or
# PRs with no cascade note in diff.

name: check-invocation-log-entry

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "docs/reviews/WP-SCP-024/024[C-Z]*/**"
      - "docs/reviews/WP-SCP-020/branch-protection-log.md"
      - "STATUS.md"
    paths-ignore:
      - "docs/reviews/WP-SCP-024/024[AB]*/**"

permissions:
  contents: read

jobs:
  check-invocation-log-entry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve dispatch note path
        id: resolve-dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_files="$(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")"
          dispatch_note="$(printf '%s\n' "$pr_files" | grep -E '^docs/reviews/WP-SCP-024/024[A-Za-z][^/]*/DISPATCH-NOTE.md$' | tail -n1 || true)"
          if [ -z "$dispatch_note" ]; then
            echo "No cascade-slice DISPATCH-NOTE found in PR diff; not a cohort cascade slice - nothing to enforce."
            printf 'enforce=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slice_id="$(basename "$(dirname "$dispatch_note")")"
          case "$slice_id" in
            024A|024B-core|024B-extras|024G)
              echo "Tooling slice ($slice_id); no enforcement needed."
              printf 'enforce=false\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          printf 'enforce=true\n' >> "$GITHUB_OUTPUT"
          printf 'dispatch_note=%s\n' "$dispatch_note" >> "$GITHUB_OUTPUT"

      - name: Check invocation log entry
        if: steps.resolve-dispatch.outputs.enforce == 'true'
        shell: bash
        env:
          dispatch_note: ${{ steps.resolve-dispatch.outputs.dispatch_note }}
        run: |
          set -euo pipefail
          scripts/check-invocation-log-entry.sh \
            --diff-base origin/main \
            --dispatch-note "$dispatch_note" \
            --status-md STATUS.md \
            --branch-protection-log docs/reviews/WP-SCP-020/branch-protection-log.md
