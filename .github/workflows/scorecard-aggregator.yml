name: scorecard-aggregator
# WP-SCP-023 023C — Cross-repo scorecard aggregator. Closes D-042.
#
# Weekly cron pulls per-adopter scorecard-emit.json artifacts from the
# repos listed in `docs/scorecards/opt-in-registry.yaml`, verifies each
# emit's OIDC artifact attestation against the SCP reusable workflow
# path + SHA pin (`gh attestation verify --signer-workflow`), aggregates
# verified emits into `output/scorecards/index.json`, and opens a PR
# for operator review (single-operator self-merge per D-040).
#
# Trust model:
#   - Per-emit: GitHub Actions Artifact Attestation (OIDC) verified at
#     adopter level via `gh attestation verify --signer-workflow`.
#   - Index: rooted in git's required-signed-commits (020J) +
#     `output/scorecards/** @jrnb2024` CODEOWNERS coverage (023A) +
#     branch-protection on main (020D2).
#
# Two-job permission scoping (closes 023A R1 COR-MAJ-003 + MAJ-SAFE-001
# pattern, mirrored from slice 023B's attest-scorecard split):
#   - aggregate (read-only + attestations: read for `gh attestation
#     verify`)
#   - commit (gated on aggregate success; contents: write +
#     pull-requests: write to push branch + open PR)
#
# Failure handling: verification failures + unreachable adopters +
# missing emits all record per-adopter rows with status + error string;
# never silently dropped. Aggregator FAILS the run only on
# infrastructure errors.

on:
  schedule:
    # Weekly Monday 06:00 UTC. Operator can manually trigger via
    # `gh workflow run scorecard-aggregator.yml`.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Workflow-level permissions are intentionally minimal; OIDC + write
# permissions are job-scoped below.
permissions:
  contents: read

jobs:
  aggregate:
    name: scp/scorecard-aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      adopter_count: ${{ steps.aggregate.outputs.adopter_count }}
      verified_count: ${{ steps.aggregate.outputs.verified_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pyyaml + jsonschema (hash-pinned via requirements/policy-check.txt)
        shell: bash
        run: |
          set -euo pipefail
          # Reuses the policy-check.yml requirements lockfile (slice 020M
          # supply-chain hash-pinning per D-038). pyyaml + jsonschema are
          # the only deps the aggregator needs; both are in that lockfile.
          python3 -m pip install --require-hashes --no-deps \
            -r requirements/policy-check.txt

      - name: Aggregate emits
        id: aggregate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/scorecards
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import jsonschema
          import yaml

          REPO_ROOT = Path.cwd()
          REGISTRY_PATH = REPO_ROOT / "docs" / "scorecards" / "opt-in-registry.yaml"
          REGISTRY_SCHEMA_PATH = REPO_ROOT / "schemas" / "scorecard-opt-in-registry.schema.json"
          INDEX_PATH = REPO_ROOT / "output" / "scorecards" / "index.json"
          INDEX_SCHEMA_PATH = REPO_ROOT / "schemas" / "scorecard-index.schema.json"
          EMIT_SCHEMA_PATH = REPO_ROOT / "schemas" / "scorecard-emit.schema.json"

          # SCP source repo prefix — runtime defence-in-depth on top of the
          # schema regex anchor (closes 023C R1 MAJ-SAFE-001 / CG-MIN-005).
          # Any expected_scp_workflow_ref that does not start with this
          # prefix is rejected before passing to `gh attestation verify`.
          # Schema validation already enforces this; this runtime check is
          # belt-and-braces.
          SCP_WORKFLOW_REF_PREFIX = "jrnb2024/standards-control-plane-/.github/workflows/"

          # Staleness threshold: a green policy-check run older than 7d
          # produces a no_emit row (closes 023C R1 CG-MAJ-001 — DISPATCH-NOTE
          # AC (vii) named this; the implementation was missing it).
          STALENESS_THRESHOLD_DAYS = 7

          def emit_error(message: str) -> None:
              print(f"::error file=.github/workflows/scorecard-aggregator.yml,title=SCP-E001::{message}")

          # Load registry + schemas.
          if not REGISTRY_PATH.is_file():
              emit_error(f"opt-in-registry not found at {REGISTRY_PATH}")
              sys.exit(1)
          registry = yaml.safe_load(REGISTRY_PATH.read_text(encoding="utf-8"))
          registry_schema = json.loads(REGISTRY_SCHEMA_PATH.read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator(
              registry_schema, format_checker=jsonschema.FormatChecker()
          ).validate(registry)

          emit_schema = json.loads(EMIT_SCHEMA_PATH.read_text(encoding="utf-8"))
          emit_validator = jsonschema.Draft202012Validator(
              emit_schema, format_checker=jsonschema.FormatChecker()
          )

          # Load prior index for unreachable-row retention (closes 023C R1
          # CG-MIN-004 — plan-doc §5 specified "row from the prior index is
          # retained" for unreachable adopters).
          prior_rows_by_repo: dict = {}
          if INDEX_PATH.is_file():
              try:
                  prior_index = json.loads(INDEX_PATH.read_text(encoding="utf-8"))
                  for prior_row in prior_index.get("adopters", []):
                      if isinstance(prior_row, dict) and isinstance(prior_row.get("repo"), str):
                          prior_rows_by_repo[prior_row["repo"]] = prior_row
              except (json.JSONDecodeError, OSError, UnicodeDecodeError):
                  pass

          adopters_in = registry.get("adopters", [])
          # Sort canonically by repo for deterministic output.
          adopters_in = sorted(adopters_in, key=lambda a: a.get("repo", ""))
          adopter_rows = []
          verified = 0

          run_id = int(os.environ.get("GITHUB_RUN_ID", "0"))
          now_dt = datetime.now(tz=timezone.utc)
          now = now_dt.strftime("%Y-%m-%dT%H:%M:%SZ")
          staleness_horizon = now_dt - timedelta(days=STALENESS_THRESHOLD_DAYS)

          for adopter in adopters_in:
              repo = adopter["repo"]
              default_branch = adopter["default_branch"]
              expected_workflow_ref = adopter["expected_scp_workflow_ref"]

              row: dict = {"repo": repo}

              # Defence-in-depth: reject expected_scp_workflow_ref that doesn't
              # start with the SCP source prefix. Schema validation already
              # enforces this; this runtime check guards against future
              # schema-drift mistakes (closes 023C R1 MAJ-SAFE-001).
              if not expected_workflow_ref.startswith(SCP_WORKFLOW_REF_PREFIX):
                  row["status"] = "verification_failure"
                  row["error"] = (
                      f"expected_scp_workflow_ref must start with "
                      f"{SCP_WORKFLOW_REF_PREFIX}; got: "
                      f"{expected_workflow_ref[:200]}. "
                      f"This is defence-in-depth on top of the schema "
                      f"regex; if you see this, the schema and the "
                      f"runtime check have drifted."
                  )
                  adopter_rows.append(row)
                  continue

              # 1. Find latest green policy-check run on default branch.
              try:
                  result = subprocess.run(
                      [
                          "gh", "run", "list",
                          "--repo", repo,
                          "--branch", default_branch,
                          "--workflow", "policy-check.yml",
                          "--status", "success",
                          "--limit", "1",
                          "--json", "databaseId,headSha,createdAt",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=60,
                      check=False,
                  )
              except (subprocess.TimeoutExpired, FileNotFoundError) as e:
                  # Plan-doc §5: prior-row retention for unreachable adopters
                  # (closes 023C R1 CG-MIN-004). If a prior row exists for
                  # this repo in the previous index, retain its data
                  # alongside the unreachable status; the operator sees both
                  # "this is what we last knew" + "this is why we couldn't
                  # refresh it." The error string distinguishes the two
                  # cases.
                  prior = prior_rows_by_repo.get(repo, {})
                  if prior.get("status") == "verified":
                      row.update({k: v for k, v in prior.items() if k not in ("status", "error", "repo")})
                  row["status"] = "unreachable"
                  row["error"] = f"gh run list failed: {type(e).__name__}: {str(e)[:400]}; retained prior row: {prior.get('status') == 'verified'}"
                  adopter_rows.append(row)
                  continue
              if result.returncode != 0:
                  prior = prior_rows_by_repo.get(repo, {})
                  if prior.get("status") == "verified":
                      row.update({k: v for k, v in prior.items() if k not in ("status", "error", "repo")})
                  row["status"] = "unreachable"
                  row["error"] = f"gh run list exited {result.returncode}: {result.stderr.strip()[:400]}; retained prior row: {prior.get('status') == 'verified'}"
                  adopter_rows.append(row)
                  continue
              try:
                  runs = json.loads(result.stdout) if result.stdout else []
              except json.JSONDecodeError:
                  runs = []
              if not runs:
                  row["status"] = "no_emit"
                  row["error"] = "no green policy-check.yml run found on default branch"
                  adopter_rows.append(row)
                  continue
              latest = runs[0]
              run_id_adopter = int(latest.get("databaseId", 0))
              head_sha = str(latest.get("headSha", ""))
              created_at_str = str(latest.get("createdAt", ""))

              # Staleness check (closes 023C R1 CG-MAJ-001 — DISPATCH-NOTE
              # AC (vii) named the 7-day threshold but the implementation
              # was missing it). A run older than STALENESS_THRESHOLD_DAYS
              # records as no_emit.
              try:
                  if created_at_str.endswith("Z"):
                      created_at = datetime.fromisoformat(created_at_str.replace("Z", "+00:00"))
                  else:
                      created_at = datetime.fromisoformat(created_at_str)
                  if created_at.tzinfo is None:
                      created_at = created_at.replace(tzinfo=timezone.utc)
              except (ValueError, TypeError):
                  created_at = None

              if created_at is None:
                  row["last_emit_run_id"] = run_id_adopter
                  if re.fullmatch(r"[0-9a-f]{40}", head_sha):
                      row["last_emit_commit"] = head_sha
                  row["status"] = "verification_failure"
                  row["error"] = f"could not parse createdAt from gh run list response: {created_at_str[:200]}"
                  adopter_rows.append(row)
                  continue

              if created_at < staleness_horizon:
                  age_days = (now_dt - created_at).days
                  row["status"] = "no_emit"
                  row["error"] = (
                      f"latest green policy-check run is {age_days}d old "
                      f"(threshold: {STALENESS_THRESHOLD_DAYS}d); "
                      f"no fresh emit available"
                  )
                  adopter_rows.append(row)
                  continue

              row["last_emit_run_id"] = run_id_adopter
              if re.fullmatch(r"[0-9a-f]{40}", head_sha):
                  row["last_emit_commit"] = head_sha

              # 2. Download scorecard-emit artifact.
              with tempfile.TemporaryDirectory(prefix="scp-aggr-") as tmp:
                  download = subprocess.run(
                      [
                          "gh", "run", "download", str(run_id_adopter),
                          "--repo", repo,
                          "--name", "scorecard-emit",
                          "--dir", tmp,
                      ],
                      capture_output=True,
                      text=True,
                      timeout=60,
                      check=False,
                  )
                  if download.returncode != 0:
                      row["status"] = "no_emit"
                      row["error"] = (
                          f"gh run download exited {download.returncode}: "
                          f"{download.stderr.strip()[:400]} "
                          f"(adopter may not have set scorecard-emit: true)"
                      )
                      adopter_rows.append(row)
                      continue
                  emit_path = Path(tmp) / "scorecard-emit.json"
                  if not emit_path.is_file():
                      row["status"] = "no_emit"
                      row["error"] = "scorecard-emit.json missing from downloaded artifact"
                      adopter_rows.append(row)
                      continue

                  # 3. Verify OIDC attestation against expected_workflow_ref.
                  # The --signer-workflow flag binds the attestation's
                  # job_workflow_ref OIDC claim to the SCP reusable
                  # workflow path + SHA pin (closes 023A R3 MAJ-001 +
                  # MIN-SAFE-R3-001). JWKS-only verification is not
                  # sufficient — must include --signer-workflow per D-042.
                  verify = subprocess.run(
                      [
                          "gh", "attestation", "verify",
                          str(emit_path),
                          "--repo", repo,
                          "--signer-workflow", expected_workflow_ref,
                      ],
                      capture_output=True,
                      text=True,
                      timeout=60,
                      check=False,
                  )
                  if verify.returncode != 0:
                      row["status"] = "verification_failure"
                      row["error"] = (
                          f"gh attestation verify --signer-workflow exited "
                          f"{verify.returncode}: {verify.stderr.strip()[:400]}. "
                          f"The adopter's wrapper may have bumped its SHA "
                          f"pin without updating expected_scp_workflow_ref "
                          f"in opt-in-registry.yaml — both must move "
                          f"together."
                      )
                      adopter_rows.append(row)
                      continue

                  # 4. Schema-validate emit.
                  try:
                      emit = json.loads(emit_path.read_text(encoding="utf-8"))
                      emit_validator.validate(emit)
                  except (json.JSONDecodeError, jsonschema.ValidationError, OSError, UnicodeDecodeError) as e:
                      row["status"] = "verification_failure"
                      row["error"] = f"emit schema validation failed: {type(e).__name__}: {str(e)[:400]}"
                      adopter_rows.append(row)
                      continue

                  # 5. Pass-through verified emit fields into the index row.
                  row["status"] = "verified"
                  row["last_emit_emitted_at"] = emit.get("emitted_at", "")
                  row["verdict"] = emit.get("verdict", "")
                  row["rule_counts"] = emit.get("rule_counts", {})
                  row["waivers_aggregate"] = emit.get("waivers_aggregate", {})
                  row["rule_config_aggregate"] = emit.get("rule_config_aggregate", {})
                  row["scp_version"] = emit.get("scp_version", "")
                  row["ref"] = emit.get("ref", "")
                  verified += 1
                  adopter_rows.append(row)

          index = {
              "schema_version": "0.1",
              "aggregated_at": now,
              "aggregator_run_id": run_id,
              "adopters": adopter_rows,
          }

          # Schema-validate the index we just built.
          index_schema = json.loads(INDEX_SCHEMA_PATH.read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator(
              index_schema, format_checker=jsonschema.FormatChecker()
          ).validate(index)

          INDEX_PATH.write_text(json.dumps(index, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"::notice file={INDEX_PATH}::scorecard index built ({len(adopter_rows)} adopters; {verified} verified)")

          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as fh:
                  fh.write(f"adopter_count={len(adopter_rows)}\n")
                  fh.write(f"verified_count={verified}\n")
          PY

      - name: Upload index artifact for commit job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-index
          path: output/scorecards/index.json
          if-no-files-found: error

  commit:
    name: scp/scorecard-commit
    needs: aggregate
    if: needs.aggregate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download index artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorecard-index
          path: output/scorecards/

      - name: Set up Python (for markdown generator)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Generate markdown report (WP-SCP-023 023D)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-scorecard-report.py

      - name: Open scorecard PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: scorecards/${{ github.run_id }}
          base: main
          delete-branch: true
          title: "chore(scorecards): weekly aggregator run ${{ github.run_id }}"
          commit-message: |
            chore(scorecards): weekly aggregator run ${{ github.run_id }}

            Adopters: ${{ needs.aggregate.outputs.adopter_count }}
            Verified: ${{ needs.aggregate.outputs.verified_count }}

            Schema: schemas/scorecard-index.schema.json
            Trust: required-signed-commits + CODEOWNERS + branch-protection
          body: |
            Auto-generated by `.github/workflows/scorecard-aggregator.yml` per WP-SCP-023 023C / D-042 + 023D / D-043.

            **Aggregator run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Adopters processed:** ${{ needs.aggregate.outputs.adopter_count }}
            **Verified:** ${{ needs.aggregate.outputs.verified_count }}

            This PR commits the updated `output/scorecards/index.json` AND the rendered markdown report under `docs/scorecards/<aggregated_at-date>.md` (slice 023D).

            Verification failures + unreachable adopters + missing emits
            are recorded loudly in the per-adopter rows of
            `output/scorecards/index.json` (status + error string), not
            silently dropped.

            **Trust:** index trust is rooted in git's required-signed-commits
            (020J) + `output/scorecards/** @jrnb2024` CODEOWNERS (023A) +
            branch-protection on main (020D2). Per-emit OIDC verification
            via `gh attestation verify --signer-workflow` per D-042.

            **Privacy:** the index + markdown report NEVER carry waiver content
            (`reason`, `approved_by`, `waiver_id` strings) per WP-SCP-023
            plan-doc invariant 2; schema enforces `additionalProperties: false`.

            Operator: review the diff + merge to land the index update on `main`.
          add-paths: |
            output/scorecards/index.json
            docs/scorecards/*.md
