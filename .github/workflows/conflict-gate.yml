name: rego-vs-python-conflict

# Conflict-gate CI job per WP-SCP-020 §4 020C.1 (iii) + (iv).
# Runs both Rego and Python evaluators against the shared fixture
# tree at tests/conflict_gate/fixtures/ and asserts they agree.
# Disagreement = SCP-E005 = merge-blocked.

on:
  pull_request:
    paths:
      - "policies/**"
      - "tests/conflict_gate/**"
      - "src/standards_control_plane/evaluators/**"
      - "src/standards_control_plane/audit.py"
      - "src/standards_control_plane/waivers.py"
      - ".github/workflows/conflict-gate.yml"
      - "scripts/.tool-versions"
      - "scripts/scp-policy-check.lock"

permissions:
  contents: read

jobs:
  rego-vs-python-conflict:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout caller PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          pip install -e '.[dev]'
          pip install pyyaml>=6.0

      - name: Install pinned OPA runtime
        # Closes WP-SCP-022 R1 completeness MAJ-004: align supply-chain
        # pinning with policy-check.yml. Reads the OPA version from
        # scripts/.tool-versions, the platform SHA256 from
        # scripts/scp-policy-check.lock, verifies SHA256 after download,
        # and runs gh attestation verify against open-policy-agent/opa
        # before placing the binary on PATH.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local message="$2"
            echo "::error file=.github/workflows/conflict-gate.yml,title=${code}::${message}"
          }

          OPA_VERSION="$(awk '$1 == "opa" {print $2; exit}' scripts/.tool-versions)" || {
            emit_error "SCP-E001" "missing OPA version pin in scripts/.tool-versions"
            exit 1
          }
          if [ -z "${OPA_VERSION}" ]; then
            emit_error "SCP-E001" "missing OPA version pin in scripts/.tool-versions"
            exit 1
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              PLATFORM_KEY="linux-x64"
              OPA_ASSET="opa_linux_amd64"
              ;;
            aarch64|arm64)
              PLATFORM_KEY="linux-arm64"
              OPA_ASSET="opa_linux_arm64"
              ;;
            *)
              emit_error "SCP-E001" "unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          OPA_SHA256="$(python3 - <<PY
          import json
          import sys
          payload = json.load(open("scripts/scp-policy-check.lock"))
          try:
              print(payload["opa"]["${PLATFORM_KEY}"]["sha256"])
          except KeyError as exc:
              raise SystemExit(f"missing lockfile field: {exc}")
          PY
          )" || {
            emit_error "SCP-E001" "missing OPA SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
            exit 1
          }

          OPA_URL="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/${OPA_ASSET}"
          curl --fail --silent --show-error --location "${OPA_URL}" --output /tmp/opa || {
            emit_error "SCP-E001" "unable to download OPA v${OPA_VERSION} from ${OPA_URL}"
            exit 1
          }

          actual_sha="$(sha256sum /tmp/opa | awk '{print $1}')"
          if [ "${actual_sha}" != "${OPA_SHA256}" ]; then
            emit_error "SCP-E001" "OPA v${OPA_VERSION} SHA256 mismatch: expected ${OPA_SHA256}, got ${actual_sha}"
            exit 1
          fi

          gh attestation verify /tmp/opa --repo open-policy-agent/opa >/dev/null 2>&1 || {
            emit_error "SCP-E001" "OPA attestation verification failed for v${OPA_VERSION}"
            exit 1
          }

          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Run conflict-gate test
        id: conflict-gate
        run: |
          set -euo pipefail
          if ! python -m pytest tests/conflict_gate/ -xvs --tb=short; then
            echo "::error file=tests/conflict_gate/,title=SCP-E005::rego-vs-python conflict-gate failed — see Unblock procedure in docs/integrations/conflict-gate.md"
            exit 1
          fi
