name: rego-vs-python-conflict

# Conflict-gate CI job per WP-SCP-020 §4 020C.1 (iii) + (iv).
# Runs both Rego and Python evaluators against the shared fixture
# tree at tests/conflict_gate/fixtures/ and asserts they agree.
# Disagreement = SCP-E005 = merge-blocked.

on:
  pull_request:
    paths:
      - "policies/**"
      - "tests/conflict_gate/**"
      - "src/standards_control_plane/evaluators/**"
      - "src/standards_control_plane/audit.py"
      - "src/standards_control_plane/waivers.py"
      - ".github/workflows/conflict-gate.yml"
      - "scripts/.tool-versions"
      - "scripts/scp-policy-check.lock"
      # Closes 020N R1 SAFE-MIN-002: hash-pinned Python deps lockfile is
      # load-bearing for the conflict-gate's Python evaluator install.
      # Renovate auto-bump PRs that touch only requirements/conflict-gate.txt
      # would otherwise miss the conflict-gate workflow.
      - "requirements/conflict-gate.in"
      - "requirements/conflict-gate.txt"

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  rego-vs-python-conflict:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout caller PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies (hash-pinned)
        run: |
          set -euo pipefail
          # Hash-pinned install of all PyPI deps for the Python evaluator.
          # Closes WP-SCP-022 TF-020M-001 — slice 020N. Symmetric with
          # policy-check.yml's requirements/policy-check.txt pattern (slice
          # 020M, v1.0.1). The lockfile pins all PyPI deps from
          # pyproject.toml [project.dependencies] + [project.optional-dependencies.dev]
          # plus their full transitive closure with all-platform wheel SHA256s.
          python -m pip install --upgrade pip >/dev/null
          pip install --require-hashes -r requirements/conflict-gate.txt
          # Local vendored ct-auth wheel — not on PyPI; CODEOWNERS-protected
          # via vendor/** @jrnb2024 (see ADOPT-001 §12.7.13). Installed with
          # --no-deps because all PyPI deps are already hash-pinned above.
          # ct-auth wheel METADATA declares: PyJWT>=2.0, cryptography>=40.0,
          # httpx>=0.24, fastapi>=0.100 (extra="fastapi"). All four are
          # explicit top-level pins in requirements/conflict-gate.in (closes
          # 020N R1 SAFE-MAJ-001 — pyjwt + cryptography added in fix-round-1
          # because they were absent from the initial lockfile).
          pip install --no-deps vendor/python/ct_auth-0.8.0-py3-none-any.whl
          # Install the local SCP package itself in editable mode without
          # re-resolving deps (already hash-verified above).
          pip install --no-deps -e .
          # Version-pin assertion: confirm the pinned versions are now active
          # (defends against future-PR drift; mirrors policy-check.yml's
          # SAFE-MAJ-002 pattern from slice 020M). Strings must be updated
          # in lockstep with requirements/conflict-gate.txt regeneration —
          # see the REGENERATION INVARIANT in requirements/conflict-gate.in.
          python -c 'import yaml, jsonschema, fastapi, pydantic; assert yaml.__version__ == "6.0.3", f"pyyaml: {yaml.__version__}"; assert jsonschema.__version__ == "4.26.0", f"jsonschema: {jsonschema.__version__}"; assert fastapi.__version__ == "0.136.1", f"fastapi: {fastapi.__version__}"; assert pydantic.VERSION == "2.13.3", f"pydantic: {pydantic.VERSION}"'

      - name: Install pinned OPA runtime
        # Closes WP-SCP-022 R1 completeness MAJ-004: align supply-chain
        # pinning with policy-check.yml. Reads the OPA version from
        # scripts/.tool-versions, the platform SHA256 from
        # scripts/scp-policy-check.lock, verifies SHA256 after download,
        # and runs gh attestation verify against open-policy-agent/opa
        # before placing the binary on PATH.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          emit_error() {
            local code="$1"
            local message="$2"
            echo "::error file=.github/workflows/conflict-gate.yml,title=${code}::${message}"
          }

          OPA_VERSION="$(awk '$1 == "opa" {print $2; exit}' scripts/.tool-versions)" || {
            emit_error "SCP-E001" "missing OPA version pin in scripts/.tool-versions"
            exit 1
          }
          if [ -z "${OPA_VERSION}" ]; then
            emit_error "SCP-E001" "missing OPA version pin in scripts/.tool-versions"
            exit 1
          fi

          case "$(uname -m)" in
            x86_64|amd64)
              PLATFORM_KEY="linux-x64"
              OPA_ASSET="opa_linux_amd64"
              ;;
            aarch64|arm64)
              PLATFORM_KEY="linux-arm64"
              OPA_ASSET="opa_linux_arm64"
              ;;
            *)
              emit_error "SCP-E001" "unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          OPA_SHA256="$(python3 - <<PY
          import json
          import sys
          payload = json.load(open("scripts/scp-policy-check.lock"))
          try:
              print(payload["opa"]["${PLATFORM_KEY}"]["sha256"])
          except KeyError as exc:
              raise SystemExit(f"missing lockfile field: {exc}")
          PY
          )" || {
            emit_error "SCP-E001" "missing OPA SHA256 pin in scripts/scp-policy-check.lock for ${PLATFORM_KEY}"
            exit 1
          }

          OPA_URL="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/${OPA_ASSET}"
          curl --fail --silent --show-error --location "${OPA_URL}" --output /tmp/opa || {
            emit_error "SCP-E001" "unable to download OPA v${OPA_VERSION} from ${OPA_URL}"
            exit 1
          }

          actual_sha="$(sha256sum /tmp/opa | awk '{print $1}')"
          if [ "${actual_sha}" != "${OPA_SHA256}" ]; then
            emit_error "SCP-E001" "OPA v${OPA_VERSION} SHA256 mismatch: expected ${OPA_SHA256}, got ${actual_sha}"
            exit 1
          fi

          # SHA256 verification (above) is the primary security control
          # and is hard-fail. gh attestation verify is the secondary
          # Sigstore layer; OPA v1.15.2 (and earlier 1.x releases) does
          # not publish Sigstore attestations to GitHub's attestation
          # database (HTTP 404 on lookup). Treating this as soft-warn:
          # log the result for diagnostics, but do not block CI on the
          # absence of an attestation that upstream hasn't published
          # yet. Bump to hard-fail when OPA begins publishing
          # attestations OR when we pin to a version that already does.
          # Closes WP-SCP-022 R2 follow-up of MAJ-004 mitigation.
          if gh attestation verify /tmp/opa --repo open-policy-agent/opa 2>&1; then
            echo "OPA Sigstore attestation verified for v${OPA_VERSION}"
          else
            echo "::warning file=.github/workflows/conflict-gate.yml,title=SCP-E001-soft::OPA Sigstore attestation not available for v${OPA_VERSION}; SHA256 verification (primary) is the security floor until upstream publishes attestations"
          fi

          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Run conflict-gate test
        id: conflict-gate
        run: |
          set -euo pipefail
          if ! python -m pytest tests/conflict_gate/ -xvs --tb=short; then
            echo "::error file=tests/conflict_gate/,title=SCP-E005::rego-vs-python conflict-gate failed — see Unblock procedure in docs/integrations/conflict-gate.md"
            exit 1
          fi
