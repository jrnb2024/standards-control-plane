services:
  venv-service:
    local:
      status: ready
      runtime_contract:
        start_command: "-m uvicorn app:app"
        working_dir: .
        interpreter: python-venv
        required_infra: []
        group: platform-core
        auth_contract:
          accepted_modes:
            - mode: mode.api_key
              issuer: control-tower
