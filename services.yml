# Standards Control Plane — service manifest.
#
# Conforms to SVC-001 (runtime contract), SVC-002 (health endpoint),
# and SVC-003 (auth contract). SCP dogfoods its own rules against this
# file as part of WP-SCP-019 slice 019D.
#
# Only the `local` environment is declared here. Docker and staging
# deployments use the same module entry point but bind 0.0.0.0 and
# ENV=production (see Dockerfile, docker-compose.yml,
# docker-compose.staging.yml, docs/deployment.md).

services:
  scp:
    healthcheck: /health
    local:
      status: ready
      runtime_contract:
        # `python -m standards_control_plane.cli serve ...` is what backs
        # the `standards-control-plane` console script declared in
        # pyproject.toml. Dockerfile and compose files run the same
        # module with --host 0.0.0.0.
        start_command: "-m standards_control_plane.cli serve --host 127.0.0.1 --port 3787"
        working_dir: .
        interpreter: python-venv
        venv_path: .venv
        required_infra: []
        group: platform-core
        auth_contract:
          accepted_modes:
            - mode: mode.user_oidc
              # Local uses CT_APP_ID=scp-dev per .env.example; staging
              # uses CT_APP_ID=scp per .env.staging.example.
              audience: scp-dev
              jwks_url: https://control-tower.brokapps.ai/api/v1/.well-known/jwks.json
            - mode: mode.bearer_legacy
              # WP-SCP-022 020H.4 rule-config-disabled canary — DO NOT
              # MERGE. SCP-R-001 requires deprecation_close_date in the
              # allowed set {"2026-06-30","2026-09-30"}. The value
              # below is deliberately outside the set; SCP-R-001 would
              # normally fire SCP-E003. The .scp/rule-config.yaml on
              # this branch disables SCP-R-001 with a future expires_at,
              # so the gate is expected to PASS (deny suppressed by
              # rule-config). Closes TF-020H1-004 (rule-config disable
              # canary missing).
              deprecation_close_date: "2099-12-31"
              waiver_ref: scp-bearer-legacy-migration
