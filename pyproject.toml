[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "standards-control-plane"
version = "0.1.0"
description = "Structured consult-and-audit control plane for agent-assisted software delivery"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "httpx>=0.24",
    "jsonschema>=4.25.0",
    "pydantic>=2.12.0",
    "ct-auth[fastapi] @ file:vendor/python/ct_auth-0.8.0-py3-none-any.whl",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.15.0",
    "mypy>=1.20.0",
]
mcp = [
    "mcp @ https://files.pythonhosted.org/packages/source/m/mcp/mcp-1.27.0.tar.gz#sha256=d3dc35a7eec0d458c1da4976a48f982097ddaab87e278c5511d5a4a56e852b83",
    "cryptography>=41",
]

[project.scripts]
standards-control-plane = "standards_control_plane.cli:main"
scp-mcp-server = "standards_control_plane.mcp_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
