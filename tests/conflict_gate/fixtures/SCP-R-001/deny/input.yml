# Conflict-gate fixture: SCP-R-001 deny path
# A services-by-name map with an UNAPPROVED auth.mode triggers a deny
# from both Rego (SCP-R-001 — flat services.<name>.auth.mode body)
# and the Python evaluator. The shape mirrors the canonical SVC-003
# services.yml, which is what SCP-R-001 was designed against.
services:
  scp-fixture-deny:
    auth:
      mode: mode.invalid_unapproved
      audience: scp-fixture
