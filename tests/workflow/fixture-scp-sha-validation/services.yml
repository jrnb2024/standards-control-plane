services:
  fixture-scp-sha-validation:
    healthcheck: /health
    local:
      status: ready
      runtime_contract:
        start_command: ./run-fixture
        working_dir: .
        interpreter: none
        required_infra: []
        group: workflow-fixtures
        auth_contract:
          accepted_modes:
            - mode: mode.user_oidc
              audience: fixture-scp-sha-validation
              jwks_url: https://example.com/.well-known/jwks.json
