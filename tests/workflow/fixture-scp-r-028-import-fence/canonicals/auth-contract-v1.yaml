# Frozen fixture canonical (NOT the live CT contract). Test data for the
# LINKAGE check: `validate_token` is a tier_deny python primitive, so an adopter
# that imports ct-auth and re-declares it triggers SCP-R-010's deny-class
# finding. `*_verified` comes from simulate-auth-verified, NEVER from these bytes.
schema_version: 1
claim_shape_version: 2.0.0
issuers:
- iss: https://ct.brokapps.ai
  jwks_url: https://ct.brokapps.ai/.well-known/jwks.json
  alg: RS256
  audience: control-tower
protected_primitives:
  tier_deny:
    python:
    - validate_token
    - decode_token_unverified
    typescript:
    - validateToken
    go:
    - WithCTJWT
  tier_warn:
    python:
    - has_permission
    typescript:
    - hasPermission
    go:
    - VerifiedClaims
